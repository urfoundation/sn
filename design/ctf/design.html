<!--
  Design for ur.xyz/ctf ("Capture the flag"), CAPTURETHEFLAG.md §9.2. This file is the page's design: it
  replaced the "ur.xyz CTF page" canvas on 2026-11-11, and changes to the page are made here. Open it in a
  browser; it needs flags-4x3-sprite.svg beside it.
  Mock data: 26 simulated epochs on the network's real country coverage (August to November 2026).
  Preview states with query parameters: ?page=ke (the Kenya country page, /ctf/ke), ?focus=np (the hub
  filtered to open provider slots), ?country=tm (visitor country), ?expanded=af (an opened tile on
  touch sizes), ?motion=0 (no animation), ?prelaunch (the note at the top of the hub, and compact at the top of a
  country page with ?page=, before capture the flag starts, 15 days 3 hours 38 minutes before epoch 8 on a clock of
  its own; ?prelaunch=15 starts it 15 seconds from now, to see the last minute and the turn). Resize the window below 1100px for tablet and below 600px for mobile.
  The real page is built in web/ur.xyz (Astro) with self-hosted fonts and flag files; see SEO.md.
-->
<style>
/* ur.xyz /ctf mockup: one stylesheet for the desktop, tablet and mobile artboards.
   Desktop is the base. Touch sizes (1099px and below) replace hover with tap to expand;
   mobile (600px and below) also compacts the grid into tiles. Nothing scrolls sideways. */
body{margin:0;background:#101010}
a{color:#ED8FFF}a:hover{color:#F6C4FF}
.ctf{--bg:#101010;--panel:#141414;--line:#242424;--line2:#303030;--ink:#F2F4EF;--soft:#C9CCC6;--muted:#8F938C;--faint:#868B83;--acc:#ED8FFF;--blue:#7B95FF;--green:#87FB67;background:var(--bg);color:var(--ink);font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:40px;overflow-x:clip}
.shell{width:min(1200px,calc(100% - 64px));margin:0 auto}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
.px{font-family:Silkscreen,"JetBrains Mono",monospace;font-weight:400}
.label{font:500 11px/1.2 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.touch-block,.mob-only{display:none}
.mockbar{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 10px;padding:8px 16px;background:#0c0c0c;border-bottom:1px solid var(--line);font:400 12px "JetBrains Mono",monospace;color:var(--muted);text-align:center}
.mockbar b{color:#101010;background:#FF6C58;font:700 10px/1 "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;padding:4px 6px;border-radius:4px}

/* nav and header */
.nav{display:flex;align-items:center;justify-content:space-between;gap:4px 24px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.nav a{color:var(--muted);text-decoration:none;font-size:14px;display:inline-flex;align-items:center;min-height:44px;padding:0 4px;white-space:nowrap}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink)}
.nav-links{display:flex;flex-wrap:wrap;gap:0 18px}
.brand{gap:10px;color:var(--ink)!important;font-weight:600;font-size:17px!important;letter-spacing:-.01em}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--acc)}
.hdr{padding:52px 0 26px;display:flex;flex-direction:column;gap:14px;max-width:780px}
.hdr h1{margin:0;font:500 clamp(36px,5vw,54px)/1.02 Inter,sans-serif;letter-spacing:-.035em}
.mission{margin:-4px 0 4px;font:500 clamp(20px,2.4vw,26px)/1.25 Inter,sans-serif;letter-spacing:-.015em;color:var(--acc)}
.intro{margin:0;font-size:17px;line-height:1.55;color:var(--soft)}
.h2{margin:0;font:500 30px/1.1 Inter,sans-serif;letter-spacing:-.02em}
.sub{margin:0;color:var(--soft);font-size:15px;line-height:1.5;max-width:660px}
.sec{margin-top:60px;display:flex;flex-direction:column;gap:18px}

/* the note above everything else until capture the flag starts (?prelaunch): its sentence, a countdown on split
   tiles in the pixel face, the blocks left with a bar that fills over each block's 12 seconds, and a flag that
   climbs its pole over the three epochs before the start (--hoist, 0 to 1) and glides up to its place as the page
   starts. The two sentences share one place, and so do the countdown and its live status, so nothing under the
   note moves when it turns live; at the start the flag waves and ten pips burst from it, five providers' (blue)
   and five extenders' (green). A screen reader hears the sentence and the time left in words, at most once a
   minute; the figures are hidden from it. Without motion nothing rolls, waves, glides or bursts. */
.start{--digit:clamp(30px,3.4vw,44px);--fw:46px;--fh:34px;margin-top:28px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"pole line clock" "pole blocks clock";align-items:center;gap:16px 44px;padding:24px 32px 22px 24px;border:1px solid rgba(237,143,255,.3);border-radius:18px;background:radial-gradient(ellipse 300px 220px at 0% 100%,rgba(237,143,255,.13),transparent 70%),#151215}
.start+.hdr{padding-top:40px}
.start-compact{--digit:clamp(22px,1.9vw,26px);--fw:30px;--fh:22px;grid-template-areas:"pole line clock";gap:8px 32px;padding:14px 24px 14px 18px;border-radius:14px;background:radial-gradient(ellipse 200px 120px at 0% 100%,rgba(237,143,255,.11),transparent 70%),#151215}
.start-compact .start-pole{min-height:60px}
.start-compact .start-line{font-size:17px;line-height:1.35}
.start-compact .start-count{gap:6px}
.start-compact .start-tiles{gap:4px}
.start-compact .start-unit{gap:5px}
.start-compact .start-num{border-radius:7px}
.start-compact .start-uname{font-size:8.5px;letter-spacing:.04em}
.start-pole{grid-area:pole;align-self:stretch;position:relative;width:calc(var(--fw) + 6px);min-height:118px}
.start-pole::before{content:"";position:absolute;left:2px;top:4px;bottom:0;width:3px;border-radius:2px;background:var(--muted)}
.start-pole::after{content:"";position:absolute;left:0;top:0;width:7px;height:7px;border-radius:50%;background:#D6E6F4;box-shadow:0 0 10px rgba(214,230,244,.45)}
.start-notch{position:absolute;left:-1px;width:9px;height:1px;background:rgba(214,230,244,.4);bottom:calc(var(--fh) + (100% - 10px - var(--fh)) / 3)}
.start-notch+.start-notch{bottom:calc(var(--fh) + (100% - 10px - var(--fh)) * 2 / 3)}
.start-car{position:absolute;top:10px;bottom:0;left:0;right:0;display:flex;align-items:flex-end;transform:translateY(calc(var(--hoist) * (var(--fh) - 100%)));transition:transform 1.8s cubic-bezier(.3,1.18,.4,1)}
.start-flag{position:relative;display:grid;place-items:center;width:var(--fw);height:var(--fh);margin-left:5px;border-radius:2px 5px 5px 2px;background:linear-gradient(90deg,transparent 22%,rgba(255,255,255,.2) 42%,transparent 58%,rgba(16,16,16,.1) 82%,transparent),linear-gradient(160deg,#F6C4FF,var(--acc) 55%,#D46FE8);box-shadow:0 0 22px rgba(237,143,255,.35);transform-origin:left center;animation:wave 2.8s ease-in-out infinite}
.start-flag b{font:400 calc(var(--fh) * .62)/1 Silkscreen,monospace;color:#101010}
.start[data-last-minute] .start-flag{animation-duration:1.4s}
.start[data-phase="live"] .start-flag{animation-duration:1.6s}
.start-burst{position:absolute;left:calc(5px + var(--fw) / 2);bottom:calc(var(--fh) / 2)}
.start-burst i{position:absolute;left:-3.5px;top:-3.5px;width:7px;height:7px;border-radius:2px;background:var(--blue);opacity:0;animation:burst 1.3s cubic-bezier(.15,.7,.3,1) .4s both}
.start-burst i:nth-child(n+6){background:var(--green)}
.start-burst i:nth-child(1){--x:-46px;--y:-30px;--r:-80deg}.start-burst i:nth-child(2){--x:12px;--y:-52px;--r:120deg}.start-burst i:nth-child(3){--x:58px;--y:-22px;--r:-140deg}.start-burst i:nth-child(4){--x:66px;--y:30px;--r:90deg}.start-burst i:nth-child(5){--x:20px;--y:58px;--r:-60deg}
.start-burst i:nth-child(6){--x:-28px;--y:-54px;--r:150deg}.start-burst i:nth-child(7){--x:40px;--y:-48px;--r:-100deg}.start-burst i:nth-child(8){--x:76px;--y:4px;--r:70deg}.start-burst i:nth-child(9){--x:48px;--y:50px;--r:-120deg}.start-burst i:nth-child(10){--x:-10px;--y:64px;--r:100deg}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(.4) rotate(0deg)}65%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1) rotate(var(--r))}}
.start-line{grid-area:line;margin:0;display:grid;font:400 clamp(19px,1.85vw,23px)/1.32 Inter,sans-serif;letter-spacing:-.01em;color:var(--ink)}
.start-line>span{grid-area:1/1}
.start-ghost{visibility:hidden}
.start-clock{grid-area:clock;display:grid}
.start-clock>*{grid-area:1/1}
.start-count{display:flex;flex-direction:column;gap:10px}
.start-tiles{display:flex;align-items:flex-start;gap:6px}
.start-unit{display:flex;flex-direction:column;align-items:center;gap:8px}
.start-num{position:relative;display:flex;direction:ltr;padding:.12em .14em .04em;border:1px solid rgba(237,143,255,.4);border-radius:10px;background:linear-gradient(180deg,#2b1a30,#1e1323 50%,#170f1b 50%,#1f1425);box-shadow:0 0 24px rgba(237,143,255,.1),inset 0 1px 0 rgba(255,225,255,.12);color:var(--acc);font:400 var(--digit)/1 Silkscreen,monospace;text-shadow:0 0 16px rgba(237,143,255,.5)}
.start-num::after{content:"";position:absolute;inset:50% 0 auto;height:1px;background:rgba(16,16,16,.65)}
.start-d{display:block;width:.62em;text-align:center}
.start-d>span{display:block;animation:roll .45s cubic-bezier(.2,.8,.2,1)}
.start-d>span.s{animation:none}
@keyframes roll{from{transform:translateY(-40%) scaleY(.6);opacity:0}}
.start-sep{padding-top:.12em;color:rgba(237,143,255,.55);font:400 var(--digit)/1 Silkscreen,monospace;animation:blink 1s steps(1,end) infinite}
@keyframes blink{50%{opacity:.25}}
.start-uname{display:flex;justify-content:center;width:0;font:400 10px/1.2 "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.start[data-last-minute] .start-num{animation:flare 1s ease-out infinite}
@keyframes flare{from{box-shadow:0 0 40px rgba(237,143,255,.5),inset 0 1px 0 rgba(255,225,255,.12)}}
.start-go{display:inline-flex;align-items:center;justify-content:center;gap:.4em;color:var(--acc);font:400 calc(var(--digit) * .9)/1 Silkscreen,monospace;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 0 22px rgba(237,143,255,.5)}
.start-go i{flex:none;width:.3em;height:.3em;border-radius:50%;background:var(--acc);animation:pulse 2s infinite}
.start[data-phase="live"] .start-count{visibility:hidden}
.start[data-phase="live"] .start-go{animation:go .9s cubic-bezier(.2,.8,.2,1)}
@keyframes go{from{opacity:0;transform:scale(.88)}}
.start-blocks{grid-area:blocks;margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.start-blocks b{display:inline-block;min-width:8ch;font:400 14px/1 Silkscreen,monospace;color:var(--ink);white-space:nowrap}
.start-track{position:relative;width:64px;height:3px;border-radius:2px;background:#2c2830;overflow:hidden}
.start-bar{position:absolute;inset:0;background:rgba(237,143,255,.75);transform-origin:left center;animation:block 12s linear both}
@keyframes block{from{transform:scaleX(0)}}
.start[data-phase="live"] .start-blocks{visibility:hidden}
.still .start-car{transition:none}
.still .start-flag,.still .start-d>span,.still .start-sep,.still .start[data-last-minute] .start-num,.still .start-go,.still .start-go i{animation:none!important}
.still .start-burst,.still .start-track{display:none}
@media (prefers-reduced-motion:reduce){.start-car{transition:none}.start-flag,.start-d>span,.start-sep,.start[data-last-minute] .start-num,.start-go,.start-go i{animation:none!important}.start-burst,.start-track{display:none}}

/* stats bar: wraps instead of scrolling; hairline separators come from the 1px gap */
.live{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.live>*{background:#0d0d0d;flex:1 1 auto}
.live .tag{display:flex;align-items:center;gap:8px;padding:14px 18px;white-space:nowrap}
.live .tag i{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:pulse 2s infinite}
.live .it{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:10px 18px;white-space:nowrap}
.live .it b{font-weight:500;font-size:17px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.live .it-btn{appearance:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;min-height:44px}
.live .it-btn:hover{background:#151015}
.live .it-btn[aria-pressed="true"]{background:#1E1320;box-shadow:inset 0 -2px 0 var(--acc)}
.live .it-btn[aria-pressed="true"] b{color:var(--acc)}
.live .it-btn:focus-visible{outline:2px solid #F2F4EF;outline-offset:-4px}
.it-hint{display:inline-flex;align-items:center;gap:6px}
.it-hint svg{transition:transform .2s ease}
.it-btn[aria-pressed="true"] .it-hint svg{transform:rotate(180deg)}
.live .it-group{gap:2px;padding:8px 10px 8px 18px}
.it-row{appearance:none;border:0;background:none;color:var(--ink);display:flex;align-items:center;gap:8px;min-height:30px;padding:0 8px;margin-left:-8px;border-radius:7px;cursor:pointer;font:inherit;text-align:left}
.it-row span{font:400 12.5px Inter,sans-serif;color:var(--soft);min-width:66px}
.live .it-row b{font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.it-row svg{color:var(--faint);transition:transform .2s ease}
.it-row:hover{background:#151015}
.it-row[aria-pressed="true"]{background:#1E1320}
.live .it-row[aria-pressed="true"] b{color:var(--acc)}
.it-row[aria-pressed="true"] svg{transform:rotate(180deg)}
.it-row:focus-visible{outline:2px solid #F2F4EF;outline-offset:1px}

/* flags */
.flag{display:block;flex:none;background-image:url(flags-4x3-sprite.svg);background-size:1600% 1600%;background-repeat:no-repeat;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);transform-origin:left center}
.f-s{width:36px;height:27px}
.f-m{width:72px;height:54px;border-radius:4px}
.f-l{width:128px;height:96px;border-radius:6px}
.pole{position:relative;padding-left:8px;display:inline-block}
.pole::before{content:"";position:absolute;left:0;top:-8px;bottom:-22px;width:3px;border-radius:2px;background:#8F938C}
.pole::after{content:"";position:absolute;left:-2px;top:-13px;width:7px;height:7px;border-radius:50%;background:#D6E6F4}
.wave .flag,.cell.hot .flag{animation:wave 2.8s ease-in-out infinite}
.cell:hover .flag{animation:wave 1.4s ease-in-out infinite}
@keyframes wave{0%,100%{transform:perspective(260px) rotateY(0deg) skewY(0deg)}30%{transform:perspective(260px) rotateY(-16deg) skewY(-2deg)}65%{transform:perspective(260px) rotateY(9deg) skewY(1.5deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes glow{0%,100%{box-shadow:inset 0 0 0 1px rgba(237,143,255,.55),0 0 16px rgba(237,143,255,.08)}50%{box-shadow:inset 0 0 0 1px rgba(237,143,255,.95),0 0 28px rgba(237,143,255,.26)}}
.still .flag,.still .cell,.still .fc,.still .live .tag i{animation:none!important}
@media (prefers-reduced-motion:reduce){.flag,.cell,.fc,.live .tag i{animation:none!important}}

/* your country */
.mine{margin-top:22px;display:grid;grid-template-columns:auto minmax(0,1fr) minmax(250px,300px);gap:28px 40px;align-items:center;padding:34px 32px 30px 38px;border:1px solid var(--line2);border-radius:18px;background:#151215}
.me-body{display:flex;flex-direction:column;gap:6px;min-width:0}
.me-name{margin:0;font:500 30px/1.1 Inter,sans-serif;letter-spacing:-.02em}
.me-amtrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:10px}
.me-amt{font-size:46px;line-height:1;color:var(--acc)}
.me-unit{font-size:20px;color:var(--acc)}
.me-msg{margin:6px 0 0;color:var(--soft);font-size:15px;line-height:1.5;max-width:580px}
.me-note{margin:10px 0 0;font:400 12.5px/1.5 "JetBrains Mono",monospace;color:var(--muted)}
.cta{display:flex;flex-direction:column;gap:10px}
.cta-note{margin:2px 0 0;font-size:12.5px;line-height:1.5;color:var(--muted)}
.pick{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.roles{display:grid;gap:10px;margin-top:16px}
.role{display:grid;grid-template-columns:96px auto minmax(0,1fr);align-items:center;gap:14px}
.role-txt{font-size:12.5px;line-height:1.45;color:var(--soft)}
.role .tip-pop .act{left:auto;right:0}
.pips{display:inline-flex;gap:3px;align-items:center}
.pip{width:7px;height:7px;border-radius:2px;box-shadow:inset 0 0 0 1px #4A4D49;display:inline-block}
.pip.p{background:var(--blue);box-shadow:none}
.pip.x{background:var(--green);box-shadow:none}
.cell .pip{width:5px;height:5px}
.big .pip{width:14px;height:14px;border-radius:4px}
.big{gap:5px}

/* buttons and fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:10px;font:600 15px Inter,sans-serif;text-decoration:none;border:1px solid transparent;text-align:center;box-sizing:border-box}
.btn-p{background:var(--acc);color:#101010!important}
.btn-p:hover{background:#F6C4FF}
.btn-s{border-color:var(--line2);color:var(--ink)!important}
.btn-s:hover{border-color:var(--muted)}
button.btn{background:none;cursor:pointer}
button.btn-p{background:var(--acc)}
.btn-sm{min-height:44px;width:100%;padding:0 8px;font-size:12.5px;border-radius:9px}
.field{background:#0d0d0d;border:1px solid var(--line2);border-radius:10px;color:var(--ink);font:400 14px Inter,sans-serif;min-height:44px;padding:0 14px;box-sizing:border-box}
.field::placeholder{color:#7D817A}
.search{width:220px}

/* easy wins: a flowing grid at every size */
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.fc{position:relative;display:flex;flex-direction:column;gap:12px;padding:24px 20px 20px 26px;border-radius:14px;background:#170f18;animation:glow 2.6s ease-in-out infinite;min-width:0}
.fc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.fc-name{margin:14px 0 0;font:500 18px/1.2 Inter,sans-serif}

      const ribbon = tier === 'hot' ? 'So close' : tier === 'open' ? 'Big pot' : (full ? 'Held' : '');
      const keys = ['grid:', 'p:', 'x:', 'pc:', 'xc:'].map(function (k) { return k + r.c; });
      const pc = chance(r.pu), xc = chance(r.xu);
      const isExp = state.expanded === r.c;
      return Object.assign({
        c: r.c, n: r.n, the: r.the, avail: avail, availStr: two(avail), tier: tier, near: r.near,
        won: r.pp + r.xp, full: full, ppot: r.ppot, xpot: r.xpot, paid: r.paid,
        rank: tier === 'hot' ? 0 : tier === 'open' ? 1 : 2,
        hasTip: tier === 'hot', plainRibbon: ribbon !== '' && tier !== 'hot', ribbon: ribbon,
        ribbonCls: tier === 'open' ? 'r-open' : 'r-held',
        pinCls: keys.indexOf(tipKey) >= 0 ? 'pinned' : '',
        pOpen: r.pp < 5, pPips: pips(r.pp, 'p'), pChance: pct(pc), pClaim: 'about ' + two(SLOT + r.ppot / 5) + ' α', pPotStr: two(r.ppot) + ' α',
        pOpenStr: (5 - r.pp) + ' of 5 provider slots went unclaimed last epoch.', pDrawStr: drawStr(r.pu), pCount: r.pp + '/5',
        xOpen: r.xp < 5, xPips: pips(r.xp, 'x'), xChance: pct(xc), xClaim: 'about ' + two(SLOT + r.xpot / 5) + ' α', xPotStr: two(r.xpot) + ' α',
        xOpenStr: (5 - r.xp) + ' of 5 extender slots went unclaimed last epoch.', xDrawStr: drawStr(r.xu), xCount: r.xp + '/5',
        pMini: r.pp < 5 ? 'open' : 'held', xMini: r.xp < 5 ? 'open' : 'held',
        moreP: moreRole('Providers', 'a provider', r.pp, r.pu, r.ppot, pc),
        moreX: moreRole('Extenders', 'an extender', r.xp, r.xu, r.xpot, xc),
        hasNear: r.near > 0,
        moreNear: r.near > 0 ? 'So close: ' + r.near + (r.near === 1 ? ' miner' : ' miners') + ' here left early last epoch.' : '',
        ctaA: r.pp < 5 && r.xp < 5 ? 'Start mining' : r.xp < 5 ? 'Run an extender' : r.pp < 5 ? 'Run a provider' : 'Start mining',
        expanded: isExp, expCls: isExp ? 'expanded' : '',
        hitLabel: 'Show details for ' + r.n,
        bgpos: pos(r), delay: delayOf(r),
        lastStr: (r.pp + r.xp) + ' won · ' + two(r.paid) + ' α',
        srLast: 'Last epoch: ' + r.pp + ' of 5 provider slots and ' + r.xp + ' of 5 extender slots won, ' + two(r.paid) + ' alpha paid. ' +
          (r.pp < 5 ? 'Providers not fully captured: a new provider wins by default. ' : 'Chance to win as a new provider: ' + pct(pc) + '. ') +
          (r.xp < 5 ? 'Extenders not fully captured: a new extender wins by default.' : 'Chance to win as a new extender: ' + pct(xc) + '.')
      }, nextStep(r));
    });

    const q = state.q.trim().toLowerCase();
    const focus = state.focus;
    const cells = all.filter(function (c) {
      if (focus === 'held') return c.full;
      if (focus === 'np') return c.pOpen;
      if (focus === 'nx') return c.xOpen;
      if (state.show === 'big' && c.tier === 'plain') return false;
      if (state.show === 'held' && !c.full) return false;
      if (q && c.n.toLowerCase().indexOf(q) < 0 && c.c !== q) return false;
      return true;
    });
    // Pots within about 0.1 α of each other count as equal and fall back to A–Z (bucketed, so the order is consistent).
    const bucket = function (v) { return Math.round(v / 0.1); };
    const byPot = function (a, b) { return (bucket(b.ppot + b.xpot) - bucket(a.ppot + a.xpot)) || a.n.localeCompare(b.n); };
    cells.sort(function (a, b) {
      if (focus === 'held') return a.n.localeCompare(b.n);
      if (focus === 'np' || focus === 'nx') return byPot(a, b);
      if (state.sort === 'az') return a.n.localeCompare(b.n);
      if (state.sort === 'pot') return byPot(a, b);
      return (a.rank - b.rank) || byPot(a, b);
    });

    // Easy wins: 8 countries sampled from the big pots, weighted by pot size, without replacement
    // (Efraimidis-Spirakis: key = u^(1/weight), keep the 8 largest). Territories without a permanent population are left out.
    if (featCache.seed !== state.seed) {
      let a = state.seed | 0;
      const rnd = function () { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      featCache = {
        seed: state.seed,
        codes: all.filter(function (c) { return c.avail >= threshold && !NOPOP[c.c] && c.c !== PAGE; })
          .map(function (c) { return { c: c.c, k: Math.pow(rnd(), 1 / c.avail) }; })
          .sort(function (x, y) { return y.k - x.k; }).slice(0, 8).map(function (x) { return x.c; })
      };
    }
    const cellBy = {};
    all.forEach(function (c) { cellBy[c.c] = c; });
    const feat = featCache.codes.map(function (code) { return cellBy[code]; }).sort(byPot).map(function (c) {
      const roles = c.pOpen && c.xOpen ? 'providers and extenders' : c.pOpen ? 'providers' : 'extenders';
      return Object.assign({
        c: c.c, n: c.n, availStr: c.availStr, bgpos: c.bgpos, delay: c.delay,
        ribbon: c.near > 0 ? 'So close' : 'Easy win',
        potLine: 'Provider pot ' + two(c.ppot) + ' α · extender pot ' + two(c.xpot) + ' α',
        potShort: 'P ' + two(c.ppot) + ' α · E ' + two(c.xpot) + ' α',
        line: (c.near > 0 ? c.near + (c.near === 1 ? ' miner was' : ' miners were') + ' here last epoch but left early. ' : '') + 'Not fully captured: ' + roles + ', so a newcomer wins by default.',
        expanded: state.fexp === c.c, expCls: state.fexp === c.c ? 'expanded' : '',
        hitLabel: 'Show the next step for ' + c.n
      }, nextStep(BY[c.c]));
    });

    const r = BY[PAGE || state.viewer || PROPS.country] || BY.is;
    const mpc = chance(r.pu), mxc = chance(r.xu);
    const parts = [];
    if (r.pp < 5) parts.push((5 - r.pp) + ' provider slot' + (5 - r.pp === 1 ? '' : 's'));
    if (r.xp < 5) parts.push((5 - r.xp) + ' extender slot' + (5 - r.xp === 1 ? '' : 's'));
    const who = r.pp < 5 && r.xp < 5 ? 'provider or extender' : r.pp < 5 ? 'provider' : 'extender';
    const roleLine = function (won, units, pot, name) {
      return won < 5
        ? won + ' of 5 won last epoch · pot ' + two(pot) + ' α · not fully captured, a new ' + name + ' wins by default'
        : '5 of 5 won last epoch · ' + int(units) + ' units in the draw · chance to win';
    };
    const ns = nextStep(r);
    const me = {
      c: r.c, n: r.n, the: r.the, bgpos: pos(r), avail: r.ppot + r.xpot + 10 * SLOT, availStr: two(r.ppot + r.xpot + 10 * SLOT),
      msg: parts.length
        ? parts.join(' and ') + ' in ' + r.the + ' went unclaimed last epoch, so a new ' + who + ' who stays online there for half the epoch wins by default.'
        : 'All ten slots in ' + r.the + ' were won last epoch. A newcomer needs the draw: ' + pct(mpc) + ' as a provider, ' + pct(mxc) + ' as an extender.',
      ppips: pips(r.pp, 'p'), xpips: pips(r.xp, 'x'),
      pLine: roleLine(r.pp, r.pu, r.ppot, 'provider'), xLine: roleLine(r.xp, r.xu, r.xpot, 'extender'),
      pClosed: r.pp >= 5, xClosed: r.xp >= 5, pChance: pct(mpc), xChance: pct(mxc),
      pDrawStr: drawStr(r.pu), xDrawStr: drawStr(r.xu),
      anyOpen: parts.length > 0, anyClosed: r.pp >= 5 || r.xp >= 5,
      newcomer: ns.actB, waveCls: parts.length ? 'wave' : ''
    };

    return {
      motionCls: PROPS.motion ? '' : 'still', epoch: 39, drawIn: '3d 04h', slotStr: '0.048',
      carriedStr: two(carried), paidStr: two(paid), winners: int(winners), fullHeld: fullHeld, openP: openP, openX: openX,
      thresholdStr: two(threshold),
      oddsTxt: '5 ÷ entries, the exact odds of a draw of five winners',
      focus: focus, showIntro: !focus, showFeat: feat.length > 0 && !focus,
      gridCls: focus === 'np' ? 'focus-p' : focus === 'nx' ? 'focus-x' : '',
      focusTitle: { held: fullHeld + ' flags held', np: openP + ' countries with providers not fully captured', nx: openX + ' countries with extenders not fully captured' }[focus] || '',
      focusNote: {
        held: 'Every provider slot and every extender slot was won last epoch. A newcomer needs the draw, and each cell shows the chance to win.',
        np: 'At least one provider slot went unclaimed last epoch. A new provider who stays online there for half the epoch wins by default. Biggest pots first, provider and extender together, and A–Z among pots within 0.1 α.',
        nx: 'At least one extender slot went unclaimed last epoch. A new extender who stays online there for half the epoch wins by default. Biggest pots first, provider and extender together, and A–Z among pots within 0.1 α.'
      }[focus] || '',
      page: PAGE, row: r,
      me: me, feat: feat, cells: cells, sort: state.sort, show: state.show, q: state.q,
      countries: ROWS.slice().sort(function (a, b) { return a.n.localeCompare(b.n); })
    };
  }

      '<h3 class="cname" title="' + esc(c.n) + '"><a href="' + pageHref(c.c) + '">' + esc(c.n) + '</a></h3>' +
      '<div class="amt"><b>' + two(c.ppot + c.xpot) + '</b><span class="amt-u">α</span><span class="amt-l">in pots</span></div>' +
      '<span class="mini" aria-hidden="true"><i class="m ' + c.pMini + '">P</i><i class="m ' + c.xMini + '">E</i></span>' +
      '<div class="last">' + viewRole(c, 'p') + viewRole(c, 'x') + '<span aria-hidden="true">' + c.lastStr + '</span><span class="sr">' + esc(c.srLast) + '</span></div>' +
      '<div class="cell-more">' + (c.hasNear ? '<p class="more-near">' + esc(c.moreNear) + '</p>' : '') +
      '<p class="more-line">' + esc(c.moreP) + '</p><p class="more-line">' + esc(c.moreX) + '</p>' +
      '<div class="more-cta"><a class="btn btn-p btn-sm" href="' + ctaHref(c.ctaA) + '">' + c.ctaA + '</a><a class="btn btn-s btn-sm" href="' + pageHref(c.c) + '">Country page</a><button type="button" class="btn btn-s btn-sm" data-act="exp" data-arg="' + c.c + '">Close</button></div></div>' +
      '</article>';
  }

  function seg(act, arg, label, cur) {
    return '<button type="button" data-act="' + act + '" data-arg="' + arg + '" data-fk="' + act + ':' + arg + '" aria-pressed="' + (cur === arg) + '">' + label + '</button>';
  }

  function viewGrid(v) {
    const head = v.showIntro
      ? '<div class="ghead" style="display:flex;flex-direction:column;gap:16px">' +
        '<div style="display:flex;flex-direction:column;gap:8px"><div class="label">Every flag</div><h2 id="grid-h" class="h2">All 249 countries</h2></div>' +
        '<div class="controls"><div style="display:flex;flex-wrap:wrap;gap:10px">' +
        '<div class="seg" role="group" aria-label="Sort">' + seg('sort', 'az', 'A–Z', v.sort) + seg('sort', 'pot', 'Biggest pot', v.sort) + seg('sort', 'easy', 'Easiest wins', v.sort) + '</div>' +
        '<div class="seg" role="group" aria-label="Show">' + seg('show', 'all', 'All', v.show) + seg('show', 'big', 'Big pots', v.show) + seg('show', 'held', 'Held', v.show) + '</div></div>' +
        '<div class="find"><label for="ctf-q" class="label">Find</label><input id="ctf-q" class="field search" type="search" placeholder="Country or code" value="' + esc(v.q) + '"></div></div>' +
        '<div class="legend">' +
        '<span class="li mob-only"><i class="m open">P</i><i class="m held">E</i>open slot, or fully captured · tap a country for its details</span>' +
        '<span class="li"><i class="pip p"></i>provider won</span><span class="li"><i class="pip x"></i>extender won</span><span class="li"><i class="pip"></i>slot open</span>' +
        '<span class="li">' + tip({ key: 'legend-open', cls: 'chance win', text: 'Open', pop: 'tip-pop', btnStyle: 'margin-left:0', label: 'Not fully captured',
          body: 'A slot went unclaimed last epoch. A new provider or extender who stays online there for half the epoch <b>wins by default</b> and takes a fifth of the pot each epoch. Hover any Open chip for its role and amount.', cta: 'Start mining' }) + ' not fully captured, a newcomer wins by default</span>' +
        '<span class="li">' + tip({ key: 'legend-chance', cls: 'chance ex', text: '2.0%', pop: 'tip-pop', btnStyle: 'margin-left:0', label: 'Chance to win',
          body: 'Where all five of a role\'s slots were won, this is the estimated probability that you win that role\'s <b>epoch reward</b> if you launch a provider or an extender in the country and keep it online for half the epoch.',
          after: 'Entries are last epoch\'s eligible units in the role, plus you.', cta: 'Start mining' }) + ' chance to win where all five slots were won</span>' +
        '<span class="li">' + tip({ key: 'legend', cls: 'ribbon r-hot', text: 'So close', pop: 'tip-pop', label: 'Next step',
          body: 'Miners were in these countries but left before half the epoch. Run a provider or an extender there for half an epoch and you take <b>a fifth of the pot</b> each epoch you stay.', cta: 'Start mining' }) + ' a big pot, and miners there fell short last epoch</span>' +
        '<span class="li"><span class="ribbon r-open">Big pot</span>' + v.thresholdStr + ' α or more waiting</span>' +
        '<span class="shown" style="margin-left:auto">' + v.cells.length + ' shown · P providers, E extenders: last epoch\'s winners and each open role\'s pot</span>' +
        '</div></div>'
      : '';
    const fbar = v.focus
      ? '<div class="fbar"><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div class="label" style="color:#ED8FFF">From the stats above</div>' +
        '<h2 id="grid-h" class="fbar-h">' + esc(v.focusTitle) + '</h2><p class="sub" style="font-size:14.5px;max-width:640px">' + esc(v.focusNote) + '</p></div>' +
        '<button type="button" class="btn btn-s" data-act="focus" data-arg="" data-fk="clear">Show all 249</button></div>'
      : '';
    return '<section class="gsec' + (v.focus ? ' focused' : '') + '" aria-labelledby="grid-h">' + head + fbar +
      '<div class="grid ' + v.gridCls + '">' + v.cells.map(viewCell).join('') + '</div>' +
      (v.cells.length === 0 ? '<p style="margin:0;padding:28px;border:1px dashed #303030;border-radius:12px;color:#8F938C;text-align:center">No country matches “' + esc(v.q) + '”.</p>' : '') +
      '</section>';
  }

  function viewHow(v) {
    return '<section id="how" class="sec" aria-labelledby="how-h"><h2 id="how-h" class="h2">How the draw works</h2><div class="steps">' +
      '<div class="step"><b>01</b><h3>Be there</h3><p>Run a provider or an extender in the country for at least half the epoch, and be online when it ends. Your network\'s existing payout wallet is used, so there is nothing new to sign.</p></div>' +
      '<div class="step"><b>02</b><h3>The draw</h3><p>When the epoch ends, each network operator commits the list of its eligible miners on chain. A public drand round then picks up to five winners per country for each role from that list. With five or fewer entries, everyone wins. Miners in one /29 or /48 share a single ticket.</p></div>' +
      '<div class="step"><b>03</b><h3>Claim</h3><p>Each winner takes its slot and a fifth of the country\'s pot, so staying several epochs captures most of a big pot. The alpha accrues to your wallet, and you claim it with your pool earnings in the app.</p></div>' +
      '</div></section>';
  }

  // Questions, as visible HTML (no FAQPage markup: Google dropped that rich result). A country page answers the
  // seed searches in their own words: make money, passive income, remote work (SEO.md §2.2).
  function faqHtml(title, items) {
    return '<section id="faq" class="sec" aria-labelledby="faq-h"><h2 id="faq-h" class="h2">' + esc(title) + '</h2><div class="faq">' +
      items.map(function (it, i) {
        return '<details' + (i === 0 ? ' open' : '') + '><summary>' + esc(it[0]) + '</summary><p>' + it[1] + '</p>' +
          (it[2] ? '<p class="faq-note">' + it[2] + '</p>' : '') + '</details>';
      }).join('') + '</div></section>';
  }

  function viewFaq(v) {
    if (!v.page) {
      return faqHtml('Questions', [
        ['What is capture the flag?', 'A weekly reward that is part of the protocol of Bittensor subnet 25 (UR): every network operator runs a capture the flag pool beside its provider pool, with five provider slots and five extender slots in every country each epoch (one week), and winners are paid in alpha, the subnet\'s token. A slot that nobody wins adds its amount to that country\'s pot, so a newcomer to an empty country takes a fifth of the pot every epoch it stays.'],
        ['How do I win a slot?', 'Run a miner or the free URnetwork app as a provider or an extender, keep it online in your country for at least half the epoch, and be online when it ends. Where your operator\'s slot went unclaimed last epoch, a newcomer wins by default. Where all five were won, its public draw picks five winners.'],
        ['How much can I earn?', 'A slot is worth about ' + v.slotStr + ' α this epoch, and a winner in a country with a pot also takes a fifth of that pot. Amounts change every epoch with the network\'s emission and with how many people run in each country, and alpha\'s price moves. Nothing is guaranteed.'],
        ['Is it passive income, or a job?', 'Neither, quite. The app runs in the background on a phone or computer you already have, but it earns only while it stays online. It is not a job, with no employer, hours or wage, and not an investment, with no fixed return.'],
        ['What is the difference between a provider and an extender?', 'A provider shares your internet connection with the people who use the network. An extender is a relay for people who cannot reach the network directly, for example behind censorship. The miner and the desktop app run both by default, and one device can win in both roles.'],
        ['How is the draw kept fair?', 'When the epoch ends, each network operator commits the list of its eligible miners on chain. A drand round published after that commitment then picks the winners, so nobody, the operator included, can choose them. Every draw can be checked against its census and its round.'],
        ['Can my AI assistant read this data?', 'Yes. The numbers on this page add up the public JSON every network operator serves at <a href="' + API + '">/sn/ctf</a>, documented in <code>sn/api/operator.yml</code>, with times in UTC and amounts in α; <a href="' + OPERATORS + '">the operator list</a> names each operator\'s API. They change once an epoch.']
      ]);
    }
    const r = v.row, me = v.me, the = esc(r.the);
    const entries = function (won, units, role) {
      return units === 0 ? 'no ' + role + ' entered' : won + ' of ' + int(units) + ' ' + role + (units === 1 ? ' entry' : ' entries') + ' won a slot';
    };
    const pOpen = r.pp < 5, xOpen = r.xp < 5;
    const advice = pOpen && xOpen
      ? 'Either. Both roles have open slots in ' + the + ', so a newcomer in either role wins by default. The desktop app runs both.'
      : xOpen
        ? 'An extender. Its slots in ' + the + ' were not all won last epoch, so a new extender wins by default. All five provider slots were won, so a new provider needs the draw: about <b>' + me.pChance + '</b>.'
        : pOpen
          ? 'A provider. Its slots in ' + the + ' were not all won last epoch, so a new provider wins by default. All five extender slots were won, so a new extender needs the draw: about <b>' + me.xChance + '</b>.'
          : 'Both roles were fully captured last epoch, so a newcomer needs the draw: about <b>' + me.pChance + '</b> as a provider and <b>' + me.xChance + '</b> as an extender. The desktop app runs both, which enters both draws.';
    return faqHtml('Questions about earning in ' + r.the, [
      ['Can you make money in ' + r.the + ' by sharing your internet?', 'Yes, in small amounts. A slot is worth about ' + v.slotStr + ' α this epoch, and the pots carried in ' + the + ' are <b>' + two(r.ppot) + ' α</b> for providers and <b>' + two(r.xpot) + ' α</b> for extenders. Each winner takes its slot and a fifth of its role\'s pot. Last epoch, ' + entries(r.pp, r.pu, 'provider') + ' and ' + entries(r.xp, r.xu, 'extender') + '. Rewards are paid in alpha, whose value changes, and nothing is guaranteed.'],
      ['Is it passive income?', 'Partly. The app runs in the background on a phone or computer you already have, but it earns only while it stays online, and what you win depends on how many others run in ' + the + ' and on alpha\'s price. It is not an investment and has no fixed return.'],
      ['Is it remote work in ' + r.the + '?', 'No. Capture the flag is not a job: there is no employer, no hours and no wage. It can run alongside remote work or any other job, on the internet connection you already have.'],
      ['Provider or extender: which should I run in ' + r.the + '?', advice],
      ['How are winners chosen, and can I check?', 'When the epoch ends, each network operator commits the list of its eligible miners in ' + the + ' on chain, and a drand round published after it draws up to five winners per role. With five entries or fewer, everyone wins. Miners in one /29 or /48 share a single entry. Each draw\'s census and round are public.'],
      ['How do I get paid?', 'Winnings go to the payout wallet the app already uses, and you claim them with your pool earnings in the app.',
        'Local note for ' + the + ': how to cash out here and what local law says, dated and reviewed by a person.']
    ]);
  }

  function viewAll() {
    return '<section class="sec all-link" aria-label="More countries"><a class="btn btn-s" href="?">All 249 countries</a></section>';
  }

  // The head follows the page, as Base.astro's props would: title, description, canonical, alternate, JSON-LD.
  const HUB_TITLE = "Earn crypto by sharing your internet in 249 countries | UR";
  const HUB_LD = {"@context": "https://schema.org", "@graph": [{"@type": "Dataset", "@id": "https://ur.xyz/ctf#dataset", "name": "URnetwork capture the flag: reward slots and pots by country", "description": "Each epoch (one week), every network operator of Bittensor subnet 25 (UR) has five provider slots and five extender slots in every one of the 249 ISO 3166-1 countries, and this data adds every operator's up. Per country, the data gives last epoch's winners and the units in each draw, the pot carried into this epoch for each role, and a newcomer's chance to win where all five slots were won. Amounts are in alpha, the subnet's token, before participants' costs.", "url": "https://ur.xyz/ctf", "dateModified": "2026-11-11", "isAccessibleForFree": true, "creator": {"@type": "Organization", "name": "UR", "url": "https://ur.xyz"}, "spatialCoverage": {"@type": "Place", "name": "Worldwide"}, "temporalCoverage": "2026-11-27/..", "variableMeasured": ["Provider slots won", "Extender slots won", "Units in the draw", "Provider pot (alpha)", "Extender pot (alpha)", "Chance to win"], "distribution": [{"@type": "DataDownload", "encodingFormat": "application/json", "contentUrl": "https://api.bringyour.com/sn/ctf"}]}]};
  const UPDATED = '2026-11-11';
  const titleFor = function (r) {
    const a = 'Earn crypto in ' + r.the + ': open slots and pots | UR';
    return Array.from(a).length <= 60 ? a : 'Earn crypto in ' + r.the + ' | UR';
  };
  function setMeta(attr, key, val) {
    let el = document.head.querySelector('meta[' + attr + '="' + key + '"]');
    if (!el) { el = document.createElement('meta'); el.setAttribute(attr, key); document.head.appendChild(el); }
    el.setAttribute('content', val);
  }
  function setLink(rel, href) {
    let el = document.head.querySelector('link[rel="' + rel + '"]');
    if (!el) { el = document.createElement('link'); el.setAttribute('rel', rel); document.head.appendChild(el); }
    el.setAttribute('href', href);
  }
  function countryLd(r, url) {
    // Base.astro adds the BreadcrumbList from breadcrumbName, so it is not repeated here.
    return { '@context': 'https://schema.org', '@graph': [{
      '@type': 'WebPage', '@id': url + '#page', url: url, name: titleFor(r).replace(/ \| UR$/, ''),
      dateModified: UPDATED, inLanguage: 'en',
      about: { '@type': 'Country', name: r.n, identifier: r.c.toUpperCase() },
      isPartOf: { '@id': 'https://ur.xyz/ctf#dataset' }
    }] };
  }
  function syncHead(v) {
    const r = v.row;
    const url = 'https://ur.xyz/ctf' + (v.page ? '/' + r.c : '');
    const title = v.page ? titleFor(r) : HUB_TITLE;
    const desc = v.page
      ? r.the.charAt(0).toUpperCase() + r.the.slice(1) + ' this epoch: ' + (5 - r.pp) + ' provider and ' + (5 - r.xp) + ' extender slots open, with pots of ' + two(r.ppot) + ' α and ' + two(r.xpot) + ' α. Stay online for half the epoch to win. Updated ' + UPDATED + '.'
      : 'Five provider and five extender reward slots in every country, every week. This epoch: ' + v.openP + ' countries with open provider slots and ' + v.carriedStr + ' α in pots.';
    document.title = title;
    setMeta('name', 'description', desc);
    setMeta('property', 'og:title', title);
    setMeta('property', 'og:description', desc);
    setMeta('property', 'og:url', url);
    setMeta('property', 'og:image', 'https://ur.xyz/ctf/og/' + (v.page ? r.c + '-' : '') + 'epoch-' + v.epoch + '.png');
    setLink('canonical', url);
    setLink('alternate', API + (v.page ? '/country/' + r.c : ''));
    const ld = document.getElementById('ctf-jsonld');
    if (ld) ld.textContent = JSON.stringify(v.page ? countryLd(r, url) : HUB_LD, null, 1);
  }

  function viewFoot(v) {
    return '<footer class="mono foot" style="margin-top:48px">' +
      '<p>Up for grabs is an estimate: the pots carried in, plus this epoch\'s ten slots at last epoch\'s slot amount of ' + v.slotStr + ' α. Every draw can be checked against its on-chain census and drand round, published at its operator\'s <a href="https://api.bringyour.com/sn/ctf">/sn/ctf</a>.</p>' +
      '<p>Chance to win shows where all five of a role\'s slots at an operator were won last epoch. Its entries are last epoch\'s eligible units in that role at that operator plus you, and it is ' + v.oddsTxt + '. Where an operator\'s slot went unclaimed, a new miner with that operator wins by default.</p>' +
      '<p>Rewards are paid in alpha, the token of Bittensor subnet 25, whose value changes and can fall. They depend on uptime, on how many others run in each country and on the network\'s emission. They are not wages, a salary, a guaranteed income or an investment, and you pay your own costs, such as power and data.</p>' +
      '<p>Capture the flag is part of the SN25 protocol: every network operator runs a capture the flag pool beside its provider pool, with its own draw in every country, and this page combines every operator in <a href="' + OPERATORS + '">the operator list</a>. Its rules are public: the method in CAPTURETHEFLAG.md, and the code in the subnet\'s repository.</p>' +
      '<p>Country pages are built from each epoch\'s public data. Their local notes are written and reviewed by people.</p>' +
      '<p>Mockup data: 26 simulated epochs on the network\'s provider coverage of August to November 2026, at epoch 4\'s scale. Flags: flag-icons, MIT licence.</p>' +
      '</footer>';
  }

  function view(v) {
    return '<div class="ctf ' + v.motionCls + '">' +
      '<div class="mockbar"><b>Mockup</b><span>Simulated data: 26 epochs on the network\'s real country coverage, one network operator\'s; with several, the page adds them up and lists each operator\'s odds by its domain' + (PRE ? '; the note before the start counts down to epoch 8 on a clock of its own, above the drawn mock' : '') + '</span></div>' +
      '<div class="shell">' + viewNav() + (PRE ? viewStart(Boolean(v.page)) : '') + viewHeader(v) + viewLive(v) +
      (v.showIntro ? viewMine(v) : '') + (v.page ? viewFaq(v) : '') + (v.showFeat ? viewFeat(v) : '') +
      (v.page ? viewAll(v) : viewGrid(v)) + viewHow(v) + (v.page ? '' : viewFaq(v)) + viewFoot(v) +
      '</div></div>';
  }

  // ---- rendering, focus restore and transitions
  function render() {
    const a = document.activeElement;
    let keep = null;
    if (a && root.contains(a)) keep = { id: a.id, fk: a.getAttribute('data-fk'), s: a.selectionStart, e: a.selectionEnd };
    const v = compute();
    root.innerHTML = view(v);
    syncHead(v);
    if (PRE && !startTicking && typeof window.setTimeout === 'function') { startTicking = true; window.setTimeout(startTick, 40); }
    if (keep) {
      const el = keep.id ? document.getElementById(keep.id) : keep.fk ? root.querySelector('[data-fk="' + CSS.escape(keep.fk) + '"]') : null;
      if (el) {
        el.focus({ preventScroll: true });
        if (keep.s != null && el.setSelectionRange) { try { el.setSelectionRange(keep.s, keep.e); } catch (err) { /* not a text field */ } }
      }
    }
  }

  function transition(mutate) {
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!PROPS.motion || reduce || !document.startViewTransition) { mutate(); render(); return; }
    root.classList.add('vt');
    const t = document.startViewTransition(function () { mutate(); render(); });
    t.finished.finally(function () { root.classList.remove('vt'); });
  }

  root.addEventListener('click', function (e) {
    const el = e.target.closest('[data-act]');
    if (!el || !root.contains(el)) return;
    const act = el.getAttribute('data-act'), arg = el.getAttribute('data-arg');
    if (act === 'tip') { state.tip = state.tip === arg ? null : arg; render(); }
    else if (act === 'sort') { state.sort = arg; render(); }
    else if (act === 'show') { state.show = arg; render(); }
    else if (act === 'shuffle') { state.seed = Math.floor(Math.random() * 2147483647); state.tip = null; render(); }
    else if (act === 'focus') {
      if (PAGE) { location.href = arg ? '?focus=' + arg : '?'; return; }
      const next = arg && state.focus !== arg ? arg : null;
      transition(function () { state.focus = next; state.tip = null; state.expanded = null; state.fexp = null; });
    }
    else if (act === 'exp') { transition(function () { state.expanded = state.expanded === arg ? null : arg; state.tip = null; }); }
    else if (act === 'fexp') { transition(function () { state.fexp = state.fexp === arg ? null : arg; state.tip = null; }); }
  });
  root.addEventListener('input', function (e) {
    if (e.target.id === 'ctf-q') { state.q = e.target.value; render(); }
  });
  root.addEventListener('change', function (e) {
    if (e.target.id !== 'ctf-country') return;
    const v = e.target.value.trim().toLowerCase();
    const hit = ROWS.find(function (x) { return x.n.toLowerCase() === v || x.c === v; });
    if (hit && PAGE) { location.href = pageHref(hit.c); return; }
    if (hit) { state.viewer = hit.c; render(); }
  });

  render();
})();
</script>
</body>
