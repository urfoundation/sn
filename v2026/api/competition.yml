          format: date-time

    CompetitionInfoResult:
      type: object
      additionalProperties: false
      required:
        - competition_id
        - enabled
        - score_schema
        - scorer_version
        - base_sha
        - evaluator_image_digest
        - patch_policy
        - evaluation_policy
        - season_policy
      properties:
        decision_mode: {$ref: "#/components/schemas/CompetitionDecisionMode"}
        required_api_capability: {$ref: "#/components/schemas/CompetitionRequiredCapability"}
        competition_id:
          type: string
          minLength: 1
        enabled:
          type: boolean
        score_schema:
          type: integer
          const: 1
        scorer_version:
          type: string
          const: sim-latency-score/1
        base_sha:
          $ref: "#/components/schemas/GitSha"
        evaluator_image_digest:
          $ref: "#/components/schemas/ImageDigest"
        patch_policy:
          $ref: "#/components/schemas/CompetitionPatchPolicy"
        evaluation_policy:
          $ref: "#/components/schemas/CompetitionEvaluationPolicy"
          description: Frozen policy of the active production round, otherwise the current staging round, when one exists; defaults to configured production policy before any round. New staging rounds report takeover_margin 0.
        season_policy:
          $ref: "#/components/schemas/CompetitionSeasonPolicy"
        automation_policy:
          $ref: "#/components/schemas/CompetitionAutomationPolicy"
        active_round:
          oneOf:
            - $ref: "#/components/schemas/CompetitionRoundResult"
            - type: "null"
        staging_round:
          description: The latest round in the staging era, omitted after production epoch one is committed.
          oneOf:
            - $ref: "#/components/schemas/CompetitionRoundResult"
            - type: "null"

    CompetitionAutomationPolicy:
      type: object
      additionalProperties: false
      allOf:
        - if:
            required: [winner_review_policy]
          then:
            required: [winner_review_timeout_seconds]
            properties:
              source_choice_delay_seconds: {const: 0}
              staging_preparation_seconds: {const: 0}
      properties:
        enabled: {type: boolean}
        version: {type: integer, const: 2}
        staging: {type: boolean}
        staging_round_window_seconds: {type: integer, minimum: 60, maximum: 604800}
        staging_preparation_seconds: {type: integer, minimum: 0, maximum: 57600}
        environment: {type: string}
        season_id: {type: string}
        election_rule: {type: string, const: raw_latency_g1_g6_welch_v1}
        review_criteria_version: {type: string}
        settlement_policy_version: {type: string}
        burn_policy_version: {type: string}
        repeat_reward_policy: {type: string, enum: [allow, exclude_exact_identity]}
        settlement_mode: {type: string, enum: [shadow, live]}
        source_choice_delay_seconds: {type: integer, minimum: 0, maximum: 86400}
        required_api_capability: {$ref: "#/components/schemas/CompetitionRequiredCapability"}
        policy_approval_sha256: {$ref: "#/components/schemas/Sha256"}
        source_generation: {type: integer, minimum: 0, maximum: 6}
        source_lock_sha256: {$ref: "#/components/schemas/Sha256"}
        source_activation_generation: {type: integer, minimum: 1}
        winner_review_policy:
          type: string
          enum: [elected_winner_snow_union_v1, elected_winner_gpt54mini_xhigh_v1, elected_winner_sol61max_v1]
          description: New seasons use the Snow three-model union. Historical mini/xhigh and Sol/max records preserve their original provenance. Absent preserves the earlier independent source-choice flow. Requires zero source-choice/preparation delays and a fresh approved frozen policy.
        winner_review_timeout_seconds: {type: integer, minimum: 60, maximum: 86400}
    CompetitionPatchPolicy:
      type: object
      additionalProperties: false
      required: [max_patch_bytes, allowed_paths, forbidden_paths]
      properties:
        path_base:
          type: string
          enum: ["", mono_root_v1]
          description: >-
            Empty or absent retains historical server-relative literal-file
            screening. mono_root_v1 prefixes each diff path with its locked
            repository name, for example connect/resident_contract_manager.go
            for the connect repository or server/db.go for server. Use only
            when advertised by the round's immutable policy and supported by
            its qualified evaluator and source-promotion pipeline.
        max_patch_bytes:
          type: integer
          minimum: 1
          maximum: 262144
        allowed_paths:
          type: array
          minItems: 1
          uniqueItems: true
          description: >-
            Historical mode requires exact literal existing Go files. In
            mono_root_v1, literal mono-root files and repository subtrees such
            as connect/** are supported, including regular text file creation
            and deletion; unknown repositories are refused.
          items:
            type: string
        forbidden_paths:
          type: array
          minItems: 1
          uniqueItems: true
          description: >-
            Must explicitly include connect/sim-latency/** in historical mode
            or server/connect/sim-latency/** in mono_root_v1. The evaluator
            tree and repository metadata are also denied independently.
          items:
            type: string

    CompetitionEvaluationPolicy:
      type: object
      additionalProperties: false
      required:
        - hardware_id
        - host_qualification_sha256
        - config_local_sha256
        - vault_local_sha256
        - simulator_sha256
        - scorer_sha256
        - provider_count
        - client_pool_size
        - arrivals_per_minute
        - quality_window_size
        - exchange_hosts
        - fleet_shards
        - site_listen
        - api_port
        - ramp_ms
        - prewarm_ms
        - settle_ms
        - client_warmup_timeout_ms
        - duration_ms
        - request_timeout_ms
        - pipeline_interval_ms
        - test_timeout_ms
        - announce_timeout_ms
        - impairment_enabled
        - replicates
        - takeover_margin
        - queue_limit
        - score_timeout_seconds
      properties:
        hardware_id:
          type: string
          minLength: 1
        host_qualification_sha256:
          $ref: "#/components/schemas/Sha256"
        config_local_sha256:
          $ref: "#/components/schemas/Sha256"
        vault_local_sha256:
          $ref: "#/components/schemas/Sha256"
        simulator_sha256:
          $ref: "#/components/schemas/Sha256"
        scorer_sha256:
          $ref: "#/components/schemas/Sha256"
        provider_count:
          type: integer
          minimum: 1
        client_pool_size:
          type: integer
          minimum: 1
        arrivals_per_minute:
          type: integer
          minimum: 1
        quality_window_size:
          type: integer
          minimum: 0
          maximum: 32
        exchange_hosts:
          type: integer
          minimum: 1
        fleet_shards:
          type: integer
          minimum: 0
        site_listen:
          type: string
        api_port:
          type: integer
          minimum: 1
          maximum: 65535
        ramp_ms:
          type: integer
          minimum: 0
        prewarm_ms:
          type: integer
          minimum: 0
        settle_ms:
          type: integer
          minimum: 0
        client_warmup_timeout_ms:
          type: integer
          minimum: 1
        duration_ms:
          type: integer
          minimum: 1
        request_timeout_ms:
          type: integer
          minimum: 1
        pipeline_interval_ms:
          type: integer
          minimum: 1
        test_timeout_ms:
          type: integer
          minimum: 1
        announce_timeout_ms:
          type: integer
          minimum: 1
        impairment_enabled:
          type: boolean
        replicates:
          type: integer
          minimum: 1
          description: Odd run count used once for the epoch control and independently for each candidate; production freezes this at nine.
        takeover_margin:
          type: number
          minimum: 0
          maximum: 0.5
          description: Zero for staging rounds created under the no-margin policy; production rounds retain their strictly positive frozen margin. Historical staging rounds keep their original value.
        queue_limit:
          type: integer
          const: 0
          description: Frozen sentinel for unbounded unique submissions per epoch.
        score_timeout_seconds:
          type: integer
          const: 10800
          description: Total execution budget for one submission across all attempts and retry backoff; queue wait before its first claim is excluded.

    CompetitionSeasonPolicy:
      type: object
      additionalProperties: false
      description: Production policy remains six weekly $20 epochs. Explicit v2 staging freezes matching staging timing and a zero fee; a zero fee alone cannot select staging mode.
      required: [epoch_count, submission_window_seconds, preparation_window_seconds, submission_fee_usd]
      oneOf:
        - properties:
            submission_fee_usd: {const: 20}
            submission_window_seconds: {const: 604800}
        - properties:
            submission_fee_usd: {const: 0}
            preparation_window_seconds: {maximum: 57600}
      properties:
        epoch_count:
          type: integer
          const: 6
        submission_window_seconds:
          type: integer
          minimum: 60
          maximum: 604800
        preparation_window_seconds:
          description: Time reserved for the same-round rebaseline before submissions open.
          type: integer
          minimum: 0
          maximum: 604800
        submission_fee_usd:
          type: integer
          enum: [0, 20]
          description: Production charges $20 exactly once per admitted submission. Explicit v2 staging requires zero and must not invoke the fee collector; legacy staging remains fee-free despite its historical production-policy projection.

    CompetitionGenerateRoundArgs:
      type: object
      additionalProperties: false
      required: [opens_at, closes_at, reveal_at]
      properties:
        opens_at:
          type: string
          format: date-time
        closes_at:
          type: string
          format: date-time
        reveal_at:
          type: string
          format: date-time

    CompetitionGenerateStagingRoundArgs:
      type: object
      additionalProperties: false
      description: |
        Omitting every timestamp creates an immediately open 48-hour staging
        epoch. If any timestamp is supplied, all three are required; the window
        must be from one minute through seven days and reveal_at must equal
        closes_at.
      dependentRequired:
        opens_at: [closes_at, reveal_at]
        closes_at: [opens_at, reveal_at]
        reveal_at: [opens_at, closes_at]
      properties:
        opens_at:
          type: string
          format: date-time
        closes_at:
          type: string
          format: date-time
        reveal_at:
          type: string
          format: date-time
        replace_current:
          type: boolean
          default: false
          description: Cancel a non-finalized staging round and its queued jobs before creating the next epoch; rejected while a job is running.

    CompetitionRoundResult:
      type: object
      additionalProperties: false
      required:
        - round_id
        - epoch
        - staging
        - status
        - workload_commitment
        - providers_sha256
        - score_schema
        - opens_at
        - closes_at
        - reveal_at
        - created_at
      properties:
        decision_mode: {$ref: "#/components/schemas/CompetitionDecisionMode"}
        required_api_capability: {$ref: "#/components/schemas/CompetitionRequiredCapability"}
        round_id:
          type: string
          format: uuid
        epoch:
          type: integer
          minimum: 0
          description: Legacy staging epochs begin at zero and advance independently. Explicit v2 staging seasons and production seasons each use epochs 1 through 6.
        staging:
          type: boolean
          description: True for a fee-free pre-production epoch, excluded from production rewards and branches. Legacy staging uses source epoch zero; explicit v2 staging binds its separately reviewed staging source generation and versioned provisional reward contract.
        status:
          type: string
          enum: [scheduled, open, grading, finalized, canceled, sealed]
        workload_commitment:
          $ref: "#/components/schemas/Sha256"
        providers_sha256:
          description: SHA-256 of the exact generated providers.yml bytes.
          $ref: "#/components/schemas/Sha256"
        score_schema:
          type: integer
          const: 1
        opens_at:
          type: string
          format: date-time
        closes_at:
          type: string
          format: date-time
        reveal_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        admission_closed_at:
          description: Present when an operator ended staging admission early without changing the committed schedule. Accepted FIFO work continues through grading.
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        finalized_at:
          description: Legacy v1 finalization only; omitted for v2, which publishes a seal and provisional reward history instead.
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        winner_job_id:
          description: Legacy v1 named automatic staging winner or approved production winner after publication; null when no candidate qualifies and omitted for v2. Use the versioned result's provisional_reward_winner for v2. Historical finalized winners are unchanged.
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        revealed_seed:
          description: Legacy production requires reveal_at and post-review finalization; legacy staging requires close, drain and automatic finalization. V2 requires close, complete drain, seal, and reveal, without waiting for integrity/source approval.
          oneOf:
            - type: string
              pattern: "^[0-9a-f]{64}$"
            - type: "null"
        providers_url:
          description: Legacy production requires reveal_at and post-review finalization; legacy staging requires close, drain and automatic finalization. V2 requires close, complete drain, seal, and reveal, without waiting for integrity/source approval.
          type: string
          pattern: "^/competition/round/[0-9a-f-]+/providers\\.yml$"

    CompetitionSeasonLeaderboardResult:
      type: object
      additionalProperties: false
      required: [competition_id, epochs]
      properties:
        competition_id:
          type: string
          minLength: 1
        epochs:
          type: array
          items:
            $ref: "#/components/schemas/CompetitionLeaderboardResult"

    CompetitionLeaderboardResult:
      type: object
      additionalProperties: false
      required: [competition_id, round_id, epoch, staging, status, finalized_at, winner_job_id, entries]
      properties:
        competition_id:
          type: string
          minLength: 1
        round_id:
          type: string
          format: uuid
        epoch:
          type: integer
          minimum: 0
          description: Staging sequence from zero, or production epoch in 1..6.
        staging:
          type: boolean
          description: True only for a fee-free pre-production staging epoch.
        status:
          type: string
          const: finalized
        finalized_at:
          type: string
          format: date-time
        winner_job_id:
          description: Automatically selected placeable staging winner passing every gate, or honesty-approved significant production winner; null when no candidate qualifies. Historical finalized results are preserved.
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/CompetitionLeaderboardEntry"

    CompetitionLeaderboardEntry:
      type: object
      additionalProperties: false
      required: [rank, job_id, patch_sha256, submitted_at, winner, honesty_review, score, submitter_count]
      properties:
        rank:
          type: integer
          minimum: 1
        job_id:
          type: string
          format: uuid
        patch_sha256:
          $ref: "#/components/schemas/Sha256"
        submitted_at:
          type: string
          format: date-time
        winner:
          type: boolean
        honesty_review:
          type: string
          enum: [approved, rejected, not_reviewed]
          description: >-
            Final production operator honesty-review disposition. A staging
            winner starts not_reviewed and can become approved only after an
            explicit append-only manual review; staging never promotes source.
            Rejected significant candidates remain visible after the epoch embargo lifts but cannot
            be selected or promoted as the winner.
        score:
          $ref: "#/components/schemas/CompetitionScoreResult"
        submitter_count:
          type: integer
          minimum: 1

    CompetitionScoreArgs:
      type: object
      additionalProperties: false
      required: [round_id, patch]
      properties:
        round_id:
          type: string
          format: uuid
        patch:
          type: string
          minLength: 1
          maxLength: 262144
          description: |
            Exact UTF-8 unified-diff bytes. The API validates but does not
            rewrite this value: use LF (`0x0a`) line endings, no CR bytes,
            and exactly one final LF (the value must end in `\n` but not
            `\n\n`). File sections must be sorted lexicographically by path
            and use canonical `diff --git` and valid `@@` hunk forms. Historical
            policies accept only regular 100644 modifications with matching
            `--- a/path` and `+++ b/path` headers. When the frozen policy explicitly
            uses `path_base: mono_root_v1` and its evaluator is qualified for that
            mode, regular 100644 or 100755 text files may be modified, created,
            or deleted. Existing execute modes must be preserved. Creation and
            deletion use exactly `new file mode MODE` or `deleted file mode MODE`
            with MODE equal to 100644 or 100755, `/dev/null` only
            on the absent side, and one complete hunk with zero lines on that
            side. Standard empty-file operations may instead contain only the
            regular mode and an index identifying the absent object and exact
            empty SHA-1 blob (canonical abbreviation of at least seven digits).
            Trusted source application checks actual pinned Git modes even when
            optional index modes are omitted. Binary files, symlinks, submodules, mode changes,
            renames, copies, mixed/duplicate operation metadata, and protected
            paths remain refused. Preserve the final LF when
            encoding JSON; shell command substitution commonly removes it.

    CompetitionScoreAcceptedResult:
      type: object
      additionalProperties: false
      required: [job_id, round_id, staging, patch_sha256, state, cache_hit, status_url]
      properties:
        decision_mode: {$ref: "#/components/schemas/CompetitionDecisionMode"}
        required_api_capability: {$ref: "#/components/schemas/CompetitionRequiredCapability"}
        job_id:
          type: string
          format: uuid
        round_id:
          type: string
          format: uuid
        staging:
          type: boolean
          description: True for a fee-free staging job using the real FIFO evaluator. Legacy staging uses source epoch zero; explicit v2 staging uses its activated staging source and shadow reward contract.
        patch_sha256:
          $ref: "#/components/schemas/Sha256"
        state:
          $ref: "#/components/schemas/CompetitionJobState"
        cache_hit:
          type: boolean
        status_url:
          type: string
          pattern: "^/competition/(v2/)?score/[0-9a-f-]+$"
          description: Persist and follow exactly with the owning submitter credential. V2 returns /competition/v2/score/{jobId}; the legacy polling URL rejects that job's contract.

    CompetitionScoreJobResult:
      type: object
      additionalProperties: false
      required:
        - job_id
        - round_id
        - staging
        - patch_sha256
        - state
        - evaluation_status
        - submitted_at
        - cache_key
        - evaluator_image_digest
        - api_image_digest
      properties:
        decision_mode: {$ref: "#/components/schemas/CompetitionDecisionMode"}
        required_api_capability: {$ref: "#/components/schemas/CompetitionRequiredCapability"}
        job_id:
          type: string
          format: uuid
        round_id:
          type: string
          format: uuid
        staging:
          type: boolean
          description: True for a fee-free staging job. Legacy staging uses source epoch zero and automatic finalization; explicit v2 staging uses activated staging source and publishes after close, drain, seal, and reveal without waiting for review.
        patch_sha256:
          $ref: "#/components/schemas/Sha256"
        state:
          $ref: "#/components/schemas/CompetitionJobState"
        evaluation_status:
          $ref: "#/components/schemas/CompetitionEvaluationStatus"
        evaluation_failure:
          description: Present only when evaluation_status is failed and the terminal kind/code pair is on the reviewed public allowlist. Omitted for unknown codes; never contains the evaluator message, readiness, score, gates, or diagnostics.
          oneOf:
            - $ref: "#/components/schemas/CompetitionEvaluationFailure"
            - type: "null"
        submitted_at:
          type: string
          format: date-time
        started_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        completed_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        cache_key:
          $ref: "#/components/schemas/Sha256"
        evaluator_image_digest:
          $ref: "#/components/schemas/ImageDigest"
          description: Exact epoch evaluator container content identity frozen in the job's immutable round policy.
        api_image_digest:
          $ref: "#/components/schemas/ImageDigest"
          description: Exact main API container content identity that admitted the job; control-plane provenance, not a scoring input.
        worker_image_digest:
          $ref: "#/components/schemas/ImageDigest"
          description: Exact main worker container content identity for the current or terminal attempt; control-plane provenance, not a scoring input.
        score:
          oneOf:
            - $ref: "#/components/schemas/CompetitionScoreResult"
            - type: "null"
        eval_error:
          oneOf:
            - $ref: "#/components/schemas/CompetitionError"
            - type: "null"

    CompetitionJobState:
      type: string
      description: completed is the outcome-neutral state returned during the result embargo.
      enum: [queued, running, completed, succeeded, failed, canceled]

    CompetitionEvaluationStatus:
      type: string
      description: Additive polling lifecycle. completed means evaluation produced a score but reveals no score value, placeability, gate, significance, or diagnostic; failed is terminal and is visible during the result embargo. Legacy servers may omit this field during a rolling deployment, in which case clients can derive queued/running/canceled directly from state but must treat state completed as outcome-neutral.
      enum: [queued, running, completed, failed, canceled]

    CompetitionEvaluationFailure:
      type: object
      additionalProperties: false
      required: [kind, code, retriable]
      description: Message-free terminal failure summary. The complete eval_error remains embargoed, and unknown unreviewed code values produce no summary.
      properties:
        kind:
          type: string
          enum: [submission, infrastructure]
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]{1,63}$"
        retriable:
          type: boolean
          const: false

    CompetitionScoreResult:
      type: object
      additionalProperties: false
      required: [score_schema, placeable, gates, significance]
      properties:
        score_schema:
          type: integer
          const: 1
        raw_score:
          description: Absolute candidate median of replicate p95 request latency in milliseconds; lower is better and this is the ranking key. Present only after atomic epoch finalization (after honesty review in production, automatic in staging).
          type: number
          exclusiveMinimum: 0
        normalized_score:
          description: Display-only ratio derived from the epoch's shared control; it is never a ranking input. Present only after atomic epoch finalization (after honesty review in production, automatic in staging).
          type: number
          minimum: 1
          maximum: 200
        placeable:
          type: boolean
        takeover_eligible:
          type: boolean
          description: True only when correctness gates, the epoch margin, and the per-candidate shared-control significance test all pass; production additionally requires honesty review. Staging records this diagnostic but does not require it to name its best placeable winner.
        gates:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CompetitionGate"
        significance:
          $ref: "#/components/schemas/CompetitionScoreSignificance"
        diagnostics:
          type: object
          additionalProperties: true

    CompetitionScoreSignificance:
      type: object
      additionalProperties: false
      required:
        - method
        - alpha
        - replicate_count
        - baseline_mean_raw_score
        - candidate_mean_raw_score
        - baseline_sample_variance
        - candidate_sample_variance
        - observed_improvement_percent
        - takeover_margin_percent
        - minimum_significant_improvement_percent
        - required_improvement_percent
        - one_sided_p_value
        - statistically_significant
        - next_epoch_minimum_improvement_percent
        - recommended_next_epoch_takeover_margin_percent
        - recommended_next_epoch_takeover_margin_supported
      properties:
        method:
          type: string
          const: one-sided-welch-t
        alpha:
          type: number
          const: 0.05
        replicate_count:
          type: integer
          minimum: 1
          maximum: 9
        baseline_mean_raw_score:
          description: Mean of the one immutable epoch control sample reused by every candidate in this epoch.
          type: number
          exclusiveMinimum: 0
        candidate_mean_raw_score:
          type: number
          exclusiveMinimum: 0
        baseline_sample_variance:
          description: Sample variance (n-1) of the immutable epoch control's replicate raw scores; null only for R=1.
          oneOf:
            - type: number
              minimum: 0
            - type: "null"
        candidate_sample_variance:
          description: Sample variance (n-1) of candidate replicate raw scores; null only for R=1.
          oneOf:
            - type: number
              minimum: 0
            - type: "null"
        observed_improvement_percent:
          type: number
        takeover_margin_percent:
          description: Empirically calibrated aggregate-score floor frozen for this epoch.
          type: number
          exclusiveMinimum: 0
          maximum: 50
        minimum_significant_improvement_percent:
          description: One-sided Welch critical difference divided by the baseline mean; null only for R=1.
          oneOf:
            - type: number
              minimum: 0
            - type: "null"
        required_improvement_percent:
          description: Greater of the epoch takeover floor and measured Welch threshold; null only for R=1.
          oneOf:
            - type: number
              minimum: 0
            - type: "null"
        one_sided_p_value:
          description: Candidate-lower-than-baseline Welch p-value computed from this candidate's independent runs and the shared epoch control; null only for R=1.
          oneOf:
            - type: number
              minimum: 0
              maximum: 1
            - type: "null"
        welch_t:
          type: number
        welch_degrees_of_freedom:
          type: number
          exclusiveMinimum: 0
        statistically_significant:
          type: boolean
        next_epoch_minimum_improvement_percent:
          description: Minimum detectable improvement derived from candidate variance as the next incumbent; null only for R=1.
          oneOf:
            - type: number
              minimum: 0
            - type: "null"
        recommended_next_epoch_takeover_margin_percent:
          description: Conservative next-epoch margin, never below this epoch's calibrated takeover floor; null only for R=1.
          oneOf:
            - type: number
              exclusiveMinimum: 0
            - type: "null"
        recommended_next_epoch_takeover_margin_supported:
          description: True only when the recommendation is within the scorer's supported (0%, 50%] range.
          type: boolean

    CompetitionGate:
      type: object
      additionalProperties: false
      required: [passed, details]
      properties:
        passed:
          type: boolean
        details:
          type: object
          additionalProperties: true

    CompetitionError:
      type: object
      additionalProperties: false
      required: [kind, code, message, retriable]
      properties:
        current_revision: {type: integer, minimum: 1}
        current_decision_sha256: {$ref: "#/components/schemas/Sha256"}
        kind:
          type: string
          enum: [auth, submission, infrastructure]
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]{1,63}$"
        message:
          type: string
          minLength: 1
          maxLength: 1024
        retriable:
          type: boolean
        readiness:
          description: Authenticated per-dependency detail for operator readiness failures.
          $ref: "#/components/schemas/CompetitionReadinessResult"

    Sha256:
      type: string
      pattern: "^[0-9a-f]{64}$"

    GitSha:
      type: string
      pattern: "^[0-9a-f]{40}$"

    ImageDigest:
      type: string
      pattern: "^sha256:[0-9a-f]{64}$"

security:
  - CompetitionBearerAuth: []
