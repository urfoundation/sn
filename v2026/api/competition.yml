openapi: "3.1.0"
info:
  version: 2026.8.28
  title: URnetwork Competition API
  description: |
    Control-plane API for reproducible, cached sim-latency competition rounds.
    The same server process also serves the URnetwork API described by
    connect/api/bringyour.yml. Competition paths are namespaced under
    /competition.

    Round workload seeds and score results are never returned while a round is
    active or grading. The API publishes a seed commitment and the generated
    providers.yml SHA-256 until every admitted job is terminal and the winner
    is finalized after ordered honesty review, then exposes the seed, immutable
    workload, and results.
    Identical canonical patch bytes in one round map to one durable job/result.
  contact:
    name: URnetwork
    email: support@ur.io
    url: https://ur.io
  license:
    name: Mozilla Public License, v. 2.0
    url: https://mozilla.org/MPL/2.0/
servers:
  - url: https://api.bringyour.com

tags:
  - name: Competition
    description: Public round information and score submission.
  - name: Competition operator
    description: Authenticated round administration.

paths:
  /competition/healthz:
    get:
      operationId: CompetitionHealth
      tags: [Competition]
      security: []
      summary: Process liveness
      responses:
        "200":
          description: The API process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionHealthResult"

  /competition/readyz:
    get:
      operationId: CompetitionReady
      tags: [Competition operator]
      summary: Deep competition readiness
      description: |
        Fails closed unless durable storage, the FIFO worker lease path, the
        frozen round policy, artifact storage, and the authoritative evaluator
        host passes its current self-check.
      responses:
        "200":
          description: Ready to accept score jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionReadinessResult"
        "401":
          $ref: "#/components/responses/CompetitionUnauthorized"
        "503":
          $ref: "#/components/responses/CompetitionUnavailable"

  /competition/info:
    get:
      operationId: CompetitionInfo
      tags: [Competition]
      security: []
      summary: Published non-secret run and scoring policy
      responses:
        "200":
          description: Current immutable competition policy and active round commitment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionInfoResult"
        "503":
          $ref: "#/components/responses/CompetitionUnavailable"

  /competition/leaderboard:
    get:
      operationId: CompetitionLeaderboard
      tags: [Competition]
      security: []
      summary: Published final results for completed epochs
      description: |
        Returns only finalized epochs. Entries are deterministically ordered by
        normalized score, raw score, submission time, and job id. Public rows
        identify the immutable job and patch, not bearer-token principals. An
        epoch is not published until admission has closed, every accepted job
        is terminal, and winner selection commits atomically.
      responses:
        "200":
          description: Finalized epoch leaderboards and winners.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionSeasonLeaderboardResult"
        "503":
          $ref: "#/components/responses/CompetitionUnavailable"

  /competition/generate-round:
    post:
      operationId: CompetitionGenerateRound
      tags: [Competition operator]
      summary: Generate and commit a hidden-seed round
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionGenerateRoundArgs"
      responses:
        "201":
          description: Round created; no seed is disclosed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionRoundResult"
        "400":
          $ref: "#/components/responses/CompetitionBadRequest"
        "401":
          $ref: "#/components/responses/CompetitionUnauthorized"
        "409":
          $ref: "#/components/responses/CompetitionConflict"
        "503":
          $ref: "#/components/responses/CompetitionUnavailable"

  /competition/round/{roundId}/providers.yml:
    get:
      operationId: CompetitionGetRoundWorkload
      tags: [Competition]
      security: []
      summary: Download the committed workload after epoch finalization
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Byte-identical providers.yml whose SHA-256 was published at round creation.
          headers:
            ETag:
              schema:
                type: string
            X-Content-SHA256:
              schema:
                $ref: "#/components/schemas/Sha256"
          content:
            application/yaml:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/CompetitionBadRequest"
        "404":
          $ref: "#/components/responses/CompetitionNotFound"
        "409":
          $ref: "#/components/responses/CompetitionConflict"
        "503":
          $ref: "#/components/responses/CompetitionUnavailable"

  /competition/score:
    post:
      operationId: CompetitionSubmitScore
      tags: [Competition]
      summary: Validate, canonicalize, cache, and enqueue a patch
      description: |
        The response is asynchronous. Submitting identical canonical patch
        bytes for the same round returns the existing job and cannot buy
        another draw from evaluator noise. Accepted unique jobs are unbounded
        per epoch and enter the single FIFO immediately. The Apex adapter
        collects the published $20 USD submission fee exactly once before
        forwarding an admission. Any patch operation targeting
        `connect/sim-latency/**` is a terminal invalid submission; the
        simulator, runner, and scorer implementation is not an editable
        competition surface.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionScoreArgs"
      responses:
        "202":
          description: The durable job was accepted or returned from cache.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionScoreAcceptedResult"
        "400":
          $ref: "#/components/responses/CompetitionBadRequest"
        "401":
          $ref: "#/components/responses/CompetitionUnauthorized"
        "404":
          $ref: "#/components/responses/CompetitionNotFound"
        "409":
          $ref: "#/components/responses/CompetitionConflict"
        "413":
          description: Patch exceeds the published byte limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionError"
        "422":
          description: Patch is structurally invalid or outside the allowlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionError"
        "503":
          $ref: "#/components/responses/CompetitionUnavailable"

  /competition/score/{jobId}:
    get:
      operationId: CompetitionGetScore
      tags: [Competition]
      summary: Poll one cached score job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current durable processing state; score and failure results are embargoed until post-review epoch finalization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionScoreJobResult"
        "400":
          $ref: "#/components/responses/CompetitionBadRequest"
        "401":
          $ref: "#/components/responses/CompetitionUnauthorized"
        "404":
          $ref: "#/components/responses/CompetitionNotFound"
        "503":
          $ref: "#/components/responses/CompetitionUnavailable"

components:
  securitySchemes:
    CompetitionBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Competition submitter or operator token.

  responses:
    CompetitionBadRequest:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CompetitionError"
    CompetitionUnauthorized:
      description: Missing or invalid competition bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CompetitionError"
    CompetitionNotFound:
      description: Round or job does not exist, or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CompetitionError"
    CompetitionConflict:
      description: Request conflicts with immutable round or job state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CompetitionError"
    CompetitionUnavailable:
      description: Competition evaluation is disabled or not ready.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CompetitionError"

  schemas:
    CompetitionHealthResult:
      type: object
      additionalProperties: false
      required: [status, version, time]
      properties:
        status:
          type: string
          const: alive
        version:
          type: string
        time:
          type: string
          format: date-time

    CompetitionReadinessResult:
      type: object
      additionalProperties: false
      required: [ready, checks, checked_at]
      properties:
        ready:
          type: boolean
        checks:
          type: object
          additionalProperties:
            type: boolean
        checked_at:
          type: string
          format: date-time

    CompetitionInfoResult:
      type: object
      additionalProperties: false
      required:
        - competition_id
        - enabled
        - score_schema
        - scorer_version
        - base_sha
        - evaluator_image_digest
        - patch_policy
        - evaluation_policy
        - season_policy
      properties:
        competition_id:
          type: string
          minLength: 1
        enabled:
          type: boolean
        score_schema:
          type: integer
          const: 1
        scorer_version:
          type: string
          const: sim-latency-score/1
        base_sha:
          $ref: "#/components/schemas/GitSha"
        evaluator_image_digest:
          $ref: "#/components/schemas/ImageDigest"
        patch_policy:
          $ref: "#/components/schemas/CompetitionPatchPolicy"
        evaluation_policy:
          $ref: "#/components/schemas/CompetitionEvaluationPolicy"
        season_policy:
          $ref: "#/components/schemas/CompetitionSeasonPolicy"
        active_round:
          oneOf:
            - $ref: "#/components/schemas/CompetitionRoundResult"
            - type: "null"

    CompetitionPatchPolicy:
      type: object
      additionalProperties: false
      required: [max_patch_bytes, allowed_paths, forbidden_paths]
      properties:
        max_patch_bytes:
          type: integer
          minimum: 1
          maximum: 262144
        allowed_paths:
          type: array
          minItems: 1
          uniqueItems: true
          description: Exact literal existing Go files; glob patterns are rejected.
          items:
            type: string
        forbidden_paths:
          type: array
          minItems: 1
          uniqueItems: true
          description: Must explicitly include `connect/sim-latency/**`; that tree is also denied independently by the validator.
          items:
            type: string

    CompetitionEvaluationPolicy:
      type: object
      additionalProperties: false
      required:
        - hardware_id
        - host_qualification_sha256
        - config_local_sha256
        - vault_local_sha256
        - simulator_sha256
        - scorer_sha256
        - provider_count
        - client_pool_size
        - arrivals_per_minute
        - quality_window_size
        - exchange_hosts
        - fleet_shards
        - site_listen
        - api_port
        - ramp_ms
        - prewarm_ms
        - settle_ms
        - client_warmup_timeout_ms
        - duration_ms
        - request_timeout_ms
        - pipeline_interval_ms
        - test_timeout_ms
        - announce_timeout_ms
        - impairment_enabled
        - replicates
        - takeover_margin
        - queue_limit
        - score_timeout_seconds
      properties:
        hardware_id:
          type: string
          minLength: 1
        host_qualification_sha256:
          $ref: "#/components/schemas/Sha256"
        config_local_sha256:
          $ref: "#/components/schemas/Sha256"
        vault_local_sha256:
          $ref: "#/components/schemas/Sha256"
        simulator_sha256:
          $ref: "#/components/schemas/Sha256"
        scorer_sha256:
          $ref: "#/components/schemas/Sha256"
        provider_count:
          type: integer
          minimum: 1
        client_pool_size:
          type: integer
          minimum: 1
        arrivals_per_minute:
          type: integer
          minimum: 1
        quality_window_size:
          type: integer
          minimum: 0
          maximum: 32
        exchange_hosts:
          type: integer
          minimum: 1
        fleet_shards:
          type: integer
          minimum: 0
        site_listen:
          type: string
        api_port:
          type: integer
          minimum: 1
          maximum: 65535
        ramp_ms:
          type: integer
          minimum: 0
        prewarm_ms:
          type: integer
          minimum: 0
        settle_ms:
          type: integer
          minimum: 0
        client_warmup_timeout_ms:
          type: integer
          minimum: 1
        duration_ms:
          type: integer
          minimum: 1
        request_timeout_ms:
          type: integer
          minimum: 1
        pipeline_interval_ms:
          type: integer
          minimum: 1
        test_timeout_ms:
          type: integer
          minimum: 1
        announce_timeout_ms:
          type: integer
          minimum: 1
        impairment_enabled:
          type: boolean
        replicates:
          type: integer
          minimum: 1
        takeover_margin:
          type: number
          exclusiveMinimum: 0
          maximum: 0.5
        queue_limit:
          type: integer
          const: 0
          description: Frozen sentinel for unbounded unique submissions per epoch.
        score_timeout_seconds:
          type: integer
          const: 10800
          description: Total execution budget for one submission across all attempts and retry backoff; queue wait before its first claim is excluded.

    CompetitionSeasonPolicy:
      type: object
      additionalProperties: false
      required: [epoch_count, submission_window_seconds, preparation_window_seconds, submission_fee_usd]
      properties:
        epoch_count:
          type: integer
          const: 6
        submission_window_seconds:
          type: integer
          const: 604800
        preparation_window_seconds:
          description: Time reserved for the same-round rebaseline before submissions open.
          type: integer
          minimum: 0
          maximum: 604800
        submission_fee_usd:
          type: integer
          const: 20
          description: Fee collected exactly once by the Apex adapter for each admitted submission.

    CompetitionGenerateRoundArgs:
      type: object
      additionalProperties: false
      required: [opens_at, closes_at, reveal_at]
      properties:
        opens_at:
          type: string
          format: date-time
        closes_at:
          type: string
          format: date-time
        reveal_at:
          type: string
          format: date-time

    CompetitionRoundResult:
      type: object
      additionalProperties: false
      required:
        - round_id
        - epoch
        - status
        - workload_commitment
        - providers_sha256
        - score_schema
        - opens_at
        - closes_at
        - reveal_at
        - created_at
      properties:
        round_id:
          type: string
          format: uuid
        epoch:
          type: integer
          minimum: 1
          maximum: 6
        status:
          type: string
          enum: [scheduled, open, grading, finalized, canceled]
        workload_commitment:
          $ref: "#/components/schemas/Sha256"
        providers_sha256:
          description: SHA-256 of the exact generated providers.yml bytes.
          $ref: "#/components/schemas/Sha256"
        score_schema:
          type: integer
          const: 1
        opens_at:
          type: string
          format: date-time
        closes_at:
          type: string
          format: date-time
        reveal_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        finalized_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        winner_job_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        revealed_seed:
          description: Present only after reveal_at and atomic post-review epoch finalization.
          oneOf:
            - type: string
              pattern: "^[0-9a-f]{64}$"
            - type: "null"
        providers_url:
          description: Present only after reveal_at and atomic post-review epoch finalization.
          type: string
          pattern: "^/competition/round/[0-9a-f-]+/providers\\.yml$"

    CompetitionSeasonLeaderboardResult:
      type: object
      additionalProperties: false
      required: [competition_id, epochs]
      properties:
        competition_id:
          type: string
          minLength: 1
        epochs:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/CompetitionLeaderboardResult"

    CompetitionLeaderboardResult:
      type: object
      additionalProperties: false
      required: [competition_id, round_id, epoch, status, finalized_at, entries]
      properties:
        competition_id:
          type: string
          minLength: 1
        round_id:
          type: string
          format: uuid
        epoch:
          type: integer
          minimum: 1
          maximum: 6
        status:
          type: string
          const: finalized
        finalized_at:
          type: string
          format: date-time
        winner_job_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/CompetitionLeaderboardEntry"

    CompetitionLeaderboardEntry:
      type: object
      additionalProperties: false
      required: [rank, job_id, patch_sha256, submitted_at, winner, honesty_review, score, submitter_count]
      properties:
        rank:
          type: integer
          minimum: 1
        job_id:
          type: string
          format: uuid
        patch_sha256:
          $ref: "#/components/schemas/Sha256"
        submitted_at:
          type: string
          format: date-time
        winner:
          type: boolean
        honesty_review:
          type: string
          enum: [approved, rejected, not_reviewed]
          description: >-
            Final operator honesty-review disposition. Rejected significant
            candidates remain visible after the epoch embargo lifts but cannot
            be selected or promoted as the winner.
        score:
          $ref: "#/components/schemas/CompetitionScoreResult"
        submitter_count:
          type: integer
          minimum: 1

    CompetitionScoreArgs:
      type: object
      additionalProperties: false
      required: [round_id, patch]
      properties:
        round_id:
          type: string
          format: uuid
        patch:
          type: string
          minLength: 1
          maxLength: 262144

    CompetitionScoreAcceptedResult:
      type: object
      additionalProperties: false
      required: [job_id, round_id, patch_sha256, state, cache_hit, status_url]
      properties:
        job_id:
          type: string
          format: uuid
        round_id:
          type: string
          format: uuid
        patch_sha256:
          $ref: "#/components/schemas/Sha256"
        state:
          $ref: "#/components/schemas/CompetitionJobState"
        cache_hit:
          type: boolean
        status_url:
          type: string
          pattern: "^/competition/score/[0-9a-f-]+$"

    CompetitionScoreJobResult:
      type: object
      additionalProperties: false
      required:
        - job_id
        - round_id
        - patch_sha256
        - state
        - submitted_at
        - cache_key
        - evaluator_image_digest
        - api_image_digest
      properties:
        job_id:
          type: string
          format: uuid
        round_id:
          type: string
          format: uuid
        patch_sha256:
          $ref: "#/components/schemas/Sha256"
        state:
          $ref: "#/components/schemas/CompetitionJobState"
        submitted_at:
          type: string
          format: date-time
        started_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        completed_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        cache_key:
          $ref: "#/components/schemas/Sha256"
        evaluator_image_digest:
          $ref: "#/components/schemas/ImageDigest"
          description: Exact epoch evaluator container content identity frozen in the job's immutable round policy.
        api_image_digest:
          $ref: "#/components/schemas/ImageDigest"
          description: Exact main API container content identity that admitted the job; control-plane provenance, not a scoring input.
        worker_image_digest:
          $ref: "#/components/schemas/ImageDigest"
          description: Exact main worker container content identity for the current or terminal attempt; control-plane provenance, not a scoring input.
        score:
          oneOf:
            - $ref: "#/components/schemas/CompetitionScoreResult"
            - type: "null"
        eval_error:
          oneOf:
            - $ref: "#/components/schemas/CompetitionError"
            - type: "null"

    CompetitionJobState:
      type: string
      description: completed is the outcome-neutral state returned during the result embargo.
      enum: [queued, running, completed, succeeded, failed, canceled]

    CompetitionScoreResult:
      type: object
      additionalProperties: false
      required: [score_schema, placeable, gates, significance]
      properties:
        score_schema:
          type: integer
          const: 1
        raw_score:
          description: Present only after atomic post-review epoch finalization.
          type: number
          exclusiveMinimum: 0
        normalized_score:
          description: Present only after atomic post-review epoch finalization.
          type: number
          minimum: 1
          maximum: 200
        placeable:
          type: boolean
        takeover_eligible:
          type: boolean
        gates:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CompetitionGate"
        significance:
          $ref: "#/components/schemas/CompetitionScoreSignificance"
        diagnostics:
          type: object
          additionalProperties: true

    CompetitionScoreSignificance:
      type: object
      additionalProperties: false
      required:
        - method
        - alpha
        - replicate_count
        - baseline_mean_raw_score
        - candidate_mean_raw_score
        - baseline_sample_variance
        - candidate_sample_variance
        - observed_improvement_percent
        - takeover_margin_percent
        - minimum_significant_improvement_percent
        - required_improvement_percent
        - one_sided_p_value
        - statistically_significant
        - next_epoch_minimum_improvement_percent
        - recommended_next_epoch_takeover_margin_percent
        - recommended_next_epoch_takeover_margin_supported
      properties:
        method:
          type: string
          const: one-sided-welch-t
        alpha:
          type: number
          const: 0.05
        replicate_count:
          type: integer
          minimum: 1
          maximum: 9
        baseline_mean_raw_score:
          type: number
          exclusiveMinimum: 0
        candidate_mean_raw_score:
          type: number
          exclusiveMinimum: 0
        baseline_sample_variance:
          description: Sample variance (n-1) of baseline replicate raw scores; null only for R=1.
          oneOf:
            - type: number
              minimum: 0
            - type: "null"
        candidate_sample_variance:
          description: Sample variance (n-1) of candidate replicate raw scores; null only for R=1.
          oneOf:
            - type: number
              minimum: 0
            - type: "null"
        observed_improvement_percent:
          type: number
        takeover_margin_percent:
          description: Empirically calibrated aggregate-score floor frozen for this epoch.
          type: number
          exclusiveMinimum: 0
          maximum: 50
        minimum_significant_improvement_percent:
          description: One-sided Welch critical difference divided by the baseline mean; null only for R=1.
          oneOf:
            - type: number
              minimum: 0
            - type: "null"
        required_improvement_percent:
          description: Greater of the epoch takeover floor and measured Welch threshold; null only for R=1.
          oneOf:
            - type: number
              minimum: 0
            - type: "null"
        one_sided_p_value:
          description: Candidate-lower-than-baseline Welch p-value; null only for R=1.
          oneOf:
            - type: number
              minimum: 0
              maximum: 1
            - type: "null"
        welch_t:
          type: number
        welch_degrees_of_freedom:
          type: number
          exclusiveMinimum: 0
        statistically_significant:
          type: boolean
        next_epoch_minimum_improvement_percent:
          description: Minimum detectable improvement derived from candidate variance as the next incumbent; null only for R=1.
          oneOf:
            - type: number
              minimum: 0
            - type: "null"
        recommended_next_epoch_takeover_margin_percent:
          description: Conservative next-epoch margin, never below this epoch's calibrated takeover floor; null only for R=1.
          oneOf:
            - type: number
              exclusiveMinimum: 0
            - type: "null"
        recommended_next_epoch_takeover_margin_supported:
          description: True only when the recommendation is within the scorer's supported (0%, 50%] range.
          type: boolean

    CompetitionGate:
      type: object
      additionalProperties: false
      required: [passed, details]
      properties:
        passed:
          type: boolean
        details:
          type: object
          additionalProperties: true

    CompetitionError:
      type: object
      additionalProperties: false
      required: [kind, code, message, retriable]
      properties:
        kind:
          type: string
          enum: [auth, submission, infrastructure]
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]{1,63}$"
        message:
          type: string
          minLength: 1
          maxLength: 1024
        retriable:
          type: boolean

    Sha256:
      type: string
      pattern: "^[0-9a-f]{64}$"

    GitSha:
      type: string
      pattern: "^[0-9a-f]{40}$"

    ImageDigest:
      type: string
      pattern: "^sha256:[0-9a-f]{64}$"

security:
  - CompetitionBearerAuth: []
