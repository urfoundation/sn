      properties:
        idempotency_key: {type: string, maxLength: 128, description: Nonempty in writes; redacted to empty in public result history.}
        expected_reward_revision: {type: integer, minimum: 0}
        invalidates_evaluation: {type: boolean}
        source_compromised: {type: boolean}
        source_lock_sha256: {$ref: "#/components/schemas/Sha256"}
        reason_code: {type: string, enum: [EVALUATION_INTEGRITY_INCIDENT, SOURCE_COMPROMISE]}
        public_explanation: {type: string, minLength: 1, maxLength: 4096}
        evidence_sha256: {$ref: "#/components/schemas/Sha256"}
    CompetitionAutomationIncident:
