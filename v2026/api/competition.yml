openapi: "3.1.0"
info:
  version: 2026.10.23
  title: URnetwork Competition API
  description: |
    Control-plane API for reproducible, cached sim-latency competition rounds.
    The same server process also serves the URnetwork API described by
    connect/api/bringyour.yml. Competition paths are namespaced under
    /competition.

    V1 behavior remains unchanged. Round workload seeds and score results are never returned while a round is
    active or grading. The API publishes a seed commitment and the generated
    providers.yml SHA-256 until every admitted job is terminal and the winner
    is finalized (after ordered honesty review in production), then exposes
    the seed, immutable workload, and results.
    Identical canonical patch bytes in one round map to one durable job/result.
    Before production epoch one, an operator may run an independently numbered
    staging era beginning at epoch zero. Staging submissions are fee-free but
    traverse the same durable FIFO and evaluator as production. Each staging
    epoch publishes its poll results after admission closes and all accepted
    work drains. It automatically names the highest-ranked placeable candidate
    passing every gate, without a significance or takeover-margin requirement;
    an empty or wholly unplaceable round has no winner. Newly created staging
    rounds freeze a zero takeover margin; historical rounds retain their
    original value. Staging never promotes source. Its named winner initially
    has honesty_review=not_reviewed and may become approved only after an
    explicit append-only manual review of that exact finalized winner.
    Historical finalized rankings are preserved.
    Every epoch measures one nine-run control before the first submitted build,
    freezes its exact baseline.json bytes and SHA-256, and reuses that control
    for every candidate in the epoch. Candidate ranking uses absolute raw
    latency; normalized score is display-only.
    Historical epochs scored before shared controls were introduced retain
    their original per-job control samples and normalized-score-first ranking.
    Committing production epoch one atomically ends the staging era and cancels
    queued staging work; it refuses to race a running staging evaluation.

    V2 is disabled by default and requires a prospectively approved frozen
    provisional_reward_v2 policy and an explicit supported runtime capability.
    competition.reward.v2 uses provisioned filesystem manifests;
    competition.reward.v2.runtime-blob.v1 uses independently authenticated,
    immutable retained runtime manifests. An open
    legacy round cannot change mode. Discovery, admission, and polling advertise
    the immutable contract; legacy score URLs reject v2 with HTTP 409
    unsupported_decision_mode. V2 admission uses POST /competition/v2/score;
    persist its returned status_url for owned-job polling. Both discovery
    contract fields absent means v1; an incomplete or unknown explicit contract
    must fail loudly, never fall back to v1.
    V2 publishes only after close, complete authoritative drain, seal, and reveal.
    A provisional reward winner is not honesty approval, source approval, or payment.
    Publication does not wait for integrity_review or source_approval. V2 rounds
    never populate /competition/leaderboard, including include_staging=true;
    use /competition/v2/rounds/{roundId}/result or its /decisions alias and the
    separately authorized reward event feed. Unknown future decision actions,
    reasons, or states must be rejected/quarantined for reconciliation, never
    silently interpreted as no winner, approval, or settlement.
    Rankings and measurements remain immutable; authenticated retrospective
    findings append reward revisions. Carry-forward source is separately approved.
    The one-sided Welch alpha 0.05 is per candidate, not a season-wide error guarantee.
    The durable event feed is HTTPS-authenticated, not a signed webhook protocol.
    Receipt means received; applied and confirmed are distinct external accounting
    claims, never proof that an already transferred reward can be clawed back.
    No replacement burn formula or actual Apex money-movement API is invented here.
    Six seven-day admission windows may have arbitrarily long grading drains.
    Prospectively adopted winner_review_policy elected_winner_snow_union_v1 makes
    integrity review part of automatic epoch closing, after public provisional
    election. The elected winner is reviewed serially by qwen3.8-27b,
    gemma-4-26b-a4b and muse-glimmer-30b on the qualified Snow broker. All three
    must approve; every member's six findings remain attributed in the union.
    A substantiated rejection publishes reasons and re-elects from the
    original seal. Approval then gates the exact winner's isolated build and
    qualification before the successor opens. No eligible recipient means
    incumbent carry-forward. Missing/expired review or failed build/readiness
    pauses progression; it never silently approves or selects another source.
    The review deadline is durable per elected decision and is not reset by a
    retry. Historical policies without this opt-in retain independent source
    choice and their original preparation schedule. Historical
    elected_winner_gpt54mini_xhigh_v1 and elected_winner_sol61max_v1 records retain
    gpt-5.4-mini/xhigh and gpt-6.1-sol/max provenance respectively; neither
    old policy nor review digests are relabeled by a provider upgrade.
  contact:
    name: URnetwork
    email: support@ur.xyz
    url: https://ur.io
  license:
    name: Mozilla Public License, v. 2.0
    url: https://mozilla.org/MPL/2.0/
servers:
  - url: https://api.bringyour.com

tags:
  - name: Competition
    description: Public round information and score submission.
  - name: Competition operator
    description: Authenticated round administration.

paths:
  /competition/healthz:
    get:
      operationId: CompetitionHealth
      tags: [Competition]
      security: []
      summary: Process liveness
      responses:
        "200":
          description: The API process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionHealthResult"

  /competition/readyz:
    get:
      operationId: CompetitionReady
      tags: [Competition operator]
      summary: Deep competition readiness
      description: |
        Fails closed unless durable storage, the FIFO worker lease path, the
        frozen round policy, artifact storage, and the authoritative evaluator
        host passes its current self-check.
      responses:
        "200":
          description: Ready to accept score jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionReadinessResult"
        "401":
          $ref: "#/components/responses/CompetitionUnauthorized"
        "503":
          $ref: "#/components/responses/CompetitionUnavailable"

  /competition/info:
    get:
      operationId: CompetitionInfo
      tags: [Competition]
      security: []
      summary: Published non-secret run and scoring policy
      description: |
        Select active_round for production or staging_round for staging and
        retain its round_id, decision_mode and required_api_capability. A v2
        round advertises provisional_reward_v2 and the exact supported runtime
        capability; use its versioned score and result URLs. Both contract
        fields absent identify v1, not an unsupported explicit v2 contract.
      responses:
        "200":
          description: Current immutable competition policy and active round commitment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionInfoResult"
        "503":
          $ref: "#/components/responses/CompetitionUnavailable"

  /competition/leaderboard:
    get:
      operationId: CompetitionLeaderboard
      tags: [Competition]
      security: []
      summary: Published legacy v1 final results for completed epochs
      description: |
        V2 rounds do not populate this endpoint, including include_staging=true.
        Reconcile v2 using /competition/v2/rounds/{roundId}/result or its
        /decisions alias and the separately scoped reward event feed; do not
        wait for a v2 winner in this legacy projection.
        Returns only finalized v1 production epochs by default. Set
        include_staging=true to also return finalized v1 staging epochs through
        the same reconciliation shape. Staging epochs are explicitly marked
        and automatically name the highest-ranked placeable winner passing every gate,
        or publish winner_job_id as null if none qualifies. A staging winner
        remains not_reviewed until explicitly approved by a manual operator
        review; staging never promotes source. Entries are
        deterministically ordered by absolute raw score ascending, submission
        time, and job id for shared-control epochs. Historical per-job-control
        epochs retain normalized score descending before those tie breakers;
        their already-published rankings are not rewritten. Public rows identify
        the immutable job and patch, not
        bearer-token principals. An epoch is not published until admission has
        closed, every accepted job is terminal, and finalization commits
        atomically.
      parameters:
        - name: include_staging
          in: query
          required: false
          description: Include finalized legacy v1 fee-free staging epochs after their embargo lifts. Explicit v2 staging uses the versioned round result and reward event contracts, not this legacy winner projection.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Finalized epoch leaderboards and winners.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionSeasonLeaderboardResult"
        "503":
          $ref: "#/components/responses/CompetitionUnavailable"

  /competition/generate-round:
    post:
      operationId: CompetitionGenerateRound
      tags: [Competition operator]
      summary: Generate and commit a hidden-seed round
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionGenerateRoundArgs"
      responses:
        "201":
          description: Round created; no seed is disclosed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionRoundResult"
        "400":
          $ref: "#/components/responses/CompetitionBadRequest"
        "401":
          $ref: "#/components/responses/CompetitionUnauthorized"
        "409":
          $ref: "#/components/responses/CompetitionConflict"
        "503":
          $ref: "#/components/responses/CompetitionUnavailable"

  /competition/generate-staging-round:
    post:
      operationId: CompetitionGenerateStagingRound
      tags: [Competition operator]
      summary: Generate the next pre-production staging epoch
      description: |
        Legacy v1 staging only. Explicit v2 staging is created by the fenced
        supervisor after source activation; this route cannot bypass it.
        Creates the next independently numbered staging epoch, beginning with
        epoch zero. Staging submissions exercise authenticated patch
        validation, immutable artifact retention, cache identity, the real
        evaluator FIFO, embargo, and result publication without charging a fee
        or promoting source. After close and drain, staging automatically names
        its highest-ranked placeable winner passing every gate, or no winner.
        Explicit retrospective staging approval is available for the named
        winner. Every job uses the authenticated
        append-only one-control-per-epoch baseline path used by production,
        while the separately promoted production host-readiness rebaseline
        identity is not required. A prior staging epoch must be
        finalized unless replace_current explicitly supersedes it; replacement
        refuses while an evaluation is running. No staging epoch may be created
        after the first production epoch is committed.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionGenerateStagingRoundArgs"
      responses:
        "201":
          description: Staging round created; use its round_id for test submissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionRoundResult"
        "400":
          $ref: "#/components/responses/CompetitionBadRequest"
        "401":
          $ref: "#/components/responses/CompetitionUnauthorized"
        "409":
          $ref: "#/components/responses/CompetitionConflict"
        "503":
          $ref: "#/components/responses/CompetitionUnavailable"

  /competition/close-staging-round:
    post:
      operationId: CompetitionCloseStagingRound
      tags: [Competition operator]
      summary: Close current staging admission and preserve its FIFO
      description: |
        Legacy v1 staging only; explicit v2 staging retains its frozen admission
        window and is closed/drained by the v2 supervisor, not this route.
        Atomically stops accepting submissions for the current open staging
        epoch without canceling accepted jobs. The evaluator continues in FIFO
        order until every accepted job is terminal, then automatically names
        the highest-ranked placeable winner passing every gate (or no winner),
        finalizes, and reveals the staging epoch without source promotion.
        This can precede scheduled reveal_at; the committed schedule is unchanged.
        Repeating the operation while grading or after
        finalization is idempotent.
      responses:
        "200":
          description: Staging admission is closed or was already closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionRoundResult"
        "401":
          $ref: "#/components/responses/CompetitionUnauthorized"
        "409":
          $ref: "#/components/responses/CompetitionConflict"
        "503":
          $ref: "#/components/responses/CompetitionUnavailable"

  /competition/round/{roundId}/providers.yml:
    get:
      operationId: CompetitionGetRoundWorkload
      tags: [Competition]
      security: []
      summary: Download the committed workload after round publication
      description: Legacy v1 requires finalization; v2 requires close, complete drain, seal, and reveal, independently of integrity/source approval.
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Byte-identical providers.yml whose SHA-256 was published at round creation.
          headers:
            ETag:
              schema:
                type: string
            X-Content-SHA256:
              schema:
                $ref: "#/components/schemas/Sha256"
          content:
            application/yaml:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/CompetitionBadRequest"
        "404":
          $ref: "#/components/responses/CompetitionNotFound"
        "409":
          $ref: "#/components/responses/CompetitionConflict"
        "503":
          $ref: "#/components/responses/CompetitionUnavailable"

  /competition/score:
    post:
      operationId: CompetitionSubmitScore
      tags: [Competition]
      summary: Validate, cache, and enqueue an already canonical patch
      description: |
        Legacy v1 admission only. An otherwise valid authorized request for a
        v2 round returns 409 unsupported_decision_mode; use POST
        /competition/v2/score as advertised by /competition/info.
        The response is asynchronous. Submitting identical canonical patch
        bytes for the same round returns the existing job and cannot buy
        another draw from evaluator noise. Accepted unique jobs are unbounded
        per epoch and enter the single FIFO immediately. The Apex adapter
        collects the published $20 USD submission fee exactly once before
        forwarding a production admission. A response with `staging: true`
        is fee-free but otherwise enters the same FIFO evaluator. Its score or
        full evaluation error remains embargoed until that staging epoch
        closes, drains, and automatically finalizes with the highest-ranked
        placeable winner passing every gate, or no winner. Optional manual
        approval happens after finalization; execution status and a
        reviewed message-free terminal failure code remain visible. An
        explicitly superseded staging epoch, or
        one interrupted by production epoch one, exposes only a non-retriable
        staging cleanup reason rather than a measured outcome. Any
        patch operation targeting
        `connect/sim-latency/**` is a terminal invalid submission; the
        simulator, runner, and scorer implementation is not an editable
        competition surface.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionScoreArgs"
      responses:
        "202":
          description: The durable job was accepted or returned from cache.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionScoreAcceptedResult"
        "400":
          $ref: "#/components/responses/CompetitionBadRequest"
        "401":
          $ref: "#/components/responses/CompetitionUnauthorized"
        "404":
          $ref: "#/components/responses/CompetitionNotFound"
        "409":
          $ref: "#/components/responses/CompetitionConflict"
        "413":
          description: Patch exceeds the published byte limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionError"
        "422":
          description: Patch is structurally invalid or outside the allowlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionError"
        "429":
          description: Temporary admission backpressure; retry the identical submission after Retry-After.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionError"
        "503":
          $ref: "#/components/responses/CompetitionUnavailable"

  /competition/score/{jobId}:
    get:
      operationId: CompetitionGetScore
      tags: [Competition]
      summary: Poll one cached score job
      description: Legacy v1 polling only. An owned v2 job returns 409 unsupported_decision_mode; follow the status_url returned by v2 admission instead.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current durable processing state. evaluation_status exposes only the evaluator lifecycle and a sanitized terminal failure code; score, gates, diagnostics, and full eval_error remain embargoed until epoch finalization (after honesty review in production, automatic after close and drain in staging).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionScoreJobResult"
        "400":
          $ref: "#/components/responses/CompetitionBadRequest"
        "401":
          $ref: "#/components/responses/CompetitionUnauthorized"
        "404":
          $ref: "#/components/responses/CompetitionNotFound"
        "409":
          $ref: "#/components/responses/CompetitionConflict"
        "503":
          $ref: "#/components/responses/CompetitionUnavailable"

  /competition/v2/score/preflight:
    post:
      operationId: CompetitionV2Preflight
      tags: [Competition]
      summary: Screen exact canonical identity before a production fee
      description: |
        Submitter only. Validates the frozen v2 mode, open admission, canonical
        patch and prospectively adopted repeat policy. reward_eligible=false
        discloses a known exact (base source lock, canonical patch) exclusion.
        This is not admission, reservation, or payment authority. The adapter
        must refuse a known excluded entitlement before CollectOnce; durable
        admission rechecks the same identity under its round lock.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CompetitionScoreArgs"}
      responses:
        "200":
          description: Known eligibility and canonical identities; no fee charged.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CompetitionV2SubmissionPreflight"}
        "400": {$ref: "#/components/responses/CompetitionBadRequest"}
        "401": {$ref: "#/components/responses/CompetitionUnauthorized"}
        "403": {$ref: "#/components/responses/CompetitionForbidden"}
        "409": {$ref: "#/components/responses/CompetitionConflict"}
        "503": {$ref: "#/components/responses/CompetitionUnavailable"}

  /competition/v2/score:
    post:
      operationId: CompetitionV2SubmitScore
      tags: [Competition]
      summary: Admit an explicitly v2 submission
      description: |
        Submitter only; legacy operators do not inherit this capability. Same
        canonical patch cache, fee agreement, FIFO and evaluator as v1. A v1
        round returns 409 unsupported_decision_mode. Discover the immutable
        contract through /competition/info. Persist status_url exactly; never
        guess a job URL or fall back to a legacy endpoint on a mode conflict.
        Explicit v2 staging rounds are fee-free, have zero evaluator takeover
        margin, and use shadow reward decisions. They still require every
        evaluation gate, nine replicates, and exact activated-source readiness.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CompetitionScoreArgs"}
      responses:
        "202":
          description: Durable job with immutable v2 polling URL.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CompetitionScoreAcceptedResult"}
        "400": {$ref: "#/components/responses/CompetitionBadRequest"}
        "401": {$ref: "#/components/responses/CompetitionUnauthorized"}
        "403": {$ref: "#/components/responses/CompetitionForbidden"}
        "409": {$ref: "#/components/responses/CompetitionConflict"}
        "503": {$ref: "#/components/responses/CompetitionUnavailable"}

  /competition/v2/score/{jobId}:
    get:
      operationId: CompetitionV2GetScore
      tags: [Competition]
      summary: Poll an owned immutable v2 job
      description: |
        Submitter ownership is required even after publication. Before close,
        drain and reveal, completed outcomes remain state=completed; the typed
        evaluation_status and message-free evaluation_failure preserve safe
        transport diagnostics without exposing scores or private error text.
      parameters:
        - {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Safe job state or published immutable score.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CompetitionScoreJobResult"}
        "401": {$ref: "#/components/responses/CompetitionUnauthorized"}
        "403": {$ref: "#/components/responses/CompetitionForbidden"}
        "404": {$ref: "#/components/responses/CompetitionNotFound"}
        "409": {$ref: "#/components/responses/CompetitionConflict"}
        "503": {$ref: "#/components/responses/CompetitionUnavailable"}

  /competition/v2/rounds/{roundId}/result:
    get:
      operationId: CompetitionV2RoundResult
      tags: [Competition]
      security: []
      summary: Published evaluation seal and versioned reward decisions
      description: |
        Returns 409 round_not_published until close, complete authoritative
        drain, seal and reveal; publication_at is max(sealed_at, reveal_at).
        Publication does not wait for integrity_review or source_approval.
        Scores, ranks, exact
        original completion timestamps and the seal never change. The current
        provisional recipient and review/settlement/source state may advance
        only through append-only records. Private findings and bearer actor
        names are redacted; public explanation and withheld-evidence rationale
        remain. Neither approved source carry-forward nor a receipt approves
        the current reward candidate. source_approval belongs to that candidate;
        source_decision describes the separately selected reviewed incumbent.
        A staging result and each reward decision carry staging: true and
        settlement_mode: shadow. Staging elects the best gate-passing entry
        without a significance/improvement requirement; this does not approve
        its source or authorize money movement. Use the advertised v2 contract,
        not the legacy leaderboard (even include_staging=true), to reconcile
        provisional reward revisions. Unknown action, reason_code or state
        values require explicit rejection/quarantine, not a no-winner default.
      parameters:
        - {name: roundId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Public, sanitized v2 result; no-store because decisions may advance.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CompetitionV2RoundResult"}
        "404": {$ref: "#/components/responses/CompetitionNotFound"}
        "409": {$ref: "#/components/responses/CompetitionConflict"}
        "503": {$ref: "#/components/responses/CompetitionUnavailable"}

  /competition/v2/rounds/{roundId}/decisions:
    get:
      operationId: CompetitionV2Decisions
      tags: [Competition]
      security: []
      summary: Complete immutable reward revision history
      description: Same result shape and publication gate as /result; revision numbering is contiguous per round.
      parameters:
        - {name: roundId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Complete result, original seal and ordered decision history.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CompetitionV2RoundResult"}
        "404": {$ref: "#/components/responses/CompetitionNotFound"}
        "409": {$ref: "#/components/responses/CompetitionConflict"}
        "503": {$ref: "#/components/responses/CompetitionUnavailable"}

  /competition/v2/rounds/{roundId}/seal:
    post:
      operationId: CompetitionV2Seal
      tags: [Competition operator]
      summary: Seal complete terminal evidence and elect once
      description: Scheduler scope only. No caller-selected winner or policy. Replays return the original immutable seal. No public evidence is returned ahead of reveal.
      parameters:
        - {name: roundId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Existing or newly sealed public result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CompetitionV2RoundResult"}
        "401": {$ref: "#/components/responses/CompetitionUnauthorized"}
        "403": {$ref: "#/components/responses/CompetitionForbidden"}
        "409": {$ref: "#/components/responses/CompetitionConflict"}
        "503": {$ref: "#/components/responses/CompetitionUnavailable"}

  /competition/v2/rounds/{roundId}/reviews:
    post:
      operationId: CompetitionV2Review
      tags: [Competition operator]
      summary: Record a bounded, authenticated integrity review
      description: |
        Reviewer scope only. Maximum JSON body 64 KiB. Actor comes from the
        bearer credential, not the body. Exact idempotency replay returns the
        original review; a different body or stale expected_revision conflicts.
        Published conflicts include current_revision and current_decision_sha256.
        The server computes any replacement from the original ranking; an
        expected replacement is only a consistency check. Approving the current
        recipient creates a genuine review, not a second reward entitlement.
        Source-only deferral does not imply reward disqualification.
      parameters:
        - {name: roundId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CompetitionIntegrityReviewRequest"}
      responses:
        "200":
          description: Private authenticated review result; no-store.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CompetitionIntegrityReviewResult"}
        "400": {$ref: "#/components/responses/CompetitionBadRequest"}
        "401": {$ref: "#/components/responses/CompetitionUnauthorized"}
        "403": {$ref: "#/components/responses/CompetitionForbidden"}
        "409": {$ref: "#/components/responses/CompetitionConflict"}
        "503": {$ref: "#/components/responses/CompetitionUnavailable"}

  /competition/v2/events:
    get:
      operationId: CompetitionV2Events
      tags: [Competition operator]
      summary: Reconcile durable reward events by cursor
      description: |
        Settlement scope only, exact environment/competition/season. The cursor
        is durable insertion order, not a timestamp or ULID ordering assumption.
        Persist each page before acknowledgment. Global cursor gaps are possible;
        per-round revision gaps are not. An unpublished head stops the page and
        is never skipped. Empty pages preserve the cursor. Delivery is at least
        once; consumers reject conflicting reuse and poll after restart/outage.
        payload_sha256 hashes canonical decision JSON including decision_sha256;
        decision_sha256 hashes that decision with its own digest empty.
      parameters:
        - {name: after_cursor, in: query, schema: {type: integer, format: int64, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
      responses:
        "200":
          description: Bounded published event page with the last persisted delivery cursor.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CompetitionRewardEventPage"}
        "400": {$ref: "#/components/responses/CompetitionBadRequest"}
        "401": {$ref: "#/components/responses/CompetitionUnauthorized"}
        "403": {$ref: "#/components/responses/CompetitionForbidden"}
        "409": {$ref: "#/components/responses/CompetitionConflict"}
        "503": {$ref: "#/components/responses/CompetitionUnavailable"}

  /competition/v2/receipts:
    post:
      operationId: CompetitionV2Receipt
      tags: [Competition operator]
      summary: Append an idempotent exact-event receipt
      description: |
        Settlement scope only. Maximum JSON body 16 KiB. Actor and received_at
        are authoritative server values. Each event/actor/status is immutable;
        an exact replay returns the original receipt. received does not imply
        applied or confirmed. Actual accounting uses approved integration
        policy; the reference adapter emits received only and moves no funds.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CompetitionSettlementReceipt"}
      responses:
        "200":
          description: Original or newly committed receipt.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CompetitionSettlementReceipt"}
        "400": {$ref: "#/components/responses/CompetitionBadRequest"}
        "401": {$ref: "#/components/responses/CompetitionUnauthorized"}
        "403": {$ref: "#/components/responses/CompetitionForbidden"}
        "409": {$ref: "#/components/responses/CompetitionConflict"}
        "503": {$ref: "#/components/responses/CompetitionUnavailable"}

  /competition/v2/source/{generation}/readiness:
    post:
      operationId: CompetitionV2SourceReadiness
      tags: [Competition operator]
      summary: Acknowledge the exact installed API runtime manifest
      description: |
        Source-promoter scope only. No body, caller ready flag, or caller image
        identity is accepted. The API verifies its installed immutable manifest
        against the durable source intent and records its actual runtime digest.
        Missing deployment-loader integration returns source_not_ready; this
        endpoint does not manufacture a rollout or activate source by itself.
      parameters:
        - {name: generation, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        "200":
          description: Exact manifest readiness receipt.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CompetitionSourceReadiness"}
        "400": {$ref: "#/components/responses/CompetitionBadRequest"}
        "401": {$ref: "#/components/responses/CompetitionUnauthorized"}
        "403": {$ref: "#/components/responses/CompetitionForbidden"}
        "409": {$ref: "#/components/responses/CompetitionConflict"}
        "503": {$ref: "#/components/responses/CompetitionUnavailable"}

  /competition/v2/holds:
    post:
      operationId: CompetitionV2Hold
      tags: [Competition operator]
      summary: Pause or resume one separately authorized capability
      description: Scheduler controls admission/evaluation, source_promoter controls source_activation, and settlement controls reward_delivery. Release requires RECOVERY_APPROVED. No hold discards accepted work or rewrites history.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CompetitionAutomationHoldArgs"}
      responses:
        "200":
          description: Immutable attributed hold revision.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CompetitionAutomationHold"}
        "400": {$ref: "#/components/responses/CompetitionBadRequest"}
        "401": {$ref: "#/components/responses/CompetitionUnauthorized"}
        "403": {$ref: "#/components/responses/CompetitionForbidden"}
        "409": {$ref: "#/components/responses/CompetitionConflict"}

  /competition/v2/rounds/{roundId}/incidents:
    post:
      operationId: CompetitionV2Incident
      tags: [Competition operator]
      summary: Append evaluation invalidation or a source compromise
      description: Scheduler can invalidate evaluation; source_promoter can report source-only compromise. One token cannot combine both authorities. Invalidated is distinct from no improvement; committed measurements and source locks remain unchanged.
      parameters:
        - {name: roundId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CompetitionAutomationIncidentArgs"}
      responses:
        "200":
          description: Immutable attributed incident and affected source ancestry.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CompetitionAutomationIncident"}
        "400": {$ref: "#/components/responses/CompetitionBadRequest"}
        "401": {$ref: "#/components/responses/CompetitionUnauthorized"}
        "403": {$ref: "#/components/responses/CompetitionForbidden"}
        "409": {$ref: "#/components/responses/CompetitionConflict"}

components:
  securitySchemes:
    CompetitionBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Opaque competition token. Legacy submitter/operator roles retain their
        original v1 authority. V2 scheduler, reviewer, settlement and
        source_promoter are distinct roles scoped to environment, competition_id
        and season_id. Legacy operators never inherit v2 privileges. Revoked
        credentials fail immediately on the next request.

  responses:
    CompetitionForbidden:
      description: Authenticated token lacks the exact required capability or scope.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/CompetitionError"}
    CompetitionBadRequest:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CompetitionError"
    CompetitionUnauthorized:
      description: Missing or invalid competition bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CompetitionError"
    CompetitionNotFound:
      description: Round or job does not exist, or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CompetitionError"
    CompetitionConflict:
      description: Request conflicts with immutable round or job state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CompetitionError"
    CompetitionUnavailable:
      description: Competition evaluation is disabled or not ready.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CompetitionError"

  schemas:
    CompetitionDecisionMode:
      type: string
      const: provisional_reward_v2
    CompetitionRequiredCapability:
      type: string
      enum: [competition.reward.v2, competition.reward.v2.runtime-blob.v1]
      description: Frozen runtime transport contract; a runtime must support the exact advertised capability.
    CompetitionV2SubmissionPreflight:
      type: object
      additionalProperties: false
      required: [round_id, patch_sha256, base_source_lock_sha256, decision_mode, required_api_capability, reward_eligible]
      properties:
        round_id: {type: string, format: uuid}
        patch_sha256: {$ref: "#/components/schemas/Sha256"}
        base_source_lock_sha256: {$ref: "#/components/schemas/Sha256"}
        decision_mode: {$ref: "#/components/schemas/CompetitionDecisionMode"}
        required_api_capability: {$ref: "#/components/schemas/CompetitionRequiredCapability"}
        reward_eligible: {type: boolean}
        ineligibility_reason: {type: string}
    CompetitionSealedEntry:
      type: object
      additionalProperties: false
      required: [job_id, patch_sha256, base_source_lock_sha256, state, submitted_at, completed_at, rank, eligible]
      properties:
        job_id: {type: string, format: uuid}
        patch_sha256: {$ref: "#/components/schemas/Sha256"}
        base_source_lock_sha256: {$ref: "#/components/schemas/Sha256"}
        state: {type: string, enum: [succeeded, failed, canceled]}
        submitted_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        completed_at:
          type: string
          format: date-time
          description: Original authenticated terminal result commit after archive; never review, notification, or inferred execution time.
        score: {$ref: "#/components/schemas/CompetitionScoreResult"}
        score_sha256:
          $ref: "#/components/schemas/Sha256"
          description: Digest of exact archived score.json bytes, not a re-encoding of this public projection.
        artifact_manifest_sha256: {$ref: "#/components/schemas/Sha256"}
        rank: {type: integer, minimum: 1}
        eligible_candidate_rank: {type: integer, minimum: 1}
        eligible: {type: boolean}
        ineligibility_reason: {type: string}
    CompetitionEvaluationSeal:
      type: object
      additionalProperties: false
      required: [round_id, environment, competition_id, season_id, epoch, sealed_at, publication_at, source_choice_at, policy_sha256, baseline_raw_score, takeover_margin, inventory_sha256, ranking_sha256, seal_sha256, terminal_counts, entries]
      properties:
        staging:
          type: boolean
          default: false
          description: Explicit fee-free staging mode bound into the seal digest; absent means historical production, not an inferred zero-margin mode.
        round_id: {type: string, format: uuid}
        environment: {type: string}
        competition_id: {type: string}
        season_id: {type: string}
        epoch: {type: integer}
        sealed_at: {type: string, format: date-time}
        publication_at:
          type: string
          format: date-time
          description: Later of sealed_at and the frozen round reveal_at; close and complete authoritative drain are prerequisites for sealing, not a requirement for integrity/source approval.
        source_choice_at: {type: string, format: date-time}
        policy_sha256: {$ref: "#/components/schemas/Sha256"}
        baseline_sha256: {$ref: "#/components/schemas/Sha256"}
        baseline_raw_score:
          type: number
          minimum: 0
          description: Median raw latency from the immutable nine-replicate baseline, or zero when no scoring baseline was produced. Not the Welch sample mean.
        takeover_margin: {type: number, minimum: 0, maximum: 0.5}
        inventory_sha256: {$ref: "#/components/schemas/Sha256"}
        ranking_sha256: {$ref: "#/components/schemas/Sha256"}
        seal_sha256: {$ref: "#/components/schemas/Sha256"}
        terminal_counts: {type: object, additionalProperties: {type: integer, minimum: 0}}
        entries: {type: array, items: {$ref: "#/components/schemas/CompetitionSealedEntry"}}
    CompetitionRewardDecision:
      type: object
      additionalProperties: false
      required: [round_id, environment, competition_id, season_id, revision, decision_sha256, seal_sha256, action, selected_job_id, reason_code, decided_at, settlement_policy_version, burn_policy_version, settlement_mode]
      properties:
        staging:
          type: boolean
          default: false
          description: True only for a mode-bound shadow staging decision; it cannot be replayed into a production reward inbox.
        round_id: {type: string, format: uuid}
        environment: {type: string}
        competition_id: {type: string}
        season_id: {type: string}
        revision: {type: integer, minimum: 1}
        previous_decision_sha256: {$ref: "#/components/schemas/Sha256"}
        decision_sha256: {$ref: "#/components/schemas/Sha256"}
        seal_sha256: {$ref: "#/components/schemas/Sha256"}
        action:
          type: string
          enum: [elect, replace, no_winner, invalidated]
          description: |
            elect is revision one's provisional selection; replace is a later
            non-null selection, including restoration from no winner.
            no_winner has a null recipient at any revision. invalidated is a
            later terminal evaluation-integrity incident with null recipient,
            no settlement anchor or review_id, and no permitted successor.
            A review adds a reward revision only when the recipient changes;
            approving the current recipient does not create another entitlement.
        selected_job_id:
          type: [string, "null"]
          format: uuid
          description: Non-null for elect/replace; null for no_winner/invalidated. Selection alone is not integrity approval, source approval, or payment.
        superseded_job_id: {type: string, format: uuid}
        superseded_revision: {type: integer, minimum: 1}
        reason_code:
          type: string
          enum: [first_eligible, no_submissions, no_gate_passing_candidate, no_significant_improvement, no_new_reward_entitlement, all_eligible_disqualified, EVALUATION_INTEGRITY_INCIDENT]
          description: |
            Complete case-sensitive decision reason set, distinct from sealed
            entry ineligibility reasons and uppercase review reason_codes.
            first_eligible accompanies elect/replace: the first eligible,
            non-disqualified original ranked entry. no_winner reasons are
            no_submissions (empty inventory), all_eligible_disqualified
            (originally eligible entries exhausted), no_new_reward_entitlement
            (no eligible entry and an exact repeat exclusion exists),
            no_significant_improvement (a placeable non-gate-failing entry
            exists but none is eligible), or no_gate_passing_candidate.
            Exhausted eligibility takes precedence over repeat exclusion,
            then improvement, then gate failure. invalidated requires
            EVALUATION_INTEGRITY_INCIDENT, never a finding of candidate dishonesty.
        review_id: {type: string, format: uuid}
        decided_at: {type: string, format: date-time}
        effective_settlement_anchor:
          type: string
          format: date-time
          description: Selected job's original authenticated completed_at. It is evidence, not an entitlement/burn formula or funds-transfer time.
        settlement_policy_version: {type: string}
        burn_policy_version: {type: string}
        settlement_mode: {type: string, enum: [shadow, live]}
    CompetitionReviewFinding:
      type: object
      additionalProperties: false
      required: [criterion, disposition, reason_code, explanation, evidence_sha256]
      properties:
        model:
          type: string
          enum: ["", qwen3.8-27b, gemma-4-26b-a4b, muse-glimmer-30b]
          description: Required exact member attribution for Snow union findings; absent or empty for retained single-model policies.
        criterion: {type: string, enum: [measurement_integrity, workload_generalization, containment, patch_scope, reproducibility, source_safety]}
        disposition: {type: string, enum: [pass, fail, not_applicable, uncertain], description: Uncertain is accepted only for a Snow disqualified/rejected union with a separately substantiated matched failure; it can never approve a source.}
        reason_code: {type: string}
        explanation: {type: string, minLength: 1, maxLength: 4096}
        evidence_sha256: {$ref: "#/components/schemas/Sha256"}
    CompetitionSnowReviewFindings:
      type: array
      minItems: 18
      maxItems: 18
      description: Exactly one finding for each of six criteria under each of the three fixed Snow member IDs; no issue is merged away.
      items:
        allOf:
          - $ref: "#/components/schemas/CompetitionReviewFinding"
          - required: [model]
            properties:
              model: {enum: [qwen3.8-27b, gemma-4-26b-a4b, muse-glimmer-30b]}
      allOf:
        - contains: {type: object, required: [model, criterion], properties: {model: {const: qwen3.8-27b}, criterion: {const: measurement_integrity}}}
          minContains: 1
          maxContains: 1
        - contains: {type: object, required: [model, criterion], properties: {model: {const: qwen3.8-27b}, criterion: {const: workload_generalization}}}
          minContains: 1
          maxContains: 1
        - contains: {type: object, required: [model, criterion], properties: {model: {const: qwen3.8-27b}, criterion: {const: containment}}}
          minContains: 1
          maxContains: 1
        - contains: {type: object, required: [model, criterion], properties: {model: {const: qwen3.8-27b}, criterion: {const: patch_scope}}}
          minContains: 1
          maxContains: 1
        - contains: {type: object, required: [model, criterion], properties: {model: {const: qwen3.8-27b}, criterion: {const: reproducibility}}}
          minContains: 1
          maxContains: 1
        - contains: {type: object, required: [model, criterion], properties: {model: {const: qwen3.8-27b}, criterion: {const: source_safety}}}
          minContains: 1
          maxContains: 1
        - contains: {type: object, required: [model, criterion], properties: {model: {const: gemma-4-26b-a4b}, criterion: {const: measurement_integrity}}}
          minContains: 1
          maxContains: 1
        - contains: {type: object, required: [model, criterion], properties: {model: {const: gemma-4-26b-a4b}, criterion: {const: workload_generalization}}}
          minContains: 1
          maxContains: 1
        - contains: {type: object, required: [model, criterion], properties: {model: {const: gemma-4-26b-a4b}, criterion: {const: containment}}}
          minContains: 1
          maxContains: 1
        - contains: {type: object, required: [model, criterion], properties: {model: {const: gemma-4-26b-a4b}, criterion: {const: patch_scope}}}
          minContains: 1
          maxContains: 1
        - contains: {type: object, required: [model, criterion], properties: {model: {const: gemma-4-26b-a4b}, criterion: {const: reproducibility}}}
          minContains: 1
          maxContains: 1
        - contains: {type: object, required: [model, criterion], properties: {model: {const: gemma-4-26b-a4b}, criterion: {const: source_safety}}}
          minContains: 1
          maxContains: 1
        - contains: {type: object, required: [model, criterion], properties: {model: {const: muse-glimmer-30b}, criterion: {const: measurement_integrity}}}
          minContains: 1
          maxContains: 1
        - contains: {type: object, required: [model, criterion], properties: {model: {const: muse-glimmer-30b}, criterion: {const: workload_generalization}}}
          minContains: 1
          maxContains: 1
        - contains: {type: object, required: [model, criterion], properties: {model: {const: muse-glimmer-30b}, criterion: {const: containment}}}
          minContains: 1
          maxContains: 1
        - contains: {type: object, required: [model, criterion], properties: {model: {const: muse-glimmer-30b}, criterion: {const: patch_scope}}}
          minContains: 1
          maxContains: 1
        - contains: {type: object, required: [model, criterion], properties: {model: {const: muse-glimmer-30b}, criterion: {const: reproducibility}}}
          minContains: 1
          maxContains: 1
        - contains: {type: object, required: [model, criterion], properties: {model: {const: muse-glimmer-30b}, criterion: {const: source_safety}}}
          minContains: 1
          maxContains: 1
    CompetitionIntegrityReviewRequest:
      type: object
      additionalProperties: false
      required: [idempotency_key, expected_revision, job_id, patch_sha256, base_source_lock_sha256, score_sha256, baseline_sha256, artifact_manifest_sha256, criteria_version, reward_disposition, source_disposition, reason_codes, public_explanation, withheld_evidence_explanation, private_evidence_sha256, findings]
      allOf:
        - if:
            required: [reviewer_model]
            properties:
              reviewer_model: {const: snow-qwen-gemma-muse-union}
          then:
            required: [expected_decision_sha256, reviewer_reasoning]
            properties:
              reviewer_reasoning: {const: provider-default}
              reward_disposition: {enum: [approved, restored, disqualified]}
              source_disposition: {enum: [approved, rejected]}
              findings: {$ref: "#/components/schemas/CompetitionSnowReviewFindings"}
            allOf:
              - if:
                  properties:
                    reward_disposition: {const: disqualified}
                then:
                  properties:
                    source_disposition: {const: rejected}
                    reason_codes:
                      items:
                        not: {enum: [APPROVED, APPEAL_UPHELD, SOURCE_NOT_READY, PRODUCT_INTEGRATION_RISK, EVALUATION_INTEGRITY_INCIDENT]}
                else:
                  properties:
                    source_disposition: {const: approved}
                    findings:
                      items:
                        properties:
                          disposition: {enum: [pass, not_applicable]}
          else:
            properties:
              findings:
                minItems: 6
                maxItems: 6
                items:
                  properties:
                    model: {const: ""}
                    disposition: {enum: [pass, fail, not_applicable]}
      properties:
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
        expected_revision: {type: integer, minimum: 1}
        job_id: {type: string, format: uuid}
        patch_sha256: {$ref: "#/components/schemas/Sha256"}
        base_source_lock_sha256: {$ref: "#/components/schemas/Sha256"}
        score_sha256: {$ref: "#/components/schemas/Sha256"}
        baseline_sha256: {$ref: "#/components/schemas/Sha256"}
        artifact_manifest_sha256: {$ref: "#/components/schemas/Sha256"}
        criteria_version: {type: string, maxLength: 128}
        reward_disposition: {type: string, enum: [approved, disqualified, restored, unchanged]}
        source_disposition: {type: string, enum: [approved, rejected, deferred, unchanged]}
        reason_codes: {type: array, minItems: 1, maxItems: 16, items: {type: string}}
        public_explanation: {type: string, minLength: 1, maxLength: 4096}
        withheld_evidence_explanation: {type: string, minLength: 1}
        private_evidence_sha256: {$ref: "#/components/schemas/Sha256"}
        findings: {type: array, minItems: 6, maxItems: 18, items: {$ref: "#/components/schemas/CompetitionReviewFinding"}, description: Exactly six un-attributed legacy findings or eighteen complete Snow member/criterion pairs; total request remains bounded to 64 KiB.}
        supersedes_review_id: {type: string, format: uuid}
        appeal_id: {type: string}
        expected_replacement_job_id: {type: string, format: uuid}
        expected_decision_sha256:
          $ref: "#/components/schemas/Sha256"
          description: Required by each elected-winner policy; binds the exact current reward decision and durable review window.
        reviewer_model:
          type: string
          enum: [snow-qwen-gemma-muse-union, gpt-5.4-mini, gpt-6.1-sol]
          description: Required broker provenance pinned by the frozen policy; the Snow identity is the three-member aggregate, never a fabricated individual model. Historical mini/xhigh and Sol/max tuples cannot be mixed or relabeled. Not independent model attestation.
        reviewer_reasoning: {type: string, enum: [provider-default, xhigh, max]}
    CompetitionIntegrityReviewResult:
      type: object
      additionalProperties: false
      required: [review_id, round_id, actor_id, created_at, request, request_sha256, reward_decision]
      properties:
        review_id: {type: string, format: uuid}
        round_id: {type: string, format: uuid}
        actor_id: {type: string}
        created_at: {type: string, format: date-time}
        request: {$ref: "#/components/schemas/CompetitionIntegrityReviewRequest"}
        request_sha256: {$ref: "#/components/schemas/Sha256"}
        reward_decision: {$ref: "#/components/schemas/CompetitionRewardDecision"}
    CompetitionPublicIntegrityReview:
      type: object
      additionalProperties: false
      required: [review_id, round_id, actor_id, created_at, request, request_sha256, reward_decision]
      properties:
        review_id: {type: string, format: uuid}
        round_id: {type: string, format: uuid}
        actor_id: {type: string, const: ""}
        created_at: {type: string, format: date-time}
        request_sha256: {$ref: "#/components/schemas/Sha256"}
        reward_decision: {$ref: "#/components/schemas/CompetitionRewardDecision"}
        request:
          type: object
          description: Original evidence identities with explicitly redacted private request content. Request digest continues to identify the original private record.
          additionalProperties: false
          properties:
            idempotency_key: {type: string, const: ""}
            expected_revision: {type: integer}
            expected_decision_sha256: {$ref: "#/components/schemas/Sha256"}
            reviewer_model: {type: string, enum: [snow-qwen-gemma-muse-union, gpt-5.4-mini, gpt-6.1-sol]}
            reviewer_reasoning: {type: string, enum: [provider-default, xhigh, max]}
            job_id: {type: string, format: uuid}
            patch_sha256: {$ref: "#/components/schemas/Sha256"}
            base_source_lock_sha256: {$ref: "#/components/schemas/Sha256"}
            score_sha256: {$ref: "#/components/schemas/Sha256"}
            baseline_sha256: {$ref: "#/components/schemas/Sha256"}
            artifact_manifest_sha256: {$ref: "#/components/schemas/Sha256"}
            criteria_version: {type: string}
            reward_disposition: {type: string}
            source_disposition: {type: string}
            reason_codes: {type: array, items: {type: string}}
            public_explanation: {type: string}
            withheld_evidence_explanation: {type: string}
            private_evidence_sha256: {type: string, const: ""}
            supersedes_review_id: {type: string, format: uuid}
            appeal_id: {type: string}
            findings:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  model: {type: string, enum: ["", qwen3.8-27b, gemma-4-26b-a4b, muse-glimmer-30b]}
                  criterion: {type: string}
                  disposition: {type: string}
                  reason_code: {type: string}
                  explanation: {type: string, const: ""}
                  evidence_sha256: {type: string, const: ""}
    CompetitionRewardEvent:
      type: object
      additionalProperties: false
      required: [cursor, event_id, payload_sha256, publication_at, decision]
      properties:
        cursor: {type: integer, format: int64, minimum: 1}
        event_id: {type: string, format: uuid}
        payload_sha256: {$ref: "#/components/schemas/Sha256"}
        publication_at: {type: string, format: date-time}
        decision: {$ref: "#/components/schemas/CompetitionRewardDecision"}
    CompetitionRewardEventPage:
      type: object
      additionalProperties: false
      required: [events, next_cursor]
      properties:
        events: {type: array, maxItems: 200, items: {$ref: "#/components/schemas/CompetitionRewardEvent"}}
        next_cursor: {type: integer, format: int64, minimum: 0}
    CompetitionSettlementReceipt:
      type: object
      additionalProperties: false
      required: [event_id, environment, competition_id, season_id, round_id, revision, payload_sha256, decision_sha256, status, accounting_reference]
      properties:
        event_id: {type: string, format: uuid}
        environment: {type: string}
        competition_id: {type: string}
        season_id: {type: string}
        round_id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        payload_sha256: {$ref: "#/components/schemas/Sha256"}
        decision_sha256: {$ref: "#/components/schemas/Sha256"}
        status: {type: string, enum: [received, applied, confirmed, rejected]}
        accounting_reference: {type: string, maxLength: 1024}
        chain_transaction: {type: string, maxLength: 256}
        applied_at: {type: string, format: date-time}
        received_at: {type: string, format: date-time, description: Server-assigned receipt commit time.}
        actor_id: {type: string, description: Authenticated actor; redacted in public results.}
    CompetitionV2RoundResult:
      type: object
      additionalProperties: false
      required: [decision_mode, required_api_capability, seal, reward_revision, provisional_reward_winner, integrity_review, source_approval, decisions, integrity_reviews, settlement_status, settlement_receipts, incidents, invalidated]
      properties:
        staging:
          type: boolean
          default: false
          description: Must match the sealed round and every reward decision. A staging winner remains provisional and does not approve source.
        decision_mode: {$ref: "#/components/schemas/CompetitionDecisionMode"}
        required_api_capability: {$ref: "#/components/schemas/CompetitionRequiredCapability"}
        seal: {$ref: "#/components/schemas/CompetitionEvaluationSeal"}
        reward_revision:
          type: integer
          minimum: 1
          description: Current final element of the contiguous one-based decisions history; approval-only reviews need not advance it.
        provisional_reward_winner:
          type: [string, "null"]
          format: uuid
          description: Current decision's selected_job_id; a provisional reward does not wait for integrity or source approval and is not payment.
        integrity_review:
          type: string
          enum: [not_reviewed, approved, disqualified, not_applicable]
          description: Only reviews of the current provisional recipient count. Starts not_reviewed, affirmative/restored reward review projects approved, disqualification projects disqualified, and no current recipient means not_applicable.
        source_approval:
          type: string
          enum: [pending, approved, rejected, deferred, not_applicable]
          description: Current recipient's source review, initially pending and not_applicable with no recipient. Disqualification rejects source; reward restoration alone does not restore it. Distinct from the reviewed incumbent intent in source_decision.
        decisions:
          type: array
          minItems: 1
          description: Immutable contiguous reward revisions ordered by revision. Each successor authenticates its predecessor; scores, completion timestamps, sealed ranking and evidence remain unchanged.
          items: {$ref: "#/components/schemas/CompetitionRewardDecision"}
        integrity_reviews: {type: array, items: {$ref: "#/components/schemas/CompetitionPublicIntegrityReview"}}
        source_decision: {$ref: "#/components/schemas/CompetitionSourceActivation"}
        settlement_status:
          type: string
          enum: [pending, received, applied, confirmed, rejected]
          description: |
            Receipts for the current reward revision only, with precedence
            confirmed > applied > rejected > received > pending. pending means
            no receipt; received acknowledges delivery only; applied/confirmed
            are external accounting claims, not proof of reversible transfer.
            Historical receipts remain visible but do not settle a replacement.
            Explicit shadow staging permits only pending, received, or rejected;
            its receipts cannot assert applied_at or a chain transaction.
        settlement_receipts: {type: array, items: {$ref: "#/components/schemas/CompetitionSettlementReceipt"}}
        incidents: {type: array, items: {$ref: "#/components/schemas/CompetitionAutomationIncident"}}
        invalidated: {type: boolean}
    CompetitionSourceActivation:
      type: object
      required: [target_round_id]
      description: Separately authorized reviewed source intent; public projection omits raw manifest and private Git refs.
      properties:
        staging:
          type: boolean
          default: false
          description: Immutable mode; staging source refs use only sim-latency-staging, never the production branches.
        staging_round_window_seconds:
          type: integer
          minimum: 60
          maximum: 604800
          description: Frozen admission duration for explicit staging, omitted for production.
        staging_preparation_seconds:
          type: integer
          minimum: 0
          maximum: 57600
          description: Frozen staging preparation delay; zero does not waive exact-source readiness or containment. Omitted for production and when zero.
        environment: {type: string}
        competition_id: {type: string}
        season_id: {type: string}
        generation: {type: integer, format: int64}
        expected_generation: {type: integer, format: int64}
        source_generation: {type: integer}
        target_epoch: {type: integer}
        target_round_id: {type: string, format: uuid, description: Immutable reserved identity shared by readiness receipts and the later round in the same explicit mode.}
        source_decision_digest: {$ref: "#/components/schemas/Sha256"}
        approved_patch_sha256: {$ref: "#/components/schemas/Sha256"}
        kind: {type: string}
        reason: {type: string}
        base_source_lock_sha256: {$ref: "#/components/schemas/Sha256"}
        source_lock_sha256: {$ref: "#/components/schemas/Sha256"}
        commits: {type: object, additionalProperties: {$ref: "#/components/schemas/GitSha"}}
        git_refs: {type: [object, "null"]}
        review_id: {type: string, format: uuid}
        review_decision_digest: {$ref: "#/components/schemas/Sha256"}
        reward_decision_digest: {$ref: "#/components/schemas/Sha256"}
        winner_review_policy: {type: string, enum: [elected_winner_snow_union_v1, elected_winner_gpt54mini_xhigh_v1, elected_winner_sol61max_v1]}
        winner_review: {$ref: "#/components/schemas/CompetitionWinnerReviewCheckpoint"}
        manifest_commit: {$ref: "#/components/schemas/GitSha"}
        manifest_sha256: {$ref: "#/components/schemas/Sha256"}
        publication_journal_sha256: {$ref: "#/components/schemas/Sha256"}
        config_expected_commit: {$ref: "#/components/schemas/GitSha"}
        evaluator_image_digest: {$ref: "#/components/schemas/ImageDigest"}
        evaluated_image_digest: {$ref: "#/components/schemas/ImageDigest"}
        host_qualification_sha256: {$ref: "#/components/schemas/Sha256"}
        threshold: {type: number}
        threshold_evidence_sha256: {$ref: "#/components/schemas/Sha256"}
        prepared_at: {type: string, format: date-time}
        build_ready_at: {type: string, format: date-time}
        opens_at: {type: string, format: date-time}
        activated_at: {type: string, format: date-time}
        abandoned_at: {type: string, format: date-time}
        intent_sha256: {$ref: "#/components/schemas/Sha256"}
        state: {type: string}
    CompetitionWinnerReviewCheckpoint:
      type: object
