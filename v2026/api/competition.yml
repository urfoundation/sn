        manifest_commit: {$ref: "#/components/schemas/GitSha"}
        manifest_sha256: {$ref: "#/components/schemas/Sha256"}
        source_lock_sha256: {$ref: "#/components/schemas/Sha256"}
        runtime_image_digest: {$ref: "#/components/schemas/ImageDigest"}
        qualification_sha256: {$ref: "#/components/schemas/Sha256"}
