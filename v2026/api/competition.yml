    CompetitionAutomationHoldArgs:
      type: object
      additionalProperties: false
      required: [kind, active, expected_revision, idempotency_key, reason_code, public_explanation, evidence_sha256]
      properties:
        kind: {type: string, enum: [admission, evaluation, source_activation, reward_delivery]}
        active: {type: boolean}
        expected_revision: {type: integer, minimum: 0}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
        reason_code: {type: string, enum: [OPERATOR_HOLD, EVALUATION_INTEGRITY_INCIDENT, SOURCE_COMPROMISE, RECOVERY_APPROVED]}
