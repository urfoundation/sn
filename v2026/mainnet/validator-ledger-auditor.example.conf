# Gives the repository's validator unit the settlement v2 auditor key
# (VERSION2-LAUNCH.md step 10, O10, O15). Install as
# /etc/systemd/system/sn-mainnet-validator-<role>.service.d/ledger-auditor.conf.
# The empty ExecStart clears the unit's own. The second is the command line the
# repository renders for the unit (repairValidatorUnit.arguments), naming the
# adopted config, plus --ledger_auditor_key_file. The key file holds the O10
# auditor's hex secp256k1 key; root owns it, its group is the service's, mode 0440.
[Service]
ExecStart=
ExecStart=<validator-binary> run --config=<adopted-config> --progress-file=<progress-file> --durable-volumes=<validator-declaration> --durable-volumes-sha256=<validator-declaration-sha256> --ledger_auditor_key_file=<O10-auditor-key-file>
