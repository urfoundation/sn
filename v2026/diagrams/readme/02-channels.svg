<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Three channels: deposits are locked forever in a reserve; emission is set by validators every tempo; settlement pays pool providers by Merkle claim every seven-day epoch."><title>Three channels: deposits are locked forever in a reserve; emission is set by validators every tempo; settlement pays pool providers by Merkle claim every seven-day epoch.</title><defs></defs><rect width="900" height="250" rx="16" fill="#F8F7F5"/><text x="30" y="32" font-family="'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#5F5F5F" text-anchor="start">MECHANISM AT A GLANCE</text><text x="30" y="60" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#0D0D0D" text-anchor="start">Three money channels, all in α</text><rect x="30" y="80" width="268" height="150" rx="12" fill="#FFFFFF" stroke="#D9DDD9" stroke-width="1.5"/><circle cx="54" cy="104" r="12" fill="#0D0D0D" stroke="none" stroke-width="1.6"/><text x="54" y="108.5" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="74" y="109" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#0D0D0D" text-anchor="start">Deposits</text><text x="46" y="138" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0D0D0D" text-anchor="start">NO stakes α sized to usage</text><text x="46" y="157" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0D0D0D" text-anchor="start">→ locked in the reserve</text><text x="46" y="176" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0D0D0D" text-anchor="start">never distributed</text><rect x="46" y="198" width="158.0" height="21" rx="10.5" fill="#F4F4F2" stroke="#0D0D0D" stroke-width="1"/><text x="125.0" y="213" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0D0D0D" text-anchor="middle">per epoch, if priced</text><rect x="314" y="80" width="268" height="150" rx="12" fill="#FFFFFF" stroke="#155E3B" stroke-width="1.5"/><circle cx="338" cy="104" r="12" fill="#155E3B" stroke="none" stroke-width="1.6"/><text x="338" y="108.5" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="358" y="109" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#155E3B" text-anchor="start">Emission</text><text x="330" y="138" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0D0D0D" text-anchor="start">validators score both tiers</text><text x="330" y="157" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0D0D0D" text-anchor="start">Yuma pays 18 / 41 / 41</text><text x="330" y="176" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0D0D0D" text-anchor="start">the 41% miner share is steered</text><rect x="330" y="198" width="158.0" height="21" rx="10.5" fill="#E7F0EA" stroke="#155E3B" stroke-width="1"/><text x="409.0" y="213" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#155E3B" text-anchor="middle">every tempo ≈ 72 min</text><rect x="598" y="80" width="268" height="150" rx="12" fill="#FFFFFF" stroke="#155E3B" stroke-width="1.5"/><circle cx="622" cy="104" r="12" fill="#155E3B" stroke="none" stroke-width="1.6"/><text x="622" y="108.5" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="642" y="109" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#155E3B" text-anchor="start">Settlement</text><text x="614" y="138" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0D0D0D" text-anchor="start">vault captures pool emission</text><text x="614" y="157" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0D0D0D" text-anchor="start">NO commits a payout root</text><text x="614" y="176" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0D0D0D" text-anchor="start">providers claim with a proof</text><rect x="614" y="198" width="158.0" height="21" rx="10.5" fill="#E7F0EA" stroke="#155E3B" stroke-width="1"/><text x="693.0" y="213" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#155E3B" text-anchor="middle">every epoch = 7 days</text></svg>
