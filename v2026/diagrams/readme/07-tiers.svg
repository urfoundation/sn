<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="A fleet starts paid inside a pool, registers its own UID and binds its client_ids to graduate to the head, and is pruned back to the pool by native lowest-emission deregistration. The 256-UID budget is shared by head fleets, pool UIDs, validators and owner identities."><title>A fleet starts paid inside a pool, registers its own UID and binds its client_ids to graduate to the head, and is pruned back to the pool by native lowest-emission deregistration. The 256-UID budget is shared by head fleets, pool UIDs, validators and owner identities.</title><defs><marker id="m14231B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14231B"/></marker><marker id="mC93A3F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C93A3F"/></marker></defs><rect width="900" height="380" rx="16" fill="#F8F7F5"/><text x="30" y="32" font-family="'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#5F5F5F" text-anchor="start">TWO MINER TIERS</text><text x="30" y="60" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#0D0D0D" text-anchor="start">Two tiers: a pooled tail and a direct head</text><rect x="30" y="84" width="360" height="108" rx="12" fill="#E7F0EA" stroke="#155E3B" stroke-width="1.5"/><text x="44" y="107" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#155E3B" text-anchor="start">Pool tier (tail)</text><text x="44" y="128" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">one vault-owned UID per NO</text><text x="44" y="145" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">providers are client_ids, no UID, no burn</text><text x="44" y="162" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">paid by Merkle claim inside the pool</text><text x="44" y="179" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">low barrier, baseline pay</text><rect x="510" y="84" width="360" height="108" rx="12" fill="#FFFFFF" stroke="#D9DDD9" stroke-width="1.4"/><text x="524" y="107" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0D0D0D" text-anchor="start">Head tier (≤ 200 fleets)</text><text x="524" y="128" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">a fleet = one hotkey binding many client_ids</text><text x="524" y="145" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">own UID, paid natively each tempo</text><text x="524" y="162" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">ranked by routable-prefix breadth</text><text x="524" y="179" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">no contract, no operator in the payout path</text><path d="M390 112H506" fill="none" stroke="#14231B" stroke-width="1.8" marker-end="url(#m14231B)"/><text x="448" y="104" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#14231B" text-anchor="middle">burn-register</text><text x="448" y="128" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#14231B" text-anchor="middle">+ dual-signed bind</text><path d="M510 162H394" fill="none" stroke="#C93A3F" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#mC93A3F)"/><text x="452" y="178" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#C93A3F" text-anchor="middle">pruned</text><text x="30" y="214" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#5F5F5F" text-anchor="start">A client_id earns in one tier at a time: the NO server drops bound clients from its payout root (off-chain check).</text><text x="30" y="240" font-family="'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#5F5F5F" text-anchor="start">256-UID BUDGET (EXAMPLE: 64 VALIDATORS, 2 NOS)</text><rect x="30" y="252" width="208.0" height="30" rx="6" fill="#8A5A00" stroke="none" stroke-width="0"/><text x="134.0" y="272" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">validators</text><rect x="240.0" y="252" width="4.5625" height="30" rx="6" fill="#5F5F5F" stroke="none" stroke-width="0"/><rect x="246.5625" y="252" width="4.5625" height="30" rx="6" fill="#155E3B" stroke="none" stroke-width="0"/><rect x="253.125" y="252" width="614.875" height="30" rx="6" fill="#14231B" stroke="none" stroke-width="0"/><text x="560.5625" y="272" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">head fleets  (≤ 188 here, cap 200)</text><text x="246.0" y="300" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#5F5F5F" text-anchor="start">owner + escrow (2) · pool UIDs (1 per NO)</text><rect x="30" y="314" width="840" height="48" rx="10" fill="#F4F4F2" stroke="none" stroke-width="0"/><text x="46" y="334" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5F5F5F" text-anchor="start">The head gets what is left. With 56 validators (the whitepaper target) and 200 fleets, no room remains for pools,</text><text x="46" y="351" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5F5F5F" text-anchor="start">so the practical head is 256 − validators − pools − 2. Losing fleets earn 0 and are pruned when a new fleet registers.</text></svg>
