<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 396" width="900" height="396" role="img" aria-label="Each tempo the coinbase splits alpha 18 percent owner, 41 percent miners, 41 percent validators. Validators steer the miner share: theta to head fleets by routable-IP breadth, one minus theta to pool UIDs by implied demand times clamped quality."><title>Each tempo the coinbase splits alpha 18 percent owner, 41 percent miners, 41 percent validators. Validators steer the miner share: theta to head fleets by routable-IP breadth, one minus theta to pool UIDs by implied demand times clamped quality.</title><defs><marker id="m155E3B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#155E3B"/></marker></defs><rect width="900" height="396" rx="16" fill="#F8F7F5"/><text x="30" y="32" font-family="'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#5F5F5F" text-anchor="start">CHANNEL 2 · EMISSION</text><text x="30" y="60" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#0D0D0D" text-anchor="start">Emission: who gets each tempo's α</text><rect x="30" y="84" width="148.2" height="34" rx="8" fill="#5F5F5F" stroke="none" stroke-width="0"/><text x="104.1" y="106" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">owner 18%</text><rect x="181.2" y="84" width="341.4" height="34" rx="8" fill="#155E3B" stroke="none" stroke-width="0"/><text x="351.9" y="106" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">miners 41%</text><rect x="525.5999999999999" y="84" width="341.4" height="34" rx="8" fill="#8A5A00" stroke="none" stroke-width="0"/><text x="696.3" y="106" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">validators 41%</text><text x="697.8" y="140" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#8A5A00" text-anchor="middle">native: ∝ stake × vtrust (incl. the reserve)</text><path d="M353.4 118V156" fill="none" stroke="#155E3B" stroke-width="1.8" marker-end="url(#m155E3B)"/><text x="353.4" y="176" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#155E3B" text-anchor="middle">validators steer the miner share by θ</text><rect x="30" y="190" width="249.0" height="30" rx="8" fill="#14231B" stroke="none" stroke-width="0"/><text x="156" y="210" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">θ = 0.3  head fleets</text><rect x="282.0" y="190" width="588.0" height="30" rx="8" fill="#155E3B" stroke="none" stroke-width="0"/><text x="576" y="210" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">1 − θ = 0.7  pool UIDs (one per NO)</text><rect x="30" y="236" width="300" height="92" rx="12" fill="#FFFFFF" stroke="#D9DDD9" stroke-width="1.4"/><text x="44" y="259" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0D0D0D" text-anchor="start">Head: up to 200 fleets</text><text x="44" y="280" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">weight = split-adjusted count of</text><text x="44" y="297" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">routable egress-prefix hashes</text><text x="44" y="314" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">paid natively to the fleet hotkey</text><rect x="346" y="236" width="524" height="92" rx="12" fill="#E7F0EA" stroke="#155E3B" stroke-width="1.5"/><text x="360" y="259" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#155E3B" text-anchor="start">Pool: per-NO UID</text><text x="360" y="280" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">weight = implied_usage × clamp(Q, 0.75, 1.0)</text><text x="360" y="297" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">implied_usage = audited usage × baseline rate (1 at zero price)</text><text x="360" y="314" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">paid into the vault, then to providers by Merkle claim</text><rect x="30" y="340" width="840" height="40" rx="10" fill="#FBE9EA" stroke="#C93A3F" stroke-width="1" stroke-dasharray="4 3"/><text x="46" y="365" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#C93A3F" text-anchor="start">Mainnet bootstrap plan (mainnet/MAINNET.md): provider weights fill 10% of the miner row; 90% goes to recognized owner hotkeys (owner-recycle).</text></svg>
