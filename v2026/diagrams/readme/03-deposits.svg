<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="A network operator stakes alpha on its deposit hotkey; the coordinator moves the exact amount into the immutable reserve sink, staked on the owner-validator hotkey; nothing ever leaves; cumulative locked alpha sets a cheaper rate tier."><title>A network operator stakes alpha on its deposit hotkey; the coordinator moves the exact amount into the immutable reserve sink, staked on the owner-validator hotkey; nothing ever leaves; cumulative locked alpha sets a cheaper rate tier.</title><defs><marker id="m0D0D0D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0D0D0D"/></marker><marker id="m8A5A00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A5A00"/></marker><marker id="mC93A3F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C93A3F"/></marker></defs><rect width="900" height="400" rx="16" fill="#F8F7F5"/><text x="30" y="32" font-family="'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#5F5F5F" text-anchor="start">CHANNEL 1 · DEPOSITS</text><text x="30" y="60" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#0D0D0D" text-anchor="start">Deposits: one-way into the reserve</text><rect x="30" y="84" width="170" height="72" rx="12" fill="#FFFFFF" stroke="#D9DDD9" stroke-width="1.4"/><text x="44" y="107" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#0D0D0D" text-anchor="start">NO coldkey</text><text x="44" y="128" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">stakes α on its</text><text x="44" y="145" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">deposit hotkey</text><rect x="250" y="84" width="190" height="72" rx="12" fill="#FFFFFF" stroke="#D9DDD9" stroke-width="1.4"/><text x="264" y="107" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#0D0D0D" text-anchor="start">STCoordinator</text><text x="264" y="128" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">deposit() by the</text><text x="264" y="145" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">NO's deposit signer</text><rect x="490" y="84" width="230" height="72" rx="12" fill="#FBE9EA" stroke="#C93A3F" stroke-width="1.5"/><text x="504" y="107" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#C93A3F" text-anchor="start">STReserveSink  (immutable)</text><text x="504" y="128" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">staked on reserve hotkey</text><text x="504" y="145" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">= owner-validator hotkey</text><path d="M200 116H246" fill="none" stroke="#0D0D0D" stroke-width="1.8" marker-end="url(#m0D0D0D)"/><path d="M440 116H486" fill="none" stroke="#C93A3F" stroke-width="1.8" marker-end="url(#mC93A3F)"/><text x="463" y="108" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#C93A3F" text-anchor="middle">exact</text><rect x="750" y="84" width="120" height="72" rx="10" fill="#FFFFFF" stroke="#C93A3F" stroke-width="1.4" stroke-dasharray="4 3"/><text x="810" y="110" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#C93A3F" text-anchor="middle">no outbound</text><text x="810" y="128" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#C93A3F" text-anchor="middle">code path</text><path d="M720 116H746" fill="none" stroke="#C93A3F" stroke-width="1.6"/><path d="M560 156V178H650V160" fill="none" stroke="#C93A3F" stroke-width="1.6" marker-end="url(#mC93A3F)"/><text x="605" y="192" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#C93A3F" text-anchor="middle">dividends compound in place</text><path d="M700 156Q740 196 770 206" fill="none" stroke="#8A5A00" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m8A5A00)"/><text x="790" y="226" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#8A5A00" text-anchor="middle">adds to the owner</text><text x="790" y="242" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#8A5A00" text-anchor="middle">validator's stake weight</text><text x="30" y="196" font-family="'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#5F5F5F" text-anchor="start">CONVICTION → RATE TIER (TESTNET POLICY-V2)</text><rect x="30" y="208" width="138" height="56" rx="12" fill="#FFFFFF" stroke="#D9DDD9" stroke-width="1.3"/><text x="42" y="230" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5F5F5F" text-anchor="start">locked 0 α</text><text x="42" y="251" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#155E3B" text-anchor="start">40 α / GiB</text><rect x="180" y="208" width="138" height="56" rx="12" fill="#FFFFFF" stroke="#D9DDD9" stroke-width="1.3"/><text x="192" y="230" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5F5F5F" text-anchor="start">locked ≥ 1 α</text><text x="192" y="251" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#155E3B" text-anchor="start">32 α / GiB</text><rect x="330" y="208" width="138" height="56" rx="12" fill="#FFFFFF" stroke="#D9DDD9" stroke-width="1.3"/><text x="342" y="230" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5F5F5F" text-anchor="start">locked ≥ 10 α</text><text x="342" y="251" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#155E3B" text-anchor="start">24 α / GiB</text><text x="30" y="292" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#0D0D0D" text-anchor="start">Required deposit = last epoch's audited usage × the NO's tier rate (tier snapshotted before the epoch).</text><text x="30" y="312" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#0D0D0D" text-anchor="start">A missing or mismatched deposit sets that NO's pool weight to 0.</text><rect x="30" y="330" width="840" height="50" rx="10" fill="#F4F4F2" stroke="none" stroke-width="0"/><text x="46" y="352" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5F5F5F" text-anchor="start">Zero-price launch mode (zero_rate_action: equal_demand): no deposits are required, every pool carries</text><text x="46" y="369" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5F5F5F" text-anchor="start">the same implied demand, and quality alone steers the pool channel. The shipped testnet policy instead halts on a zero rate.</text></svg>
