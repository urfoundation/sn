<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Validators measure providers on server-assigned hops: Wilson-score liveness and latency percentiles, EMA-smoothed. Pools get an exposure-weighted mean quality per NO, clamped to 0.75 to 1. Head fleets get a split-adjusted count of distinct routable prefix hashes."><title>Validators measure providers on server-assigned hops: Wilson-score liveness and latency percentiles, EMA-smoothed. Pools get an exposure-weighted mean quality per NO, clamped to 0.75 to 1. Head fleets get a split-adjusted count of distinct routable prefix hashes.</title><defs><marker id="m14231B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14231B"/></marker><marker id="m155E3B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#155E3B"/></marker></defs><rect width="900" height="330" rx="16" fill="#F8F7F5"/><text x="30" y="32" font-family="'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#5F5F5F" text-anchor="start">CHANNEL 2 · SCORING</text><text x="30" y="60" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#0D0D0D" text-anchor="start">How a validator scores the two tiers</text><rect x="30" y="84" width="250" height="110" rx="12" fill="#FBF1DC" stroke="#8A5A00" stroke-width="1.5"/><text x="44" y="107" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#8A5A00" text-anchor="start">Trail measurements</text><text x="44" y="128" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">server-assigned, non-seed hops</text><text x="44" y="145" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">liveness: Wilson-score interval</text><text x="44" y="162" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">latency: median / p95 / p99</text><text x="44" y="179" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">EMA-smoothed per provider</text><path d="M280 114H330V106H366" fill="none" stroke="#155E3B" stroke-width="1.8" marker-end="url(#m155E3B)"/><path d="M280 150H330V214H366" fill="none" stroke="#14231B" stroke-width="1.8" marker-end="url(#m14231B)"/><rect x="370" y="74" width="500" height="92" rx="12" fill="#E7F0EA" stroke="#155E3B" stroke-width="1.5"/><text x="384" y="97" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#155E3B" text-anchor="start">Pool quality Q_n  (tail)</text><text x="384" y="118" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">exposure-weighted mean of the NO's tail providers</text><text x="384" y="135" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">(head-bound clients excluded); Q &gt; 0 is clamped to [0.75, 1]</text><text x="384" y="152" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">→ live pools differ by at most 1.33× on quality</text><rect x="370" y="178" width="500" height="92" rx="12" fill="#FFFFFF" stroke="#D9DDD9" stroke-width="1.4"/><text x="384" y="201" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0D0D0D" text-anchor="start">Head score  (fleets)</text><text x="384" y="222" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">count distinct routable /29 IPv4 · /48 IPv6 prefix hashes</text><text x="384" y="239" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">a hash shared by k fleets counts 1/k to each</text><text x="384" y="256" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">no separate quality term: routable = it completed a hop</text><text x="30" y="302" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5F5F5F" text-anchor="start">Each validator scores from its own trails, normalizes head to θ and pools to 1 − θ, then commits one vector (commit-reveal).</text></svg>
