<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Customers buy privacy traffic from network operators; providers carry it; validators walk provider chains, score both miner tiers and set weights; Yuma turns weights into alpha emission."><title>Customers buy privacy traffic from network operators; providers carry it; validators walk provider chains, score both miner tiers and set weights; Yuma turns weights into alpha emission.</title><defs><marker id="m155E3B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#155E3B"/></marker><marker id="m5F5F5F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5F5F5F"/></marker><marker id="m8A5A00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A5A00"/></marker></defs><rect width="900" height="330" rx="16" fill="#F8F7F5"/><text x="30" y="32" font-family="'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#5F5F5F" text-anchor="start">OVERVIEW</text><text x="30" y="60" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#0D0D0D" text-anchor="start">Who does what</text><rect x="30" y="84" width="170" height="70" rx="12" fill="#FFFFFF" stroke="#D9DDD9" stroke-width="1.4"/><text x="44" y="107" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#0D0D0D" text-anchor="start">Customers</text><text x="44" y="128" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">buy VPN / privacy</text><text x="44" y="145" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">traffic (the demand)</text><rect x="260" y="84" width="200" height="70" rx="12" fill="#FFFFFF" stroke="#D9DDD9" stroke-width="1.4"/><text x="274" y="107" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#0D0D0D" text-anchor="start">Network Operator (NO)</text><text x="274" y="128" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">runs servers + /verify</text><text x="274" y="145" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">commits payout roots</text><rect x="520" y="84" width="350" height="70" rx="12" fill="#E7F0EA" stroke="#155E3B" stroke-width="1.5"/><text x="534" y="107" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#155E3B" text-anchor="start">Providers  (100k+)</text><text x="534" y="128" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">carry ingress / egress traffic</text><text x="534" y="145" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">client_id, not a UID (pool tier)</text><path d="M200 119H256" fill="none" stroke="#5F5F5F" stroke-width="1.8" marker-end="url(#m5F5F5F)"/><path d="M460 119H516" fill="none" stroke="#5F5F5F" stroke-width="1.8" marker-end="url(#m5F5F5F)"/><text x="228" y="110" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#5F5F5F" text-anchor="middle">$</text><text x="488" y="110" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5F5F5F" text-anchor="middle">routes</text><rect x="30" y="196" width="230" height="112" rx="12" fill="#FBF1DC" stroke="#8A5A00" stroke-width="1.5"/><text x="44" y="219" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#8A5A00" text-anchor="start">Validators</text><text x="44" y="240" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">stake their own α</text><text x="44" y="257" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">walk server-assigned</text><text x="44" y="274" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">provider chains every tempo</text><circle cx="330" cy="244" r="13" fill="#FFFFFF" stroke="#155E3B" stroke-width="1.6"/><text x="330" y="248" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#155E3B" text-anchor="middle">p1</text><path d="M344 244H414" fill="none" stroke="#8A5A00" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#m8A5A00)"/><circle cx="430" cy="244" r="13" fill="#FFFFFF" stroke="#155E3B" stroke-width="1.6"/><text x="430" y="248" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#155E3B" text-anchor="middle">p2</text><path d="M444 244H514" fill="none" stroke="#8A5A00" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#m8A5A00)"/><circle cx="530" cy="244" r="13" fill="#FFFFFF" stroke="#155E3B" stroke-width="1.6"/><text x="530" y="248" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#155E3B" text-anchor="middle">p3</text><path d="M544 244H614" fill="none" stroke="#8A5A00" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#m8A5A00)"/><circle cx="630" cy="244" r="13" fill="#FFFFFF" stroke="#155E3B" stroke-width="1.6"/><text x="630" y="248" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#155E3B" text-anchor="middle">exit</text><path d="M260 244H314" fill="none" stroke="#8A5A00" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#m8A5A00)"/><text x="480" y="282" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#8A5A00" text-anchor="middle">signed hop proofs: liveness, latency, egress-IP hash</text><rect x="680" y="196" width="190" height="112" rx="12" fill="#E7F0EA" stroke="#155E3B" stroke-width="1.5"/><text x="694" y="219" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#155E3B" text-anchor="start">Yuma Consensus</text><text x="694" y="240" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">weights (commit-reveal)</text><text x="694" y="257" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">→ stake-weighted</text><text x="694" y="274" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">median + clipping</text><text x="694" y="291" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">→ α emission</text><path d="M646 244H676" fill="none" stroke="#155E3B" stroke-width="1.8" marker-end="url(#m155E3B)"/></svg>
