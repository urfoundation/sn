<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Three contracts: the reserve sink and settlement vault are immutable; only the coordinator is UUPS-upgradeable by its owner, a 2-of-3 Safe on mainnet; a timelock is planned for phase 1."><title>Three contracts: the reserve sink and settlement vault are immutable; only the coordinator is UUPS-upgradeable by its owner, a 2-of-3 Safe on mainnet; a timelock is planned for phase 1.</title><defs><marker id="m8A8A8A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A8A8A"/></marker></defs><rect width="900" height="300" rx="16" fill="#F8F7F5"/><text x="30" y="32" font-family="'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#5F5F5F" text-anchor="start">CUSTODY AND TRUST MODEL</text><text x="30" y="60" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#0D0D0D" text-anchor="start">Custody: three contracts, only one upgradeable</text><rect x="30" y="84" width="268" height="112" rx="12" fill="#FBE9EA" stroke="#C93A3F" stroke-width="1.5"/><text x="44" y="107" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#C93A3F" text-anchor="start">STReserveSink</text><text x="44" y="128" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">holds every deposit</text><text x="44" y="145" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">no outbound transfer</text><text x="44" y="162" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">staked on reserve hotkey</text><rect x="203.0" y="90" width="81.0" height="21" rx="10.5" fill="#F4F4F2" stroke="#5F5F5F" stroke-width="1"/><text x="243.5" y="105" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#5F5F5F" text-anchor="middle">immutable</text><rect x="314" y="84" width="268" height="112" rx="12" fill="#E7F0EA" stroke="#155E3B" stroke-width="1.5"/><text x="328" y="107" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#155E3B" text-anchor="start">STSettlementVault</text><text x="328" y="128" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">owns pool UIDs + escrow</text><text x="328" y="145" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">captures pool emission</text><text x="328" y="162" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">claims cannot be paused</text><rect x="487.0" y="90" width="81.0" height="21" rx="10.5" fill="#F4F4F2" stroke="#5F5F5F" stroke-width="1"/><text x="527.5" y="105" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#5F5F5F" text-anchor="middle">immutable</text><rect x="598" y="84" width="268" height="112" rx="12" fill="#FFFFFF" stroke="#D9DDD9" stroke-width="1.4"/><text x="612" y="107" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#0D0D0D" text-anchor="start">STCoordinator</text><text x="612" y="128" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">admits NOs (owner only)</text><text x="612" y="145" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">policy + deposit checks</text><text x="612" y="162" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F5F5F" text-anchor="start">guardian can pause new risk</text><rect x="722.0" y="90" width="130.0" height="21" rx="10.5" fill="#F4F4F2" stroke="#0D0D0D" stroke-width="1"/><text x="787.0" y="105" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0D0D0D" text-anchor="middle">UUPS upgradeable</text><rect x="598" y="222" width="272" height="56" rx="12" fill="#FFFFFF" stroke="#D9DDD9" stroke-width="1.4"/><text x="612" y="244" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#0D0D0D" text-anchor="start">owner: 2-of-3 Safe (mainnet)</text><text x="612" y="263" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#5F5F5F" text-anchor="start">timelock ≥ 1 epoch: planned, phase 1</text><path d="M734 222V200" fill="none" stroke="#8A8A8A" stroke-width="1.8" marker-end="url(#m8A8A8A)"/><text x="30" y="244" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#0D0D0D" text-anchor="start">Finalized claims are paid by direct pull to the provider's coldkey.</text><text x="30" y="264" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#0D0D0D" text-anchor="start">No owner, NO or upgrade can move another party's α.</text></svg>
