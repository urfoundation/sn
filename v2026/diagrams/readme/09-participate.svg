<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 344" width="900" height="344" role="img" aria-label="Network operators are admitted by the owner, run servers and commit payout roots. Providers register a client_id and claim from their NO's pool or graduate as a fleet. Validators register, stake and set weights every tempo."><title>Network operators are admitted by the owner, run servers and commit payout roots. Providers register a client_id and claim from their NO's pool or graduate as a fleet. Validators register, stake and set weights every tempo.</title><defs></defs><rect width="900" height="344" rx="16" fill="#F8F7F5"/><text x="30" y="32" font-family="'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#5F5F5F" text-anchor="start">PARTICIPATE</text><text x="30" y="60" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#0D0D0D" text-anchor="start">Three ways to take part</text><rect x="30" y="84" width="268" height="164" rx="12" fill="#FFFFFF" stroke="#D9DDD9" stroke-width="1.4"/><text x="44" y="107" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#0D0D0D" text-anchor="start">Network operator</text><text x="46" y="134" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0D0D0D" text-anchor="start">1  owner admits the NO;</text><text x="46" y="156" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0D0D0D" text-anchor="start">   vault registers its pool UID</text><text x="46" y="178" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0D0D0D" text-anchor="start">2  run servers + /verify</text><text x="46" y="200" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0D0D0D" text-anchor="start">3  deposit each epoch (if priced)</text><text x="46" y="222" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0D0D0D" text-anchor="start">4  commit the payout root ≤ 4 h</text><rect x="314" y="84" width="268" height="164" rx="12" fill="#E7F0EA" stroke="#155E3B" stroke-width="1.5"/><text x="328" y="107" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#155E3B" text-anchor="start">Provider</text><text x="330" y="134" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0D0D0D" text-anchor="start">1  register a client_id</text><text x="330" y="156" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0D0D0D" text-anchor="start">2  carry traffic for an NO</text><text x="330" y="178" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0D0D0D" text-anchor="start">3  provider claim each epoch</text><text x="330" y="200" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0D0D0D" text-anchor="start">   or, as a fleet:</text><text x="330" y="222" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0D0D0D" text-anchor="start">   fleet register · publish · bind</text><rect x="598" y="84" width="268" height="164" rx="12" fill="#FBF1DC" stroke="#8A5A00" stroke-width="1.5"/><text x="612" y="107" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#8A5A00" text-anchor="start">Validator</text><text x="614" y="134" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0D0D0D" text-anchor="start">1  validator init / register</text><text x="614" y="156" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0D0D0D" text-anchor="start">2  validator stake add</text><text x="614" y="178" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0D0D0D" text-anchor="start">3  run /verify trails</text><text x="614" y="200" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0D0D0D" text-anchor="start">4  commit-reveal weights</text><text x="614" y="222" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0D0D0D" text-anchor="start">   every tempo → dividends</text><rect x="30" y="264" width="840" height="58" rx="10" fill="#F4F4F2" stroke="none" stroke-width="0"/><text x="46" y="287" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5F5F5F" text-anchor="start">Validators are permissionless, but at launch the owner is the stake-majority validator:</text><text x="46" y="305" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5F5F5F" text-anchor="start">the reserve is staked on its hotkey (WHITEPAPER.md §7.4, §9.2).</text></svg>
