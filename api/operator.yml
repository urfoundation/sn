openapi: "3.1.0"
info:
  version: 2026.11.12
  title: URnetwork Operator API
  summary: The network operator's public SN25 routes, starting with capture the flag.
  description: |
    The public routes a network operator's server serves for SN25 (Bittensor
    subnet 25) that this document describes: the state of the capture the
    flag (CTF) pool under `/sn/ctf`, and the settlement v2 ledger account
    route that the apps claim from. The same server process serves the
    URnetwork API of connect/api/bringyour.yml. More `/sn` routes may move
    into this document later. The document itself is served at
    `GET /sn/openapi.yml`, and every other route here links to it.

    ## Capture the flag

    Capture the flag pays for presence in each of the 249 ISO 3166-1
    countries. Every epoch (one week, 50,400 blocks), each country has five
    provider slots and five extender slots, ten in all and 2,490 across the
    countries. A slot is worth the CTF pool's fresh funding for the epoch
    divided by 2,490, rounded down to the rao; the remainder adds one rao to
    each of the first slots in slot order (country code, then providers
    before extenders, then rank).

    - **Eligibility**. A provider or extender of the operator is a candidate
      in a country when it is online, passing the operator's checks and in
      that country for at least half of the epoch, and active at its end.
    - **Units**. Candidates are grouped by their egress IPv4 /29 or IPv6 /48,
      keyed. A unit is one ticket in its country's draw for a role, whatever
      its size.
    - **The draw**. Right after an epoch ends the operator commits the
      census of candidates on chain. A drand quicknet round published at
      least 60 seconds after the commitment seeds the draw of up to five
      winning units per country and role, so nobody can steer it.
    - **Pots**. A slot nobody wins adds its amount to its country's pot for
      that role. Each winner takes its own slot and a fifth of the pot
      carried into its country and role, and the rest keeps carrying.
    - **Payment**. Winners are paid to the payout coldkey their provider pool
      account already uses, through the CTF pool's settlement v2 ledger, and
      claimed like any pool account (`GET /sn/ledger/account`).

    Vocabulary:

    - **Last epoch** is the latest epoch with a committed CTF root, whose
      root may still be pending. Its draw is the basis of the per-country
      draw figures: slots won, units, near misses and the chance to win.
    - **This epoch** is the one in progress. For the few hours after an
      epoch ends, until its root is committed, `pending_draw` reports its
      census and drand round, and last epoch is the one before it.
    - **Pots** are carried out of last epoch into **the next draw**: this
      epoch's, or the pending one while `pending_draw` is set.
    - A role is **not fully captured** where at least one of its five slots
      went unclaimed at last epoch's draw, so a newcomer who meets the
      presence rule wins by default. Without a draw last epoch (before the
      first root, or when no census was committed in time) there is no such
      basis, and the draw figures are null rather than zero.
    - A country's **flag is held** where all ten of its slots were won at
      last epoch's draw.

    ## Conventions

    - **Amounts** are `Amount` objects: `alpha`, the exact amount in alpha as
      a decimal string with nine fractional digits and no grouping or
      exponent, and `rao`, the same amount as an integer (1 alpha is 10^9
      rao). Every CTF amount stays far below 2^53 rao, so JavaScript reads
      `rao` exactly. The `unit` object of each answer names the token. The
      ledger route keeps the decimal strings of rao its clients already
      parse.
    - **Times** are RFC 3339 in UTC with a `Z`. `as_of` is when the answer's
      data last changed: the server rebuilds it when an epoch starts, when a
      census or a root is committed, and when a root is finalized. Between
      those events the body, its `ETag` and `as_of` stay the same, and
      `Last-Modified` carries `as_of` as an HTTP date. A census commitment
      shows in `pending_draw`. The one exception is `GET /sn/ctf/client`,
      whose wins' `claimed` follows the chain's claims, so its body and
      `ETag` also change when an account is claimed. Times of future
      blocks are estimates at 12 seconds per block.
    - **Countries** are lowercase ISO 3166-1 alpha-2 codes (`is`), the 249
      codes of the standard. Kosovo (`xk`) is not one. Names are English and
      come from the API, so a client keeps no second country list.
    - **Slots** are counted as `total`, `won` and `open`, per role and in
      sum.
    - **Chance to win** is a fraction from 0 to 1, the draw's exact odds for
      a newcomer: `min(1, 5 / entries)`, where `entries` are last epoch's
      eligible units in the role plus the newcomer. It is 1 at five entries
      or fewer, and null without a draw last epoch. Each answer that carries
      it also carries its `definitions`.
    - **Errors** are RFC 9457 problem details (`application/problem+json`),
      with a `code` member for programs. Errors the load balancer produces
      itself are not: a 429 for the per-address rate limit, and a 502 or
      504 when the api cannot be reached.
    - **CORS**. Every answer from the api carries exactly one
      `Access-Control-Allow-Origin`: `*`, or the request's own origin when it
      is one of the operator's own sites, which the load balancer answers
      for. So a page on any origin can read the public answers with a plain
      GET. `GET /sn/ctf/client` takes an `Authorization` header, whose
      preflight only the operator's own sites pass. The load balancer's own
      errors carry the header only for those sites.
    - **Link**. Every 200 answer except the document itself carries
      `Link: </sn/openapi.yml>; rel="service-desc"; type="application/yaml"`.
    - **Caching**. Each route states its `Cache-Control`. The cacheable JSON
      answers carry a strong `ETag` of the exact body and `Last-Modified`,
      and the document carries an `ETag`. A request whose `If-None-Match`
      names the current tag is answered 304 without a body.
      `If-Modified-Since` is not used: revalidate with the tag.
    - **Compatibility**. Fields and enum values are only ever added, never
      removed or repurposed. Clients ignore fields they do not know, and
      treat an enum value they do not know as the nearest general case the
      field's description names.
  contact:
    name: URnetwork
    email: support@ur.xyz
    url: https://ur.io
  license:
    name: Mozilla Public License, v. 2.0
    url: https://mozilla.org/MPL/2.0/
servers:
  - url: https://api.bringyour.com

tags:
  - name: Capture the flag
    description: The capture the flag pool's public state, draws and awards, and a client's own status.
  - name: Ledger
    description: Settlement v2 ledger accounts and their claim proofs, for every pool of the operator.
  - name: Service description
    description: This document.

paths:
  /sn/ctf:
    get:
      operationId: snCtf
      tags: [Capture the flag]
      security: []
      summary: The current state of capture the flag in every country
      description: |
        The pool's facts, this epoch and its estimated draw time, last
        epoch's amounts and slot counts, the counts the ur.xyz `/ctf` page
        filters on, and one row per country of the 249, in code order. A row
        gives, per role, the slots won last epoch, the units in last epoch's
        draw, the pot carried into the next draw, a newcomer's estimated take
        and chance to win, and the near misses; and for the country, the
        estimate of what its next draw holds and the epochs since it last had
        a winner.

        Without a draw last epoch the draw figures are null: every role's
        slots, units, near misses, entries and chance to win, and the
        not-fully-captured counts. Before the pool's first root `last_epoch`
        is null too, the pots are empty and the estimates null. While an
        ended epoch's root is pending, `pending_draw` names its census and
        drand round.

        `Cache-Control: public, max-age=60`. The page refreshes it every five
        minutes and shows "unavailable", never zeros, when it cannot be read.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The current state.
          headers:
            Access-Control-Allow-Origin: {$ref: "#/components/headers/AccessControlAllowOrigin"}
            Cache-Control: {$ref: "#/components/headers/CacheControlPublic60"}
            ETag: {$ref: "#/components/headers/ETag"}
            Last-Modified: {$ref: "#/components/headers/LastModified"}
            Link: {$ref: "#/components/headers/Link"}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CtfState"
              examples:
                epoch10:
                  $ref: "#/components/examples/CtfState"
                firstDrawPending:
                  $ref: "#/components/examples/CtfStateFirstDrawPending"
        "304":
          $ref: "#/components/responses/NotModified"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"

  /sn/ctf/here:
    get:
      operationId: snCtfHere
      tags: [Capture the flag]
      security: []
      summary: The visitor's country, from its address
      description: |
        The caller's country from GeoLite2 on the request's address, so the
        page can open on the visitor's own country. It is null when the
        address has no country there, or a country that is not one of the
        249 codes (Kosovo, `xk`). Nothing about the request is stored or
        logged.

        `Cache-Control: private, no-store`, so neither a shared cache nor the
        browser keeps it; it has no `ETag`.
      responses:
        "200":
          description: The caller's country, or null.
          headers:
            Access-Control-Allow-Origin: {$ref: "#/components/headers/AccessControlAllowOrigin"}
            Cache-Control: {$ref: "#/components/headers/CacheControlPrivateNoStore"}
            Link: {$ref: "#/components/headers/Link"}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CtfHere"
              examples:
                iceland:
                  summary: An address in Iceland
                  value:
                    country: is
                unknown:
                  summary: An address with no country, or one outside the 249 codes
                  value:
                    country: null
        "429":
          $ref: "#/components/responses/RateLimited"

  /sn/ctf/country/{cc}:
    get:
      operationId: snCtfCountry
      tags: [Capture the flag]
      security: []
      summary: One country's state and its history since the pool's first epoch
      description: |
        The country's row of `GET /sn/ctf`, with the same pool, epoch and
        definitions context, and its history: for each epoch from the
        pool's first, newest first, per role, the units in the draw, the
        slots won, the pot carried in and out, what was awarded, the median
        award and the share of entries that won. The ur.xyz country page
        `/ctf/{cc}` is built from it, with `GET /sn/ctf` for the country
        picker and the other big pots.

        `Cache-Control: public, max-age=60`.
      parameters:
        - $ref: "#/components/parameters/CountryCode"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The country's state and history.
          headers:
            Access-Control-Allow-Origin: {$ref: "#/components/headers/AccessControlAllowOrigin"}
            Cache-Control: {$ref: "#/components/headers/CacheControlPublic60"}
            ETag: {$ref: "#/components/headers/ETag"}
            Last-Modified: {$ref: "#/components/headers/LastModified"}
            Link: {$ref: "#/components/headers/Link"}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CtfCountryResult"
              examples:
                iceland:
                  $ref: "#/components/examples/CtfCountryResult"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/UnknownCountry"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"

  /sn/ctf/top:
    get:
      operationId: snCtfTop
      tags: [Capture the flag]
      security: []
      summary: The largest open pots
      description: |
        The countries where a role was not fully captured at last epoch's
        draw, so a newcomer who meets the presence rule wins by default,
        largest pot first, then by code.

        - `role=provider` or `role=extender` lists the countries where that
          role was not fully captured, ranked by its pot.
        - `role=any`, the default, lists the countries where either role was
          not fully captured, ranked by the provider and extender pots
          together, as the page's "not fully captured" views do. Five winners
          empty a role's pot, so that is the open roles' pots.

        The seven territories without a permanent population (`aq`, `bv`,
        `gs`, `hm`, `io`, `tf`, `um`) are left out unless
        `include_uninhabited=true`: their pots grow every epoch and are
        unlikely ever to be won. Without a draw last epoch the list is
        empty.

        `Cache-Control: public, max-age=60`.
      parameters:
        - $ref: "#/components/parameters/Role"
        - $ref: "#/components/parameters/TopLimit"
        - $ref: "#/components/parameters/IncludeUninhabited"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The countries, largest pot first.
          headers:
            Access-Control-Allow-Origin: {$ref: "#/components/headers/AccessControlAllowOrigin"}
            Cache-Control: {$ref: "#/components/headers/CacheControlPublic60"}
            ETag: {$ref: "#/components/headers/ETag"}
            Last-Modified: {$ref: "#/components/headers/LastModified"}
            Link: {$ref: "#/components/headers/Link"}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CtfTopResult"
              examples:
                providers:
                  $ref: "#/components/examples/CtfTopResult"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"

  /sn/ctf/epoch/{epoch}:
    get:
      operationId: snCtfEpoch
      tags: [Capture the flag]
      security: []
      summary: One closed epoch's census, draw, amounts, awards and pots
      description: |
        Everything needed to check one epoch's draw and its arithmetic: the
        census commitment (its hash and block, the candidate and unit counts
        and the exclusion counts), the drand round and the seed it gave, the
        epoch's amounts, every country's units, winners and pots in and
        out, every award with its winner's coldkey, the pending awards still
        owed after the epoch, and the root that covers it. The ledger objects
        behind these figures are named in `objects` and served by
        `GET /sn/ledger/object`, which checks each against its hash.

        An epoch is served once a committed root covers it. Its census and
        draw are fixed by then, and its awards are final once the root is
        finalized. An epoch with no committed census has no draw: null
        `census` and `draw`, no awards, and every slot carried.

        `Cache-Control: public, max-age=31536000, immutable` once the root is
        finalized, and `public, max-age=60` while it is pending: a pending
        root can still be replaced by a later one, and after an auditor
        refuses one, the operator can rebuild the epoch's awards (its census
        and drand round stay fixed).
      parameters:
        - $ref: "#/components/parameters/Epoch"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The epoch.
          headers:
            Access-Control-Allow-Origin: {$ref: "#/components/headers/AccessControlAllowOrigin"}
            Cache-Control: {$ref: "#/components/headers/CacheControlEpoch"}
            ETag: {$ref: "#/components/headers/ETag"}
            Last-Modified: {$ref: "#/components/headers/LastModified"}
            Link: {$ref: "#/components/headers/Link"}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CtfEpochResult"
              examples:
                epoch9:
                  $ref: "#/components/examples/CtfEpochResult"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/UnknownEpoch"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"

  /sn/ctf/client:
    get:
      operationId: snCtfClient
      tags: [Capture the flag]
      security:
        - BearerAuth: []
      summary: The caller's own capture the flag wins and status, a client's or its network's
      description: |
        The wins of the client or the network the bearer token names, each
        with whether it is claimed, so that an app can say "you won a slot"
        for every win not claimed yet; and, for a client, its status in each
        of its recent epochs.

        **Whom it answers for.** A client JWT (`by_client_jwt` from
        `POST /network/auth-client`, as the URnetwork apps hold it) is
        answered for its own client: its `client_id`; in `epochs`, per role,
        whether it was a candidate and, if not, the first rule that excluded
        it, its country and unit family, its presence against the half-epoch
        rule, and whether it won, with its rank, its slot amount, its share
        of the pot and the coldkey paid; and its `wins`. The network's own
        credential, its JWT (as ur.io holds it) or an API key, is answered
        for the network: `wins` holds the wins of every client the network
        has had, removed ones included, each naming its `client_id`, while
        `client_id` is null and `epochs` is `[]`. Each win keeps the network
        it was won for, recorded with the award, so a client's wins stay its
        network's after the client is removed and its records are deleted.
        A token of either kind that authenticates is never answered 401.

        **Which wins.** Every win of those clients that is not known to be
        claimed (`claimed` false or null), whatever its epoch, and every win
        of the `limit` most recent epochs that a committed root covers (the
        epochs `epochs` lists for a client), claimed or not. Newest first: by
        epoch descending, then providers before extenders, then country, then
        rank. An app shows the wins with `claimed: false` as won and not
        claimed yet.

        **Claimed.** vault2's claims are cumulative: a claim pays an account
        up to its cumulative in a finalized root and records that cumulative
        as the account's `claimed`, so `claimed` is always the cumulative of
        the root of the account's latest claim.

        - A win's paying epoch is its own epoch, or, when its pot share was a
          pending award (`pending`), the first epoch after it that matured,
          which pays every pending award.
        - Its paying root is the committed root that covers the paying epoch:
          the first pending or finalized CTF root whose epoch is at or after
          it.
        - A win is claimed when its paying root is finalized and vault2's
          `claimed` for the CTF account of the win's coldkey, read at the
          finalized head as `GET /sn/ledger/account` reads it, is at least
          that account's cumulative in the paying root: the account's latest
          claim used that root or a later one. An account claimed exactly
          through the paying root has claimed the win.
        - Otherwise it is not: while its paying root is pending, while its
          pending pot share waits for a matured epoch that a committed root
          covers, and while the account is claimed only through an earlier
          root. A root that covers several epochs is claimed as a whole.
        - Every coldkey's state is read, those of the newest wins first. An
          answer reads vault2's `claimed` of all its accounts at one finalized
          block, and a value read is used again for up to 25 seconds.
        - `claimed` is null when the account's state could not be read in the
          five seconds or so an answer gives it, its ledger or vault2 being
          unreadable or slow, and when the state disagrees with itself or
          with the win: vault2's `claimed` above the finalized cumulative, the
          server's records not adding up, or the account's cumulative in the
          paying root below the win's own `amount`, which that root pays
          whole. (A win whose pending pot share a shortfall cut before it was
          paid, which needs every pot empty, can read null too.) A claim state
          that cannot be read never fails the answer. A client shows such a
          win neither as claimed nor as not. A win whose paying root is
          pending, or which has none yet, is never null.

        `Cache-Control: private, no-cache`: the app may keep it, revalidating
        with its `ETag`. `claimed` is read from the chain, each account's at
        most every 25 seconds, so the answer and its `ETag` also change when
        an account is claimed, within 25 seconds of the claim's finalized
        block, while `as_of` stays the time of the capture the flag state.
      parameters:
        - $ref: "#/components/parameters/ClientLimit"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The client's status per epoch.
          headers:
            Access-Control-Allow-Origin: {$ref: "#/components/headers/AccessControlAllowOrigin"}
            Cache-Control: {$ref: "#/components/headers/CacheControlPrivateNoCache"}
            ETag: {$ref: "#/components/headers/ETag"}
            Last-Modified: {$ref: "#/components/headers/LastModified"}
            Link: {$ref: "#/components/headers/Link"}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CtfClientResult"
              examples:
                provider:
                  $ref: "#/components/examples/CtfClientResult"
                network:
                  $ref: "#/components/examples/CtfClientResultNetwork"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"

  /sn/ledger/account:
    get:
      operationId: snLedgerAccount
      tags: [Ledger]
      security: []
      summary: A coldkey's settlement v2 accounts in every pool, with their claim proofs
      description: |
        The coldkey's settlement v2 account in each pool that holds it, one
        entry per pool in ascending `no_id`, with what a claim needs: the
        latest finalized root's cumulative, its bottom-up proof, and vault2's
        `claimed`, read at the finalized block tag. The pools are the
        operator's own, its pool (`no_id` n) and, while capture the flag is
        on at this server, its capture the flag pool (`no_id` 2^32 + n,
        4294967297 for operator 1), when the latest finalized root or the
        pending root holds the coldkey, and any other pool where this server
        has recorded an account for the coldkey. While capture the flag is
        off, no capture the flag pool is read or answered, not even one with
        a recorded account, so none can fail an answer. Amounts are decimal
        strings of rao. A CTF account is claimed from vault2 like any pool's.

        Each entry names its pool's `kind` and a display `label`. Entries
        carry every field they carried before, so a client that predates
        `kind` shows a CTF account as "Pool 4294967297" and claims it like
        any pool.

        An account only in the pending root has a null `root_index` and
        `proof`, and a `cumulative` and `claimed` of "0". A coldkey that no
        root holds, like every coldkey while settlement v2 is not configured,
        has `"accounts": []`.

        **Whole or partial**. With `partial=true` a pool whose ledger cannot
        be read (its objects cannot be read or do not rebuild its committed
        root, its roots or accounts cannot be read from the server's
        database, vault2's `claimed` cannot be read or is above the finalized
        cumulative, or a recorded account is not at its index) is left out of
        `accounts` and named in `unavailable_pools`, and the other pools are
        answered. A client shows such a pool as unavailable, never as zero.
        Even then the answer is a 502 when the server cannot tell which pools
        to answer, because its record of the coldkey's accounts cannot be
        read.

        Without `partial=true`, as every client that predates
        `unavailable_pools` asks, no pool is named unavailable: the list is
        always `[]`. A CTF pool whose ledger cannot be read is left out of
        `accounts`, and the other pools are answered exactly as before the
        CTF pool existed: such a client keeps the operator's pool's balance,
        and its CTF balance is missing until that pool can be read again. A
        fault in any other pool's ledger, the operator's pool's above all,
        still fails the whole answer with a 502, as before, so such a client
        never takes a partial list of those pools for a whole one. A client
        that knows `unavailable_pools` sends `partial=true`, so that it shows
        a CTF pool it cannot read as unavailable rather than leaving it out.

        Public: a proof only reveals published data, and a claim always pays
        the leaf's coldkey. `Cache-Control: no-store`.

        connect/api/bringyour.yml lists this operation too, for the
        generated clients and the API reference, and describes the same
        fields: every field it gives the answer is here, with the same type.
      parameters:
        - $ref: "#/components/parameters/Coldkey"
        - $ref: "#/components/parameters/Partial"
      responses:
        "200":
          description: The coldkey's accounts.
          headers:
            Access-Control-Allow-Origin: {$ref: "#/components/headers/AccessControlAllowOrigin"}
            Cache-Control: {$ref: "#/components/headers/CacheControlNoStore"}
            Link: {$ref: "#/components/headers/Link"}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnLedgerAccountResult"
              examples:
                whole:
                  $ref: "#/components/examples/SnLedgerAccountResultWhole"
                partial:
                  $ref: "#/components/examples/SnLedgerAccountResultPartial"
                without_partial:
                  $ref: "#/components/examples/SnLedgerAccountResultWithoutPartial"
                none:
                  summary: A coldkey that no root holds
                  value:
                    coldkey: "0xf08f1f0f942a5a04608e09b82d93a481366853421cef48d0ae53d0076c34c45b"
                    accounts: []
                    unavailable_pools: []
        "400":
          $ref: "#/components/responses/BadColdkey"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/LedgerUnavailable"

  /sn/openapi.yml:
    get:
      operationId: snOpenApi
      tags: [Service description]
      security: []
      summary: This document
      description: |
        This OpenAPI document, byte for byte as the serving release was built
        with it (sn/api/operator.yml), so it always describes the routes the
        server serves. Every other route here links to it with
        `Link: </sn/openapi.yml>; rel="service-desc"`.

        `Cache-Control: public, max-age=3600`.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The document, as YAML.
          headers:
            Access-Control-Allow-Origin: {$ref: "#/components/headers/AccessControlAllowOrigin"}
            Cache-Control: {$ref: "#/components/headers/CacheControlDocument"}
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/yaml:
              schema:
                type: string
              examples:
                document:
                  summary: The start of the document
                  value: |
                    openapi: "3.1.0"
                    info:
                      version: 2026.11.12
                      title: URnetwork Operator API
        "304":
          $ref: "#/components/responses/NotModified"
        "429":
          $ref: "#/components/responses/RateLimited"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer` and a URnetwork token: a client JWT
        (`by_client_jwt` from `POST /network/auth-client`), as the URnetwork
        apps send it, or the network's own credential, its JWT or an API key
        (`urn_…`), as ur.io sends its JWT. connect/api/bringyour.yml
        describes how to obtain them.

  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: An `ETag` from an earlier answer. When it is the current tag, the answer is 304 without a body.
      schema:
        type: string
      example: '"9f2c4e01a7d3b5c86e10f4a2d9b7c3e5"'
    CountryCode:
      name: cc
      in: path
      required: true
      description: The country's ISO 3166-1 alpha-2 code, one of the 249. Either case is accepted; answers use lowercase.
      schema:
        type: string
        pattern: "^[A-Za-z]{2}$"
      example: is
    Epoch:
      name: epoch
      in: path
      required: true
      description: The epoch, at or after the pool's first epoch (8 for operator 1).
      schema:
        type: integer
        minimum: 0
      example: 9
    Role:
      name: role
      in: query
      required: false
      description: The role whose pots rank the countries, or `any` for both together.
      schema:
        type: string
        enum: [provider, extender, any]
        default: any
      example: provider
    TopLimit:
      name: limit
      in: query
      required: false
      description: How many countries to list, at most.
      schema:
        type: integer
        minimum: 1
        maximum: 249
        default: 10
      example: 2
    IncludeUninhabited:
      name: include_uninhabited
      in: query
      required: false
      description: Also list the seven territories without a permanent population.
      schema:
        type: boolean
        default: false
      example: false
    ClientLimit:
      name: limit
      in: query
      required: false
      description: |
        How many of the most recent covered epochs to answer, at most: a
        client's `epochs`, and the epochs whose claimed wins `wins` lists as
        well as the others.
      schema:
        type: integer
        minimum: 1
        maximum: 52
        default: 8
      example: 8
    Coldkey:
      name: coldkey
      in: query
      required: true
      description: |
        The coldkey: an ss58 address with the Bittensor prefix (42) and a
        valid checksum, or `0x` and 64 hex digits in either case.
      schema:
        type: string
      example: 5HW7s9UfaeoXgURs6sFo3EcKXHHriPqU2yAqdw99B6BxVLmo
    Partial:
      name: partial
      in: query
      required: false
      description: |
        `true` to answer the pools that can be read and name the others in
        `unavailable_pools`. Without it a CTF pool that cannot be read is
        left out of `accounts`, unnamed, and any other pool that cannot be
        read fails the whole answer with a 502.
      schema:
        type: boolean
        default: false
      example: true

  headers:
    AccessControlAllowOrigin:
      description: |
        Exactly one value: `*`, or the request's own origin when it is one of
        the operator's own sites, which the load balancer answers for. Either
        lets a page on that origin read the answer.
      schema:
        type: string
      example: "*"
    CacheControlPublic60:
      description: Any cache may keep the answer for a minute.
      schema:
        type: string
        const: "public, max-age=60"
    CacheControlEpoch:
      description: Immutable once the epoch's root is finalized; a minute while it is pending.
      schema:
        type: string
        enum: ["public, max-age=31536000, immutable", "public, max-age=60"]
    CacheControlPrivateNoStore:
      description: Not kept by any cache.
      schema:
        type: string
        const: "private, no-store"
    CacheControlPrivateNoCache:
      description: Kept only by the caller, which revalidates it with its `ETag` before every reuse.
      schema:
        type: string
        const: "private, no-cache"
    CacheControlNoStore:
      description: Not kept by any cache.
      schema:
        type: string
        const: "no-store"
    CacheControlDocument:
      description: Any cache may keep the document for an hour.
      schema:
        type: string
        const: "public, max-age=3600"
    ETag:
      description: A strong entity tag of the exact body. It changes exactly when the body does.
      schema:
        type: string
        pattern: '^"[^"]+"$'
      example: '"9f2c4e01a7d3b5c86e10f4a2d9b7c3e5"'
    LastModified:
      description: The answer's `as_of`, as an HTTP date.
      schema:
        type: string
      example: "Fri, 11 Dec 2026 22:24:12 GMT"
    Link:
      description: This document, the service description of every route here.
      schema:
        type: string
        const: '</sn/openapi.yml>; rel="service-desc"; type="application/yaml"'

  responses:
    RateLimited:
      description: |
        Too many requests from the caller's address: the load balancer's
        per-address rate limit, before the api sees the request. The body is
        the load balancer's own page, not a problem document. Retry after a
        pause.
      headers:
        Access-Control-Allow-Origin:
          description: Only for the operator's own sites, whose origin the load balancer echoes.
          schema:
            type: string
      content:
        text/html:
          schema:
            type: string
          examples:
            page:
              summary: The load balancer's page
              value: "<html><head><title>429 Too Many Requests</title></head><body><center><h1>429 Too Many Requests</h1></center></body></html>"
    NotModified:
      description: The `If-None-Match` names the current tag. No body; the headers are those of the 200 answer.
      headers:
        Access-Control-Allow-Origin: {$ref: "#/components/headers/AccessControlAllowOrigin"}
        ETag: {$ref: "#/components/headers/ETag"}
    BadRequest:
      description: A parameter is missing or malformed.
      headers:
        Access-Control-Allow-Origin: {$ref: "#/components/headers/AccessControlAllowOrigin"}
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            badLimit:
              summary: A limit out of range
              value:
                type: about:blank
                title: Bad Request
                status: 400
                code: bad_request
                detail: limit must be an integer from 1 to 249.
    BadColdkey:
      description: The coldkey is missing, or is neither an ss58 address with the Bittensor prefix nor `0x` and 64 hex digits.
      headers:
        Access-Control-Allow-Origin: {$ref: "#/components/headers/AccessControlAllowOrigin"}
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            badColdkey:
              summary: A coldkey that does not parse
              value:
                type: about:blank
                title: Bad Request
                status: 400
                code: bad_request
                detail: coldkey is not an ss58 address or 0x and 64 hex digits
    Unauthorized:
      description: The bearer token is missing, or it does not authenticate (malformed, expired or revoked).
      headers:
        Access-Control-Allow-Origin: {$ref: "#/components/headers/AccessControlAllowOrigin"}
        WWW-Authenticate:
          description: The scheme the route takes.
          schema:
            type: string
            pattern: "^Bearer( |$)"
          example: Bearer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            noToken:
              summary: No bearer token
              value:
                type: about:blank
                title: Unauthorized
                status: 401
                code: unauthorized
                detail: Send a client's or a network's bearer token.
    UnknownCountry:
      description: The code is not one of the 249 ISO 3166-1 alpha-2 codes.
      headers:
        Access-Control-Allow-Origin: {$ref: "#/components/headers/AccessControlAllowOrigin"}
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            kosovo:
              summary: Kosovo, which has no ISO 3166-1 code
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: unknown_country
                detail: xk is not one of the 249 ISO 3166-1 alpha-2 codes.
    UnknownEpoch:
      description: The epoch is before the pool's first epoch, or no committed root covers it yet.
      headers:
        Access-Control-Allow-Origin: {$ref: "#/components/headers/AccessControlAllowOrigin"}
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            notYet:
              summary: An epoch still in progress
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: unknown_epoch
                detail: No committed root covers epoch 10 yet.
    Unavailable:
      description: The capture the flag state cannot be read now, or capture the flag is not configured on this server. Show it as unavailable, never as zero.
      headers:
        Access-Control-Allow-Origin: {$ref: "#/components/headers/AccessControlAllowOrigin"}
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            unavailable:
              summary: The state cannot be read
              value:
                type: about:blank
                title: Service Unavailable
                status: 503
                code: unavailable
                detail: The capture the flag state is unavailable. Try again shortly.
    LedgerUnavailable:
      description: |
        The ledger is unavailable, so nothing is answered. Without
        `partial=true`: the server's record of the coldkey's accounts cannot
        be read, or the ledger of a pool other than a CTF pool cannot be
        read: its objects cannot be read or do not rebuild its committed
        root, its roots or accounts cannot be read from the server's
        database, there is no chain client or vault2's `claimed` cannot be
        read, `claimed` is above the finalized cumulative, or an account the
        server recorded is not at its index in the finalized root. A CTF pool
        that cannot be read is left out of the answer instead. With
        `partial=true`: the server's record of the coldkey's accounts cannot
        be read, so it cannot tell which pools to answer.
      headers:
        Access-Control-Allow-Origin: {$ref: "#/components/headers/AccessControlAllowOrigin"}
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            unavailable:
              summary: The ledger cannot be read
              value:
                type: about:blank
                title: Bad Gateway
                status: 502
                code: ledger_unavailable
                detail: Ledger account unavailable.

