  schemas:
    Problem:
      type: object
      description: An RFC 9457 problem details object.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: "`about:blank`: the status and `code` say what went wrong."
          examples: [about:blank]
        title:
          type: string
          description: The HTTP status phrase.
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          description: |
            For programs. A code a client does not know reads as the status
            alone.
          enum: [bad_request, unauthorized, unknown_country, unknown_epoch, unavailable, ledger_unavailable]
        detail:
          type: string
          description: A sentence for people, never for parsing.

    Unit:
      type: object
      description: The unit of every amount of the answer.
      required: [token, symbol, netuid, decimals]
      properties:
        token:
          type: string
          const: alpha
          description: Alpha, the token of the subnet.
        symbol:
          type: string
          const: α
        netuid:
          type: integer
          const: 25
          description: The Bittensor subnet.
        decimals:
          type: integer
          const: 9
          description: 1 alpha is 10^9 rao.

    Amount:
      type: object
      description: An exact amount, in alpha and in rao. The two always agree exactly.
      required: [alpha, rao]
      properties:
        alpha:
          type: string
          description: The amount in alpha, a decimal string with exactly nine fractional digits, no grouping and no exponent.
          pattern: "^(0|[1-9][0-9]*)\\.[0-9]{9}$"
        rao:
          type: integer
          minimum: 0
          description: The same amount in rao. CTF amounts stay far below 2^53.

    NullableAmount:
      description: An amount, or null where none applies.
      oneOf:
        - $ref: "#/components/schemas/Amount"
        - type: "null"

    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 in UTC, to the second, with a `Z`.
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"

    CountryCode:
      type: string
      description: A lowercase ISO 3166-1 alpha-2 code, one of the 249.
      pattern: "^[a-z]{2}$"

    Sha256Ref:
      type: string
      description: |
        A ledger object reference: `sha256:` and the 64 lowercase hex digits
        of the object's sha256. `GET /sn/ledger/object?hash=` serves the
        object and checks it against the hash.
      pattern: "^sha256:[0-9a-f]{64}$"

    Address:
      type: string
      description: An EVM address, `0x` and 40 lowercase hex digits.
      pattern: "^0x[0-9a-f]{40}$"

    Bytes32:
      type: string
      description: 32 bytes, `0x` and 64 lowercase hex digits.
      pattern: "^0x[0-9a-f]{64}$"

    Coldkey:
      type: string
      description: A coldkey's public key, `0x` and 64 lowercase hex digits.
      pattern: "^0x[0-9a-f]{64}$"

    ColdkeySs58:
      type: string
      description: The same coldkey as an ss58 address with the Bittensor prefix (42).
      pattern: "^5[1-9A-HJ-NP-Za-km-z]{47}$"

    Role:
      type: string
      description: The miner role a slot, an award or a candidate is for.
      enum: [provider, extender]

    RootStatus:
      type: string
      description: |
        `pending`: committed and not yet finalized; a fault or a missed
        approval can still replace it with a later root. `finalized`: its
        accounts can be claimed.
      enum: [pending, finalized]

    CtfSlots:
      type: object
      description: Slots, as counted for last epoch's draw. `won` + `open` = `total`.
      required: [total, won, open]
      properties:
        total:
          type: integer
          minimum: 0
          description: 5 per country and role, 2,490 in all.
        won:
          type: integer
          minimum: 0
        open:
          type: integer
          minimum: 0
          description: Slots that went unclaimed; their amounts joined the pots.

    CtfPool:
      type: object
      description: The CTF pool's identity on chain.
      required: [no_id, pool_id, vault, carry_contract, carry_coldkey, first_epoch, countries_version]
      properties:
        no_id:
          type: integer
          minimum: 1
          description: The network operator's id.
        pool_id:
          type: integer
          description: The CTF pool's vault2 pool id, 2^32 + `no_id` (4294967297 for operator 1). Ledger accounts carry it as their `no_id`.
        vault:
          $ref: "#/components/schemas/Address"
        carry_contract:
          $ref: "#/components/schemas/Address"
          description: The immutable, ownerless carry contract that takes each root's pots and pending awards and moves them back onto the pool.
        carry_coldkey:
          $ref: "#/components/schemas/Coldkey"
          description: The carry contract's coldkey, the EVM mirror of its address (blake2b-256 of "evm:" and the address), which holds the carry account in the pool's ledger.
        first_epoch:
          type: integer
          description: The pool's first epoch (8 for operator 1).
        countries_version:
          $ref: "#/components/schemas/Sha256Ref"

    CtfCurrentEpoch:
      type: object
      description: This epoch, the one in progress, whose draw follows its end. While `pending_draw` is set, the pending draw comes first.
      required: [epoch, start_block, end_block, draw_at]
      properties:
        epoch:
          type: integer
        start_block:
          type: integer
        end_block:
          type: integer
          description: The epoch's last block. Presence counts through it.
        draw_at:
          $ref: "#/components/schemas/Timestamp"
          description: |
            When the epoch ends, estimated at 12 seconds per block from its
            first block; the estimate does not move during the epoch. The
            census is committed within 600 blocks (about two hours) after
            the end, and the draw uses the first drand round at least 60
            seconds after the commitment.

    CtfRoot:
      type: object
      description: |
        The CTF root that covers the epoch: the first committed root whose
        epochs include it, or the root that replaced it.
      required: [status, seq, root_index, epoch, ledger_hash, committed_block, finalized_block]
      properties:
        status:
          $ref: "#/components/schemas/RootStatus"
        seq:
          type: integer
          minimum: 1
          description: vault2's commit sequence number of the root.
        root_index:
          type: [integer, "null"]
          minimum: 0
          description: The root's index among the pool's finalized roots in vault2; null while pending.
        epoch:
          type: integer
          description: The last epoch the root covers.
        ledger_hash:
          $ref: "#/components/schemas/Sha256Ref"
          description: The root's ledger header, whose sha256 is the root's `ledgerHash` on chain.
        committed_block:
          type: integer
        finalized_block:
          type: [integer, "null"]
          description: Null while pending.

    CtfEpochAmounts:
      type: object
      description: |
        One epoch's amounts. `fresh` = `funding` − (`matured` ? `owed` :
        `returned`); `slot` = floor(`fresh` / 2490); and `carried` =
        `carried_in` + `fresh` − `paid` + `pending_in` − `pending`.
      required: [funding, returned, owed, matured, fresh, slot, awarded, paid, pending_paid, pending_in, pending, carried_in, carried]
      properties:
        funding:
          $ref: "#/components/schemas/Amount"
          description: What vault2 captured for the CTF pool for the epoch, the returned carry included.
        returned:
          $ref: "#/components/schemas/Amount"
          description: The stake the carry contract returned for the epoch.
        owed:
          $ref: "#/components/schemas/Amount"
          description: The carry still owed back before the epoch's capture.
        matured:
          type: boolean
          description: Everything owed back had returned (within 4 rao of rounding), so pot shares are paid now rather than as pending awards.
        fresh:
          $ref: "#/components/schemas/Amount"
          description: The fresh funding the epoch's slots divide. Returned carry pays obligations, never new slots.
        slot:
          $ref: "#/components/schemas/Amount"
          description: A slot's amount, floor(`fresh` / 2490). The first `fresh` mod 2490 slots in slot order take one rao more.
        awarded:
          $ref: "#/components/schemas/Amount"
          description: What the epoch's winners won, their slots and pot shares, whether paid now or pending.
        paid:
          $ref: "#/components/schemas/Amount"
          description: What the epoch's root paid winners for the epoch, the earlier pending awards it paid included.
        pending_paid:
          $ref: "#/components/schemas/Amount"
          description: The earlier pending awards paid in the epoch, in full, because it matured.
        pending_in:
          $ref: "#/components/schemas/Amount"
          description: The pending awards owed before the epoch.
        pending:
          $ref: "#/components/schemas/Amount"
          description: The pending awards still owed after the epoch.
        carried_in:
          $ref: "#/components/schemas/Amount"
          description: The pots carried into the epoch, every country and role.
        carried:
          $ref: "#/components/schemas/Amount"
          description: The pots after the epoch, which carry into the next one.

    CtfPendingDraw:
      type: object
      description: |
        An epoch that has ended and whose root is not committed yet: its
        census and drand round, as far as they have happened. Its winners
        and pots appear when its root is committed and it becomes last
        epoch. The three census and round fields are null together, until
        the census is committed.
      required: [epoch, census_hash, census_block, round]
      properties:
        epoch:
          type: integer
        census_hash:
          description: The census committed on chain; null until it is.
          oneOf:
            - $ref: "#/components/schemas/Sha256Ref"
            - type: "null"
        census_block:
          type: [integer, "null"]
          description: The block of the census commitment.
        round:
          type: [integer, "null"]
          description: The drand quicknet round that draws it, the first at least 60 seconds after the census block's timestamp.

    NullablePendingDraw:
      description: An ended epoch whose root is pending; null otherwise.
      oneOf:
        - $ref: "#/components/schemas/CtfPendingDraw"
        - type: "null"

    CtfLastEpoch:
      type: object
      description: Last epoch, the latest with a committed CTF root.
      required: [epoch, drawn, root, amounts, slots]
      properties:
        epoch:
          type: integer
        drawn:
          type: boolean
          description: A census was committed in time and the draw ran. Without one, every slot carried.
        root:
          $ref: "#/components/schemas/CtfRoot"
        amounts:
          $ref: "#/components/schemas/CtfEpochAmounts"
        slots:
          $ref: "#/components/schemas/CtfSlots"

    CtfRoleState:
      type: object
      description: |
        One role in one country: last epoch's draw, and what the next draw
        holds. The draw figures (`slots`, `units`, `near_misses`, `entries`
        and `chance_to_win`) are null together, without a draw last epoch.
      required: [slots, units, near_misses, pot, awarded, win_estimate, entries, chance_to_win]
      properties:
        slots:
          description: Last epoch's draw's slots; null without a draw last epoch.
          oneOf:
            - $ref: "#/components/schemas/CtfSlots"
            - type: "null"
        units:
          type: [integer, "null"]
          minimum: 0
          description: The eligible units in last epoch's draw, one ticket each; null without a draw last epoch.
        near_misses:
          type: [integer, "null"]
          minimum: 0
          description: |
            The miners in the country that last epoch's census left out only
            for too little presence or a change of country: they passed
            every other rule. Null without a draw last epoch.
        pot:
          $ref: "#/components/schemas/Amount"
          description: |
            The pot carried out of last epoch into the next draw. Five winners
            empty it, so a pot above zero after a draw means the role was not
            fully captured. Zero before the first root.
        awarded:
          $ref: "#/components/schemas/Amount"
          description: What last epoch's winners won, slots and pot shares; zero without a draw.
        win_estimate:
          $ref: "#/components/schemas/NullableAmount"
          description: |
            What a newcomer who wins a slot in the next draw would take: one
            slot at last epoch's slot amount plus a fifth of `pot`, rounded
            down to the rao. Null before the first root.
        entries:
          type: [integer, "null"]
          minimum: 1
          description: The entries of `chance_to_win`, `units` + 1; null without a draw last epoch.
        chance_to_win:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: |
            min(1, 5 / `entries`), the draw's exact odds for a newcomer,
            estimated from last epoch's draw. It is 1 exactly where the role
            was not fully captured, so a newcomer who meets the presence rule
            wins by default; the page shows a percentage only where all five
            slots were won. Null without a draw last epoch, when there is no
            basis for either.

    CtfCountryState:
      type: object
      description: One country's row.
      required: [code, name, sentence_name, inhabited, flag_held, open_epochs, near_misses, available, awarded, providers, extenders]
      properties:
        code:
          $ref: "#/components/schemas/CountryCode"
        name:
          type: string
          description: The English name, the ISO 3166-1 common name where it has one.
        sentence_name:
          type: string
          description: |
            The name as an English sentence uses it, with "the" where the
            name takes one: "Iceland", "the United States", "the DR Congo".
            Strip a leading "the " for a heading or a breadcrumb.
        inhabited:
          type: boolean
          description: |
            False for the seven territories without a permanent population
            (`aq`, `bv`, `gs`, `hm`, `io`, `tf`, `um`). They keep their slots
            and pots.
        flag_held:
          type: boolean
          description: All ten slots were won at last epoch's draw; false without one.
        open_epochs:
          type: integer
          minimum: 0
          description: The consecutive epochs, up to and including last epoch, with no winner in either role; 0 when last epoch had one.
        near_misses:
          type: [integer, "null"]
          minimum: 0
          description: Both roles' near misses; null without a draw last epoch.
        available:
          $ref: "#/components/schemas/NullableAmount"
          description: |
            An estimate of what the country's next draw holds: both pots plus
            ten slots at last epoch's slot amount. Null before the first
            root.
        awarded:
          $ref: "#/components/schemas/Amount"
          description: What last epoch's winners in the country won, both roles; zero without a draw.
        providers:
          $ref: "#/components/schemas/CtfRoleState"
        extenders:
          $ref: "#/components/schemas/CtfRoleState"

    CtfTotals:
      type: object
      description: Counts over the 249 countries, from last epoch's draw.
      required: [countries, flags_held, not_fully_captured]
      properties:
        countries:
          type: integer
          description: Always 249, the ISO 3166-1 alpha-2 codes.
        flags_held:
          type: integer
          minimum: 0
          description: Countries whose ten slots were all won at last epoch's draw.
        not_fully_captured:
          description: |
            Countries where at least one of the role's five slots went
            unclaimed at last epoch's draw, so a newcomer wins by default.
            Null without a draw last epoch.
          oneOf:
            - type: object
              required: [providers, extenders]
              properties:
                providers:
                  type: integer
                  minimum: 0
                extenders:
                  type: integer
                  minimum: 0
            - type: "null"

    CtfDefinitions:
      type: object
      description: Plain definitions of the estimates the answer carries.
      required: [chance_to_win, win_estimate, available, eligibility]
      properties:
        chance_to_win:
          type: string
        win_estimate:
          type: string
        available:
          type: string
        eligibility:
          type: string

    CtfLinks:
      type: object
      description: Pages for people.
      required: [page, chance_to_win]
      properties:
        page:
          type: string
          format: uri
          description: The ur.xyz page the answer is for, the hub or a country page.
        chance_to_win:
          type: string
          format: uri
          description: Where the page defines the chance to win.

    CtfState:
      type: object
      description: The answer of `GET /sn/ctf`.
      required: [as_of, unit, pool, current_epoch, last_epoch, pending_draw, totals, definitions, links, countries]
      properties:
        as_of:
          $ref: "#/components/schemas/Timestamp"
        unit:
          $ref: "#/components/schemas/Unit"
        pool:
          $ref: "#/components/schemas/CtfPool"
        current_epoch:
          $ref: "#/components/schemas/CtfCurrentEpoch"
        last_epoch:
          description: Null before the pool's first epoch has a committed root.
          oneOf:
            - $ref: "#/components/schemas/CtfLastEpoch"
            - type: "null"
        pending_draw:
          $ref: "#/components/schemas/NullablePendingDraw"
        totals:
          $ref: "#/components/schemas/CtfTotals"
        definitions:
          $ref: "#/components/schemas/CtfDefinitions"
        links:
          $ref: "#/components/schemas/CtfLinks"
        countries:
          type: array
          description: All 249 countries, by code.
          items:
            $ref: "#/components/schemas/CtfCountryState"

    CtfHere:
      type: object
      description: The answer of `GET /sn/ctf/here`.
      required: [country]
      properties:
        country:
          description: The caller's country, or null.
          oneOf:
            - $ref: "#/components/schemas/CountryCode"
            - type: "null"

    CtfHistoryRole:
      type: object
      description: One role in one country in one epoch.
      required: [units, slots, pot_in, pot_out, awarded, median_award, winning_share]
      properties:
        units:
          type: integer
          minimum: 0
          description: The eligible units in the draw.
        slots:
          $ref: "#/components/schemas/CtfSlots"
        pot_in:
          $ref: "#/components/schemas/Amount"
          description: The pot carried into the epoch.
        pot_out:
          $ref: "#/components/schemas/Amount"
          description: The pot carried out of it.
        awarded:
          $ref: "#/components/schemas/Amount"
          description: What the role's winners won, slots and pot shares.
        median_award:
          $ref: "#/components/schemas/NullableAmount"
          description: The lower median of the winners' awards (slot and pot share), the ⌈W/2⌉-th smallest of W; null without winners.
        winning_share:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: The share of entries that won, `slots.won` / `units`; null without units.

    CtfHistoryEpoch:
      type: object
      description: One country in one epoch.
      required: [epoch, drawn, root_status, slot, providers, extenders]
      properties:
        epoch:
          type: integer
        drawn:
          type: boolean
          description: A census was committed in time and the draw ran.
        root_status:
          $ref: "#/components/schemas/RootStatus"
        slot:
          $ref: "#/components/schemas/Amount"
          description: The epoch's slot amount.
        providers:
          $ref: "#/components/schemas/CtfHistoryRole"
        extenders:
          $ref: "#/components/schemas/CtfHistoryRole"

    CtfCountryResult:
      type: object
      description: The answer of `GET /sn/ctf/country/{cc}`.
      required: [as_of, unit, pool, current_epoch, last_epoch, pending_draw, definitions, links, country, history]
      properties:
        as_of:
          $ref: "#/components/schemas/Timestamp"
        unit:
          $ref: "#/components/schemas/Unit"
        pool:
          $ref: "#/components/schemas/CtfPool"
        current_epoch:
          $ref: "#/components/schemas/CtfCurrentEpoch"
        last_epoch:
          description: Null before the pool's first epoch has a committed root.
          oneOf:
            - $ref: "#/components/schemas/CtfLastEpoch"
            - type: "null"
        pending_draw:
          $ref: "#/components/schemas/NullablePendingDraw"
        definitions:
          $ref: "#/components/schemas/CtfDefinitions"
        links:
          $ref: "#/components/schemas/CtfLinks"
        country:
          $ref: "#/components/schemas/CtfCountryState"
        history:
          type: array
          description: Every epoch from the pool's first that a committed root covers, newest first.
          items:
            $ref: "#/components/schemas/CtfHistoryEpoch"

    CtfTopEntry:
      type: object
      description: One country of `GET /sn/ctf/top`.
      required: [rank, open_pot, country]
      properties:
        rank:
          type: integer
          minimum: 1
        open_pot:
          $ref: "#/components/schemas/Amount"
          description: The pot the country ranks by, the role's or both together.
        country:
          $ref: "#/components/schemas/CtfCountryState"

    CtfTopResult:
      type: object
      description: The answer of `GET /sn/ctf/top`.
      required: [as_of, unit, current_epoch, last_epoch, pending_draw, role, include_uninhabited, definitions, links, countries]
      properties:
        as_of:
          $ref: "#/components/schemas/Timestamp"
        unit:
          $ref: "#/components/schemas/Unit"
        current_epoch:
          $ref: "#/components/schemas/CtfCurrentEpoch"
        last_epoch:
          description: The epoch the pots and slots come from; null before the pool's first epoch has a committed root.
          oneOf:
            - $ref: "#/components/schemas/CtfLastEpoch"
            - type: "null"
        pending_draw:
          $ref: "#/components/schemas/NullablePendingDraw"
        role:
          type: string
          enum: [provider, extender, any]
        include_uninhabited:
          type: boolean
        definitions:
          $ref: "#/components/schemas/CtfDefinitions"
        links:
          $ref: "#/components/schemas/CtfLinks"
        countries:
          type: array
          items:
            $ref: "#/components/schemas/CtfTopEntry"

    CtfExclusionCounts:
      type: object
      description: |
        How many of the miners the presence samples found in the role during
        the epoch each rule excluded, summed from the committed census's
        exclusion object. Each miner counts once, under the first rule it
        failed in the census's own order (the sn `ctf` package's `Reason`):
        `inactive`, `offline_at_end`, `not_public`, `no_location`,
        `own_network`, `head_bound`, `no_wallet`, `duplicate_address`,
        `country_changed`, `presence`. With `country_changed` and `presence`
        last, those two together count exactly the near misses: the miners
        every other rule admitted. This is not the order of
        `CtfExclusionReason`, in which
        `GET /sn/ctf/client` names a client's `reason`, so a miner that
        failed several rules can count here under another rule than its
        `reason` there. A rule that does not apply to the role counts 0.
      required: [offline_at_end, not_public, no_location, inactive, presence, country_changed, duplicate_address, no_wallet, head_bound, own_network]
      properties:
        offline_at_end: {type: integer, minimum: 0}
        not_public: {type: integer, minimum: 0}
        no_location: {type: integer, minimum: 0}
        inactive: {type: integer, minimum: 0}
        presence: {type: integer, minimum: 0}
        country_changed: {type: integer, minimum: 0}
        duplicate_address: {type: integer, minimum: 0}
        no_wallet: {type: integer, minimum: 0}
        head_bound: {type: integer, minimum: 0}
        own_network: {type: integer, minimum: 0}

    CtfExclusionReason:
      type: string
      description: |
        Why a client was not a candidate in a role (`GET /sn/ctf/client`),
        the first rule it failed, in this order:

        - `not_in_role`: no presence sample found it in the role during the
          epoch (`GET /sn/ctf/client` only).
        - `offline_at_end`: not an active, top-level, connected provider
          passing the operator's provider checks at the epoch's end.
        - `not_public`: its provide key is not Public.
        - `no_location`: no valid location at the epoch's end.
        - `inactive`: the extender record or all its addresses were revoked
          or inactive at the epoch's end.
        - `presence`: present in its country for less than half of the
          epoch's samples.
        - `country_changed`: its country at the end differs from where it
          was present, or an activation was in another country.
        - `duplicate_address`: a candidate with a lower client id has its
          IPv4 address or IPv6 /64.
        - `no_wallet`: no payout coldkey.
        - `head_bound`: an active fleet binding at either boundary; a head
          client earns in one tier only.
        - `own_network`: on one of the operator's own networks.

        A reason a client does not know reads as "not a candidate". The
        census's exclusion counts keep the census's own order instead
        (`CtfExclusionCounts`).
      enum: [not_in_role, offline_at_end, not_public, no_location, inactive, presence, country_changed, duplicate_address, no_wallet, head_bound, own_network]

    CtfCensus:
      type: object
      description: The census commitment and its counts.
      required: [hash, block, candidates, units, excused_samples, excluded]
      properties:
        hash:
          $ref: "#/components/schemas/Sha256Ref"
          description: The census header's sha256, the `censusHash` committed on chain; also the header's object reference.
        block:
          type: integer
          description: The block of the commitment, within 600 blocks of the epoch's end.
        candidates:
          type: integer
          minimum: 0
          description: Census rows, one per candidate client and role.
        units:
          type: object
          description: Units in the draws, per role.
          required: [providers, extenders]
          properties:
            providers: {type: integer, minimum: 0}
            extenders: {type: integer, minimum: 0}
        excused_samples:
          type: integer
          minimum: 0
          description: Samples the operator excused for a platform-wide outage it declared; the half-epoch rule counts without them.
        excluded:
          type: object
          required: [providers, extenders]
          properties:
            providers:
              $ref: "#/components/schemas/CtfExclusionCounts"
            extenders:
              $ref: "#/components/schemas/CtfExclusionCounts"

    CtfDraw:
      type: object
      description: |
        The draw's randomness: drand quicknet (chain hash
        52db9ba70e0cc0f6eaf7803dd07447a1f5477735fd3f661792ba94600c84e971),
        whose round r is published at 1692803367 + 3·(r − 1) seconds. Any
        drand relay serves the round; its signature verifies against
        quicknet's public key.
      required: [round, signature, randomness, seed]
      properties:
        round:
          type: integer
          description: The first quicknet round at least 60 seconds after the census block's timestamp.
        signature:
          type: string
          description: The round's BLS signature, 48 bytes.
          pattern: "^0x[0-9a-f]{96}$"
        randomness:
          $ref: "#/components/schemas/Bytes32"
          description: sha256 of the signature.
        seed:
          $ref: "#/components/schemas/Bytes32"
          description: |
            keccak256("urnetwork/ctf-draw/v1" ‖ chain id ‖ netuid ‖ pool id ‖
            epoch ‖ census hash ‖ randomness). Each unit's ticket is
            keccak256(seed ‖ role ‖ country ‖ unit); the smallest tickets
            win.

    CtfEpochObjects:
      type: object
      description: The epoch's ledger objects, each served by `GET /sn/ledger/object`.
      required: [header, countries, census, awards, pots, pending]
      properties:
        header:
          $ref: "#/components/schemas/Sha256Ref"
          description: The covering root's ledger header (`root.ledger_hash`).
        countries:
          $ref: "#/components/schemas/Sha256Ref"
          description: The country list, the 249 codes in order.
        census:
          description: The census header (`census.hash`); null without a census.
          oneOf:
            - $ref: "#/components/schemas/Sha256Ref"
            - type: "null"
        awards:
          $ref: "#/components/schemas/Sha256Ref"
        pots:
          $ref: "#/components/schemas/Sha256Ref"
        pending:
          $ref: "#/components/schemas/Sha256Ref"

    CtfEpochRole:
      type: object
      description: One role in one country in the epoch.
      required: [units, slots, near_misses, pot_in, pot_out, awarded, pending]
      properties:
        units:
          type: integer
          minimum: 0
        slots:
          $ref: "#/components/schemas/CtfSlots"
        near_misses:
          type: integer
          minimum: 0
        pot_in:
          $ref: "#/components/schemas/Amount"
        pot_out:
          $ref: "#/components/schemas/Amount"
        awarded:
          $ref: "#/components/schemas/Amount"
          description: The role's awards, slots and pot shares.
        pending:
          $ref: "#/components/schemas/Amount"
          description: The part of `awarded` that is pending awards, owed until an epoch matures.

    CtfEpochCountry:
      type: object
      required: [code, name, providers, extenders]
      properties:
        code:
          $ref: "#/components/schemas/CountryCode"
        name:
          type: string
        providers:
          $ref: "#/components/schemas/CtfEpochRole"
        extenders:
          $ref: "#/components/schemas/CtfEpochRole"

    CtfAward:
      type: object
      description: One winner, as its award row records it.
      required: [role, country, rank, unit_hash, unit_family, client_id, coldkey, coldkey_ss58, slot, pot_share, pending]
      properties:
        role:
          $ref: "#/components/schemas/Role"
        country:
          $ref: "#/components/schemas/CountryCode"
        rank:
          type: integer
          minimum: 1
          maximum: 5
          description: By ticket, smallest first.
        unit_hash:
          $ref: "#/components/schemas/Bytes32"
          description: The winning unit's keyed hash, as the census lists it. No address is published.
        unit_family:
          type: integer
          enum: [4, 6]
          description: An IPv4 /29 or an IPv6 /48.
        client_id:
          type: string
          format: uuid
          description: The unit's winning member.
        coldkey:
          $ref: "#/components/schemas/Coldkey"
          description: The payout coldkey the provider pool's wallet selection gives the client.
        coldkey_ss58:
          $ref: "#/components/schemas/ColdkeySs58"
        slot:
          $ref: "#/components/schemas/Amount"
        pot_share:
          $ref: "#/components/schemas/Amount"
          description: A fifth of the pot carried in, rounded down; one rao more for the best ranks when five won and the pot did not divide by five.
        pending:
          type: boolean
          description: The pot share is a pending award, paid in full in the first matured epoch, because the epoch did not mature.

    CtfPendingAward:
      type: object
      description: A pot share still owed.
      required: [award_epoch, role, country, rank, coldkey, coldkey_ss58, amount]
      properties:
        award_epoch:
          type: integer
        role:
          $ref: "#/components/schemas/Role"
        country:
          $ref: "#/components/schemas/CountryCode"
        rank:
          type: integer
          minimum: 1
          maximum: 5
        coldkey:
          $ref: "#/components/schemas/Coldkey"
        coldkey_ss58:
          $ref: "#/components/schemas/ColdkeySs58"
        amount:
          $ref: "#/components/schemas/Amount"

    CtfEpochResult:
      type: object
      description: The answer of `GET /sn/ctf/epoch/{epoch}`.
      required: [as_of, unit, pool, epoch, start_block, end_block, census, draw, amounts, slots, root, objects, countries, awards, pending_awards]
      properties:
        as_of:
          $ref: "#/components/schemas/Timestamp"
        unit:
          $ref: "#/components/schemas/Unit"
        pool:
          $ref: "#/components/schemas/CtfPool"
        epoch:
          type: integer
        start_block:
          type: integer
        end_block:
          type: integer
        census:
          description: Null when no census was committed in time.
          oneOf:
            - $ref: "#/components/schemas/CtfCensus"
            - type: "null"
        draw:
          description: Null without a census.
          oneOf:
            - $ref: "#/components/schemas/CtfDraw"
            - type: "null"
        amounts:
          $ref: "#/components/schemas/CtfEpochAmounts"
        slots:
          $ref: "#/components/schemas/CtfSlots"
        root:
          $ref: "#/components/schemas/CtfRoot"
        objects:
          $ref: "#/components/schemas/CtfEpochObjects"
        countries:
          type: array
          description: All 249 countries, by code.
          items:
            $ref: "#/components/schemas/CtfEpochCountry"
        awards:
          type: array
          description: Every award, by role (providers first), country and rank.
          items:
            $ref: "#/components/schemas/CtfAward"
        pending_awards:
          type: array
          description: The pending awards still owed after the epoch, by award epoch, role, country and rank.
          items:
            $ref: "#/components/schemas/CtfPendingAward"

    CtfPresence:
      type: object
      description: |
        The client's quarter-hour presence samples in the role: 672 an epoch.
        `required` is half of the samples the operator did not excuse,
        rounded up. `present` counts samples in the client's own country,
        which for a candidate is not always the role's `country`, its unit's
        draw country.
      required: [present, required, samples, excused]
      properties:
        present:
          type: integer
          minimum: 0
          description: |
            The samples the operator did not excuse that found it present in
            the role in its own country at the epoch's end, even a code
            outside the 249, for which `country` is null. That is the role's
            `country` unless it was a candidate whose unit draws in another
            country: `country` is then the draw's, and `present` still counts
            its own.
        required:
          type: integer
          minimum: 0
        samples:
          type: integer
          minimum: 0
        excused:
          type: integer
          minimum: 0

    CtfClientRole:
      type: object
      description: The client in one role in one epoch.
      required: [candidate, reason, country, unit_family, presence, units_in_draw, won, rank, slot, pot_share, pending, coldkey, coldkey_ss58]
      properties:
        candidate:
          type: boolean
        reason:
          description: Why it was not a candidate; null when it was.
          oneOf:
            - $ref: "#/components/schemas/CtfExclusionReason"
            - type: "null"
        country:
          description: |
            When it was a candidate, the country of its unit's draw: a unit
            enters one draw per role, in the own country of its candidate
            with the lowest client id, and its other candidates follow it
            there, so this can differ from the client's own country.
            Otherwise its own country at the epoch's end. Null when it has
            none of the 249, and when no sample found it in the role.
            `presence.present` counts samples in the client's own country,
            never in the draw's.
          oneOf:
            - $ref: "#/components/schemas/CountryCode"
            - type: "null"
        unit_family:
          type: [integer, "null"]
          enum: [4, 6, null]
        presence:
          description: Null when no sample found it in the role.
          oneOf:
            - $ref: "#/components/schemas/CtfPresence"
            - type: "null"
        units_in_draw:
          type: [integer, "null"]
          minimum: 1
          description: The units in its country's draw for the role when it was a candidate.
        won:
          type: boolean
        rank:
          type: [integer, "null"]
          minimum: 1
          maximum: 5
        slot:
          $ref: "#/components/schemas/NullableAmount"
        pot_share:
          $ref: "#/components/schemas/NullableAmount"
        pending:
          type: boolean
          description: Its pot share is a pending award.
        coldkey:
          description: The coldkey its award is paid to; null when it did not win.
          oneOf:
            - $ref: "#/components/schemas/Coldkey"
            - type: "null"
        coldkey_ss58:
          oneOf:
            - $ref: "#/components/schemas/ColdkeySs58"
            - type: "null"

    CtfClientEpoch:
      type: object
      required: [epoch, drawn, root_status, providers, extenders]
      properties:
        epoch:
          type: integer
        drawn:
          type: boolean
          description: A census was committed in time and the draw ran.
        root_status:
          $ref: "#/components/schemas/RootStatus"
        providers:
          $ref: "#/components/schemas/CtfClientRole"
        extenders:
          $ref: "#/components/schemas/CtfClientRole"

    CtfClientWin:
      type: object
      description: |
        One win of the client, or of one of the network's clients: an award
        of a committed root, as `GET /sn/ctf/epoch/{epoch}` lists it, and
        whether it is claimed (`GET /sn/ctf/client` says how that is read).
      required: [epoch, role, country, rank, client_id, amount, slot, pot_share, pending, root_status, coldkey, coldkey_ss58, claimed]
      properties:
        epoch:
          type: integer
          description: The epoch whose draw it won.
        role:
          $ref: "#/components/schemas/Role"
        country:
          $ref: "#/components/schemas/CountryCode"
          description: The country of its unit's draw.
        rank:
          type: integer
          minimum: 1
          maximum: 5
        client_id:
          type: string
          format: uuid
          description: The client that won.
        amount:
          $ref: "#/components/schemas/Amount"
          description: The whole award, `slot` and `pot_share` together.
        slot:
          $ref: "#/components/schemas/Amount"
        pot_share:
          $ref: "#/components/schemas/Amount"
        pending:
          type: boolean
          description: |
            Its pot share was a pending award, because its epoch had not
            matured; the first matured epoch after it pays it.
        root_status:
          $ref: "#/components/schemas/RootStatus"
          description: |
            The status of the committed root that covers its epoch: `pending`
            is not claimable yet.
        coldkey:
          $ref: "#/components/schemas/Coldkey"
          description: The coldkey its award is paid to, whose account in the CTF pool holds it.
        coldkey_ss58:
          $ref: "#/components/schemas/ColdkeySs58"
        claimed:
          type: [boolean, "null"]
          description: |
            Whether its coldkey's account in the CTF pool has been claimed
            through the root that pays it; null when that could not be read
            for this answer.

    CtfClientResult:
      type: object
      description: The answer of `GET /sn/ctf/client`.
      required: [as_of, unit, client_id, epochs, wins]
      properties:
        as_of:
          $ref: "#/components/schemas/Timestamp"
        unit:
          $ref: "#/components/schemas/Unit"
        client_id:
          type: [string, "null"]
          format: uuid
          description: The client a client JWT names; null for the network's credential, which names no one client.
        epochs:
          type: array
          description: The client's status per epoch, newest first; `[]` before the first root, and for the network's credential.
          items:
            $ref: "#/components/schemas/CtfClientEpoch"
        wins:
          type: array
          description: |
            The wins of the client, or of every client of the network: every
            one not known to be claimed, and every one of the `limit` most
            recent covered epochs; newest first. `[]` before the first root.
          items:
            $ref: "#/components/schemas/CtfClientWin"

    SnLedgerPoolKind:
      type: string
      description: |
        `pool`: an operator's pool, paying providers and, from epoch 8,
        extenders. `ctf`: an operator's capture the flag pool. A client that
        does not know a kind shows the entry as a pool.
      enum: [pool, ctf]

    SnLedgerAccountResult:
      type: object
      required: [coldkey, accounts, unavailable_pools]
      properties:
        coldkey:
          $ref: "#/components/schemas/Coldkey"
          description: The coldkey, `0x` and 64 lowercase hex digits.
        accounts:
          description: |
            The coldkey's account in each pool that holds it, one entry per
            pool in ascending `no_id`; `[]`, never null, for a coldkey that
            no root holds and while settlement v2 is not configured.
          type: array
          items:
            $ref: "#/components/schemas/SnLedgerAccount"
        unavailable_pools:
          description: |
            With `partial=true`, the pools whose ledger could not be read, in
            ascending `no_id`: whether the coldkey has an account there is
            unknown. Always `[]` without `partial=true`, which leaves a CTF
            pool that cannot be read out of `accounts` instead.
          type: array
          items:
            $ref: "#/components/schemas/SnLedgerUnavailablePool"

    SnLedgerAccount:
      type: object
      required: [vault, no_id, kind, label, index, root_index, cumulative, proof, claimed, pending_cumulative]
      properties:
        vault:
          $ref: "#/components/schemas/Address"
          description: The pool's settlement vault (vault2), `0x` and 40 lowercase hex digits.
        no_id:
          type: integer
          description: The pool's vault2 id, which a claim names; the operator's id for its pool, 2^32 + the operator's id for its CTF pool.
        kind:
          $ref: "#/components/schemas/SnLedgerPoolKind"
        label:
          type: string
          description: |
            An English display name for the pool, for clients without a
            localized one: "Pool 1" for operator 1's pool, as the apps name
            it, and "Capture the flag" for its CTF pool. Not for parsing.
        index:
          type: integer
          description: The account's fixed position in the pool's sum tree.
        root_index:
          description: |
            The latest finalized root's index in vault2's roots for the pool;
            null when the account is only in the pending root.
          type: [integer, "null"]
        cumulative:
          description: |
            The account's cumulative in the latest finalized root, a decimal
            string of rao; "0" when the account is only in the pending root.
          type: string
          pattern: "^[0-9]+$"
        proof:
          description: |
            The claim proof against the latest finalized root: the siblings
            from the leaf up, one per tree level, `[]` at depth 0 (a root of
            one account); null when the account is only in the pending root.
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/SnLedgerProofNode"
        claimed:
          description: |
            What vault2 has already paid the account, read at the finalized
            block tag, a decimal string of rao, never above `cumulative`; "0"
            when the account is only in the pending root, which needs no chain
            read.
          type: string
          pattern: "^[0-9]+$"
        pending_cumulative:
          description: |
            The account's cumulative in the pending root, a decimal string of
            rao; null when there is no pending root or the account is not in
            it.
          type: [string, "null"]
          pattern: "^[0-9]+$"

    SnLedgerProofNode:
      type: object
      required: [hash, sum]
      properties:
        hash:
          $ref: "#/components/schemas/Bytes32"
          description: The sibling's node hash, `0x` and 64 lowercase hex digits.
        sum:
          description: The sibling's sum, a decimal string of rao.
          type: string
          pattern: "^[0-9]+$"

    SnLedgerUnavailablePool:
      type: object
      description: A pool the answer would cover whose ledger could not be read.
      required: [vault, no_id, kind, label]
      properties:
        vault:
          $ref: "#/components/schemas/Address"
        no_id:
          type: integer
        kind:
          $ref: "#/components/schemas/SnLedgerPoolKind"
        label:
          type: string
