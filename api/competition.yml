openapi: "3.1.0"
info:
  version: 2026.9.25
  title: URnetwork Competition API
  description: |
    Control-plane API for reproducible, cached sim-latency competition rounds.
    The same server process also serves the URnetwork API described by
    connect/api/bringyour.yml. Competition paths are namespaced under
    /competition.

    Round workload seeds and score results are never returned while a round is
    active or grading. The API publishes a seed commitment and the generated
    providers.yml SHA-256 until every admitted job is terminal and the winner
    is finalized (after ordered honesty review in production), then exposes
    the seed, immutable workload, and results.
    Identical canonical patch bytes in one round map to one durable job/result.
    Before production epoch one, an operator may run an independently numbered
    staging era beginning at epoch zero. Staging submissions are fee-free but
    traverse the same durable FIFO and evaluator as production. Each staging
    epoch publishes its poll results after admission closes and all accepted
    work drains. It automatically names the highest-ranked placeable candidate
    passing every gate, without a significance or takeover-margin requirement;
    an empty or wholly unplaceable round has no winner. Newly created staging
    rounds freeze a zero takeover margin; historical rounds retain their
    original value. Staging never promotes source. Its named winner initially
    has honesty_review=not_reviewed and may become approved only after an
    explicit append-only manual review of that exact finalized winner.
    Historical finalized rankings are preserved.
    Every epoch measures one nine-run control before the first submitted build,
    freezes its exact baseline.json bytes and SHA-256, and reuses that control
    for every candidate in the epoch. Candidate ranking uses absolute raw
    latency; normalized score is display-only.
    Historical epochs scored before shared controls were introduced retain
    their original per-job control samples and normalized-score-first ranking.
    Committing production epoch one atomically ends the staging era and cancels
    queued staging work; it refuses to race a running staging evaluation.
  contact:
    name: URnetwork
    email: support@ur.xyz
    url: https://ur.io
  license:
    name: Mozilla Public License, v. 2.0
    url: https://mozilla.org/MPL/2.0/
servers:
  - url: https://api.bringyour.com

tags:
  - name: Competition
    description: Public round information and score submission.
  - name: Competition operator
    description: Authenticated round administration.

paths:
  /competition/healthz:
    get:
      operationId: CompetitionHealth
      tags: [Competition]
      security: []
      summary: Process liveness
      responses:
        "200":
          description: The API process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionHealthResult"

  /competition/readyz:
    get:
      operationId: CompetitionReady
      tags: [Competition operator]
      summary: Deep competition readiness
      description: |
        Fails closed unless durable storage, the FIFO worker lease path, the
        frozen round policy, artifact storage, and the authoritative evaluator
        host passes its current self-check.
      responses:
        "200":
          description: Ready to accept score jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionReadinessResult"
        "401":
          $ref: "#/components/responses/CompetitionUnauthorized"
        "503":
          $ref: "#/components/responses/CompetitionUnavailable"

  /competition/info:
    get:
      operationId: CompetitionInfo
      tags: [Competition]
      security: []
      summary: Published non-secret run and scoring policy
      responses:
        "200":
          description: Current immutable competition policy and active round commitment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionInfoResult"
        "503":
          $ref: "#/components/responses/CompetitionUnavailable"

  /competition/leaderboard:
    get:
      operationId: CompetitionLeaderboard
      tags: [Competition]
      security: []
      summary: Published final results for completed epochs
      description: |
        Returns only finalized production epochs by default. Set
        include_staging=true to also return finalized staging epochs through
        the same reconciliation shape. Staging epochs are explicitly marked
        and automatically name the highest-ranked placeable winner passing every gate,
        or publish winner_job_id as null if none qualifies. A staging winner
        remains not_reviewed until explicitly approved by a manual operator
        review; staging never promotes source. Entries are
        deterministically ordered by absolute raw score ascending, submission
        time, and job id for shared-control epochs. Historical per-job-control
        epochs retain normalized score descending before those tie breakers;
        their already-published rankings are not rewritten. Public rows identify
        the immutable job and patch, not
        bearer-token principals. An epoch is not published until admission has
        closed, every accepted job is terminal, and finalization commits
        atomically.
      parameters:
        - name: include_staging
          in: query
          required: false
          description: Include finalized fee-free staging epochs after their embargo lifts.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Finalized epoch leaderboards and winners.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionSeasonLeaderboardResult"
        "503":
          $ref: "#/components/responses/CompetitionUnavailable"

  /competition/generate-round:
    post:
      operationId: CompetitionGenerateRound
      tags: [Competition operator]
      summary: Generate and commit a hidden-seed round
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionGenerateRoundArgs"
      responses:
        "201":
          description: Round created; no seed is disclosed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionRoundResult"
        "400":
          $ref: "#/components/responses/CompetitionBadRequest"
        "401":
          $ref: "#/components/responses/CompetitionUnauthorized"
        "409":
          $ref: "#/components/responses/CompetitionConflict"
        "503":
          $ref: "#/components/responses/CompetitionUnavailable"

  /competition/generate-staging-round:
    post:
      operationId: CompetitionGenerateStagingRound
      tags: [Competition operator]
      summary: Generate the next pre-production staging epoch
      description: |
        Creates the next independently numbered staging epoch, beginning with
        epoch zero. Staging submissions exercise authenticated patch
        validation, immutable artifact retention, cache identity, the real
        evaluator FIFO, embargo, and result publication without charging a fee
        or promoting source. After close and drain, staging automatically names
        its highest-ranked placeable winner passing every gate, or no winner.
        Explicit retrospective staging approval is available for the named
        winner. Every job uses the authenticated
        append-only one-control-per-epoch baseline path used by production,
        while the separately promoted production host-readiness rebaseline
        identity is not required. A prior staging epoch must be
        finalized unless replace_current explicitly supersedes it; replacement
        refuses while an evaluation is running. No staging epoch may be created
        after the first production epoch is committed.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionGenerateStagingRoundArgs"
      responses:
        "201":
          description: Staging round created; use its round_id for test submissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionRoundResult"
        "400":
          $ref: "#/components/responses/CompetitionBadRequest"
        "401":
          $ref: "#/components/responses/CompetitionUnauthorized"
        "409":
          $ref: "#/components/responses/CompetitionConflict"
        "503":
          $ref: "#/components/responses/CompetitionUnavailable"

  /competition/close-staging-round:
    post:
      operationId: CompetitionCloseStagingRound
      tags: [Competition operator]
      summary: Close current staging admission and preserve its FIFO
      description: |
        Atomically stops accepting submissions for the current open staging
        epoch without canceling accepted jobs. The evaluator continues in FIFO
        order until every accepted job is terminal, then automatically names
        the highest-ranked placeable winner passing every gate (or no winner),
        finalizes, and reveals the staging epoch without source promotion.
        This can precede scheduled reveal_at; the committed schedule is unchanged.
        Repeating the operation while grading or after
        finalization is idempotent.
      responses:
        "200":
          description: Staging admission is closed or was already closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionRoundResult"
        "401":
          $ref: "#/components/responses/CompetitionUnauthorized"
        "409":
          $ref: "#/components/responses/CompetitionConflict"
        "503":
          $ref: "#/components/responses/CompetitionUnavailable"

  /competition/round/{roundId}/providers.yml:
    get:
      operationId: CompetitionGetRoundWorkload
      tags: [Competition]
      security: []
      summary: Download the committed workload after epoch finalization
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Byte-identical providers.yml whose SHA-256 was published at round creation.
          headers:
            ETag:
              schema:
                type: string
            X-Content-SHA256:
              schema:
                $ref: "#/components/schemas/Sha256"
          content:
            application/yaml:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/CompetitionBadRequest"
        "404":
          $ref: "#/components/responses/CompetitionNotFound"
        "409":
          $ref: "#/components/responses/CompetitionConflict"
        "503":
          $ref: "#/components/responses/CompetitionUnavailable"

  /competition/score:
    post:
      operationId: CompetitionSubmitScore
      tags: [Competition]
      summary: Validate, cache, and enqueue an already canonical patch
      description: |
        The response is asynchronous. Submitting identical canonical patch
        bytes for the same round returns the existing job and cannot buy
        another draw from evaluator noise. Accepted unique jobs are unbounded
        per epoch and enter the single FIFO immediately. The Apex adapter
        collects the published $20 USD submission fee exactly once before
        forwarding a production admission. A response with `staging: true`
        is fee-free but otherwise enters the same FIFO evaluator. Its score or
        full evaluation error remains embargoed until that staging epoch
        closes, drains, and automatically finalizes with an eligible significant
        winner or no winner, without honesty review; execution status and a
        reviewed message-free terminal failure code remain visible. An
        explicitly superseded staging epoch, or
        one interrupted by production epoch one, exposes only a non-retriable
        staging cleanup reason rather than a measured outcome. Any
        patch operation targeting
        `connect/sim-latency/**` is a terminal invalid submission; the
        simulator, runner, and scorer implementation is not an editable
        competition surface.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionScoreArgs"
      responses:
        "202":
          description: The durable job was accepted or returned from cache.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionScoreAcceptedResult"
        "400":
          $ref: "#/components/responses/CompetitionBadRequest"
        "401":
          $ref: "#/components/responses/CompetitionUnauthorized"
        "404":
          $ref: "#/components/responses/CompetitionNotFound"
        "409":
          $ref: "#/components/responses/CompetitionConflict"
        "413":
          description: Patch exceeds the published byte limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionError"
        "422":
          description: Patch is structurally invalid or outside the allowlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionError"
        "429":
          description: Temporary admission backpressure; retry the identical submission after Retry-After.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionError"
        "503":
          $ref: "#/components/responses/CompetitionUnavailable"

  /competition/score/{jobId}:
    get:
      operationId: CompetitionGetScore
      tags: [Competition]
      summary: Poll one cached score job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current durable processing state. evaluation_status exposes only the evaluator lifecycle and a sanitized terminal failure code; score, gates, diagnostics, and full eval_error remain embargoed until epoch finalization (after honesty review in production, automatic after close and drain in staging).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionScoreJobResult"
        "400":
          $ref: "#/components/responses/CompetitionBadRequest"
        "401":
          $ref: "#/components/responses/CompetitionUnauthorized"
        "404":
          $ref: "#/components/responses/CompetitionNotFound"
        "503":
          $ref: "#/components/responses/CompetitionUnavailable"

components:
  securitySchemes:
    CompetitionBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Competition submitter or operator token.

  responses:
    CompetitionBadRequest:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CompetitionError"
    CompetitionUnauthorized:
      description: Missing or invalid competition bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CompetitionError"
    CompetitionNotFound:
      description: Round or job does not exist, or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CompetitionError"
    CompetitionConflict:
      description: Request conflicts with immutable round or job state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CompetitionError"
    CompetitionUnavailable:
      description: Competition evaluation is disabled or not ready.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CompetitionError"

  schemas:
    CompetitionHealthResult:
      type: object
      additionalProperties: false
      required: [status, version, time]
      properties:
        status:
          type: string
          const: alive
        version:
          type: string
        time:
          type: string
          format: date-time

    CompetitionReadinessResult:
      type: object
      additionalProperties: false
      required: [ready, checks, checked_at]
      properties:
        ready:
          type: boolean
        checks:
          type: object
          additionalProperties:
            type: boolean
        checked_at:
          type: string
          format: date-time

    CompetitionInfoResult:
      type: object
      additionalProperties: false
      required:
        - competition_id
        - enabled
        - score_schema
        - scorer_version
        - base_sha
        - evaluator_image_digest
        - patch_policy
        - evaluation_policy
        - season_policy
      properties:
        competition_id:
          type: string
          minLength: 1
        enabled:
          type: boolean
        score_schema:
          type: integer
          const: 1
        scorer_version:
          type: string
          const: sim-latency-score/1
        base_sha:
          $ref: "#/components/schemas/GitSha"
        evaluator_image_digest:
          $ref: "#/components/schemas/ImageDigest"
        patch_policy:
          $ref: "#/components/schemas/CompetitionPatchPolicy"
        evaluation_policy:
          $ref: "#/components/schemas/CompetitionEvaluationPolicy"
          description: Frozen policy of the active production round, otherwise the current staging round, when one exists; defaults to configured production policy before any round. New staging rounds report takeover_margin 0.
        season_policy:
          $ref: "#/components/schemas/CompetitionSeasonPolicy"
        active_round:
          oneOf:
            - $ref: "#/components/schemas/CompetitionRoundResult"
            - type: "null"
        staging_round:
          description: The latest round in the staging era, omitted after production epoch one is committed.
          oneOf:
            - $ref: "#/components/schemas/CompetitionRoundResult"
            - type: "null"

    CompetitionPatchPolicy:
      type: object
      additionalProperties: false
      required: [max_patch_bytes, allowed_paths, forbidden_paths]
      properties:
        max_patch_bytes:
          type: integer
          minimum: 1
          maximum: 262144
        allowed_paths:
          type: array
          minItems: 1
          uniqueItems: true
          description: Exact literal existing Go files; glob patterns are rejected.
          items:
            type: string
        forbidden_paths:
          type: array
          minItems: 1
          uniqueItems: true
          description: Must explicitly include `connect/sim-latency/**`; that tree is also denied independently by the validator.
          items:
            type: string

    CompetitionEvaluationPolicy:
      type: object
      additionalProperties: false
      required:
        - hardware_id
        - host_qualification_sha256
        - config_local_sha256
        - vault_local_sha256
        - simulator_sha256
        - scorer_sha256
        - provider_count
        - client_pool_size
        - arrivals_per_minute
        - quality_window_size
        - exchange_hosts
        - fleet_shards
        - site_listen
        - api_port
        - ramp_ms
        - prewarm_ms
        - settle_ms
        - client_warmup_timeout_ms
        - duration_ms
        - request_timeout_ms
        - pipeline_interval_ms
        - test_timeout_ms
        - announce_timeout_ms
        - impairment_enabled
        - replicates
        - takeover_margin
        - queue_limit
        - score_timeout_seconds
      properties:
        hardware_id:
          type: string
          minLength: 1
        host_qualification_sha256:
          $ref: "#/components/schemas/Sha256"
        config_local_sha256:
          $ref: "#/components/schemas/Sha256"
        vault_local_sha256:
          $ref: "#/components/schemas/Sha256"
        simulator_sha256:
          $ref: "#/components/schemas/Sha256"
        scorer_sha256:
          $ref: "#/components/schemas/Sha256"
        provider_count:
          type: integer
          minimum: 1
        client_pool_size:
          type: integer
          minimum: 1
        arrivals_per_minute:
          type: integer
          minimum: 1
        quality_window_size:
          type: integer
          minimum: 0
          maximum: 32
        exchange_hosts:
          type: integer
          minimum: 1
        fleet_shards:
          type: integer
          minimum: 0
        site_listen:
          type: string
        api_port:
          type: integer
          minimum: 1
          maximum: 65535
        ramp_ms:
          type: integer
          minimum: 0
        prewarm_ms:
          type: integer
          minimum: 0
        settle_ms:
          type: integer
          minimum: 0
        client_warmup_timeout_ms:
          type: integer
          minimum: 1
        duration_ms:
          type: integer
          minimum: 1
        request_timeout_ms:
          type: integer
          minimum: 1
        pipeline_interval_ms:
          type: integer
          minimum: 1
        test_timeout_ms:
          type: integer
          minimum: 1
        announce_timeout_ms:
          type: integer
          minimum: 1
        impairment_enabled:
          type: boolean
        replicates:
          type: integer
          minimum: 1
          description: Odd run count used once for the epoch control and independently for each candidate; production freezes this at nine.
        takeover_margin:
          type: number
          minimum: 0
          maximum: 0.5
          description: Zero for staging rounds created under the no-margin policy; production rounds retain their strictly positive frozen margin. Historical staging rounds keep their original value.
        queue_limit:
          type: integer
          const: 0
          description: Frozen sentinel for unbounded unique submissions per epoch.
        score_timeout_seconds:
          type: integer
          const: 10800
          description: Total execution budget for one submission across all attempts and retry backoff; queue wait before its first claim is excluded.

    CompetitionSeasonPolicy:
      type: object
      additionalProperties: false
      required: [epoch_count, submission_window_seconds, preparation_window_seconds, submission_fee_usd]
      properties:
        epoch_count:
          type: integer
          const: 6
        submission_window_seconds:
          type: integer
          const: 604800
        preparation_window_seconds:
          description: Time reserved for the same-round rebaseline before submissions open.
          type: integer
          minimum: 0
          maximum: 604800
        submission_fee_usd:
          type: integer
          const: 20
          description: Fee collected exactly once by the Apex adapter for each admitted submission.

    CompetitionGenerateRoundArgs:
      type: object
      additionalProperties: false
      required: [opens_at, closes_at, reveal_at]
      properties:
        opens_at:
          type: string
          format: date-time
        closes_at:
          type: string
          format: date-time
        reveal_at:
          type: string
          format: date-time

    CompetitionGenerateStagingRoundArgs:
      type: object
      additionalProperties: false
      description: |
        Omitting every timestamp creates an immediately open 48-hour staging
        epoch. If any timestamp is supplied, all three are required; the window
        must be from one minute through seven days and reveal_at must equal
        closes_at.
      dependentRequired:
        opens_at: [closes_at, reveal_at]
        closes_at: [opens_at, reveal_at]
        reveal_at: [opens_at, closes_at]
      properties:
        opens_at:
          type: string
          format: date-time
        closes_at:
          type: string
          format: date-time
        reveal_at:
          type: string
          format: date-time
        replace_current:
          type: boolean
          default: false
          description: Cancel a non-finalized staging round and its queued jobs before creating the next epoch; rejected while a job is running.

    CompetitionRoundResult:
      type: object
      additionalProperties: false
      required:
        - round_id
        - epoch
        - staging
        - status
        - workload_commitment
        - providers_sha256
        - score_schema
        - opens_at
        - closes_at
        - reveal_at
        - created_at
      properties:
        round_id:
          type: string
          format: uuid
        epoch:
          type: integer
          minimum: 0
          description: Staging epochs begin at zero and advance independently; production epochs are 1 through 6.
        staging:
          type: boolean
          description: True for a fee-free pre-production epoch evaluated against frozen source epoch zero and excluded from winner promotion and the production leaderboard.
        status:
          type: string
          enum: [scheduled, open, grading, finalized, canceled]
        workload_commitment:
          $ref: "#/components/schemas/Sha256"
        providers_sha256:
          description: SHA-256 of the exact generated providers.yml bytes.
          $ref: "#/components/schemas/Sha256"
        score_schema:
          type: integer
          const: 1
        opens_at:
          type: string
          format: date-time
        closes_at:
          type: string
          format: date-time
        reveal_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        admission_closed_at:
          description: Present when an operator ended staging admission early without changing the committed schedule. Accepted FIFO work continues through grading.
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        finalized_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        winner_job_id:
          description: Named automatic staging winner or approved production winner after publication; null when no candidate qualifies. Historical finalized winners are unchanged.
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        revealed_seed:
          description: Production requires reveal_at and atomic post-review finalization. Staging requires actual admission close, complete FIFO drain, and automatic finalization, which may precede scheduled reveal_at after an explicit early close.
          oneOf:
            - type: string
              pattern: "^[0-9a-f]{64}$"
            - type: "null"
        providers_url:
          description: Production requires reveal_at and atomic post-review finalization. Staging requires actual admission close, complete FIFO drain, and automatic finalization, which may precede scheduled reveal_at after an explicit early close.
          type: string
          pattern: "^/competition/round/[0-9a-f-]+/providers\\.yml$"

    CompetitionSeasonLeaderboardResult:
      type: object
      additionalProperties: false
      required: [competition_id, epochs]
      properties:
        competition_id:
          type: string
          minLength: 1
        epochs:
          type: array
          items:
            $ref: "#/components/schemas/CompetitionLeaderboardResult"

    CompetitionLeaderboardResult:
      type: object
      additionalProperties: false
      required: [competition_id, round_id, epoch, staging, status, finalized_at, winner_job_id, entries]
      properties:
        competition_id:
          type: string
          minLength: 1
        round_id:
          type: string
          format: uuid
        epoch:
          type: integer
          minimum: 0
          description: Staging sequence from zero, or production epoch in 1..6.
        staging:
          type: boolean
          description: True only for a fee-free pre-production staging epoch.
        status:
          type: string
          const: finalized
        finalized_at:
          type: string
          format: date-time
        winner_job_id:
          description: Automatically selected placeable staging winner passing every gate, or honesty-approved significant production winner; null when no candidate qualifies. Historical finalized results are preserved.
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/CompetitionLeaderboardEntry"

    CompetitionLeaderboardEntry:
      type: object
      additionalProperties: false
      required: [rank, job_id, patch_sha256, submitted_at, winner, honesty_review, score, submitter_count]
      properties:
        rank:
          type: integer
          minimum: 1
        job_id:
          type: string
          format: uuid
        patch_sha256:
          $ref: "#/components/schemas/Sha256"
        submitted_at:
          type: string
          format: date-time
        winner:
          type: boolean
        honesty_review:
          type: string
          enum: [approved, rejected, not_reviewed]
          description: >-
            Final production operator honesty-review disposition. A staging
            winner starts not_reviewed and can become approved only after an
            explicit append-only manual review; staging never promotes source.
            Rejected significant candidates remain visible after the epoch embargo lifts but cannot
            be selected or promoted as the winner.
        score:
          $ref: "#/components/schemas/CompetitionScoreResult"
        submitter_count:
          type: integer
          minimum: 1

    CompetitionScoreArgs:
      type: object
      additionalProperties: false
      required: [round_id, patch]
      properties:
        round_id:
          type: string
          format: uuid
        patch:
          type: string
          minLength: 1
          maxLength: 262144
          description: |
            Exact UTF-8 unified-diff bytes. The API validates but does not
            rewrite this value: use LF (`0x0a`) line endings, no CR bytes,
            and exactly one final LF (the value must end in `\n` but not
            `\n\n`). File sections must be sorted lexicographically by path
            and use canonical `diff --git`, `--- a/path`, `+++ b/path`, and
            valid `@@` hunk forms. Only regular 100644 modifications to the
            published allowlist are accepted. Preserve the final LF when
            encoding JSON; shell command substitution commonly removes it.

    CompetitionScoreAcceptedResult:
      type: object
      additionalProperties: false
      required: [job_id, round_id, staging, patch_sha256, state, cache_hit, status_url]
      properties:
        job_id:
          type: string
          format: uuid
        round_id:
          type: string
          format: uuid
        staging:
          type: boolean
          description: True for a fee-free staging-era job that enters the real FIFO evaluator against source epoch zero.
        patch_sha256:
          $ref: "#/components/schemas/Sha256"
        state:
          $ref: "#/components/schemas/CompetitionJobState"
        cache_hit:
          type: boolean
        status_url:
          type: string
          pattern: "^/competition/score/[0-9a-f-]+$"

    CompetitionScoreJobResult:
      type: object
      additionalProperties: false
      required:
        - job_id
        - round_id
        - staging
        - patch_sha256
        - state
        - evaluation_status
        - submitted_at
        - cache_key
        - evaluator_image_digest
        - api_image_digest
      properties:
        job_id:
          type: string
          format: uuid
        round_id:
          type: string
          format: uuid
        staging:
          type: boolean
          description: True for a fee-free staging-era job evaluated against source epoch zero and published through polling after staging finalization.
        patch_sha256:
          $ref: "#/components/schemas/Sha256"
        state:
          $ref: "#/components/schemas/CompetitionJobState"
        evaluation_status:
          $ref: "#/components/schemas/CompetitionEvaluationStatus"
        evaluation_failure:
          description: Present only when evaluation_status is failed and the terminal kind/code pair is on the reviewed public allowlist. Omitted for unknown codes; never contains the evaluator message, readiness, score, gates, or diagnostics.
          oneOf:
            - $ref: "#/components/schemas/CompetitionEvaluationFailure"
            - type: "null"
        submitted_at:
          type: string
          format: date-time
        started_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        completed_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        cache_key:
          $ref: "#/components/schemas/Sha256"
        evaluator_image_digest:
          $ref: "#/components/schemas/ImageDigest"
          description: Exact epoch evaluator container content identity frozen in the job's immutable round policy.
        api_image_digest:
          $ref: "#/components/schemas/ImageDigest"
          description: Exact main API container content identity that admitted the job; control-plane provenance, not a scoring input.
        worker_image_digest:
          $ref: "#/components/schemas/ImageDigest"
          description: Exact main worker container content identity for the current or terminal attempt; control-plane provenance, not a scoring input.
        score:
          oneOf:
            - $ref: "#/components/schemas/CompetitionScoreResult"
            - type: "null"
        eval_error:
          oneOf:
            - $ref: "#/components/schemas/CompetitionError"
            - type: "null"

    CompetitionJobState:
      type: string
      description: completed is the outcome-neutral state returned during the result embargo.
      enum: [queued, running, completed, succeeded, failed, canceled]

    CompetitionEvaluationStatus:
      type: string
      description: Additive polling lifecycle. completed means evaluation produced a score but reveals no score value, placeability, gate, significance, or diagnostic; failed is terminal and is visible during the result embargo. Legacy servers may omit this field during a rolling deployment, in which case clients can derive queued/running/canceled directly from state but must treat state completed as outcome-neutral.
      enum: [queued, running, completed, failed, canceled]

    CompetitionEvaluationFailure:
      type: object
      additionalProperties: false
      required: [kind, code, retriable]
      description: Message-free terminal failure summary. The complete eval_error remains embargoed, and unknown unreviewed code values produce no summary.
      properties:
        kind:
          type: string
          enum: [submission, infrastructure]
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]{1,63}$"
        retriable:
          type: boolean
          const: false

    CompetitionScoreResult:
      type: object
      additionalProperties: false
      required: [score_schema, placeable, gates, significance]
      properties:
        score_schema:
          type: integer
          const: 1
        raw_score:
          description: Absolute candidate median of replicate p95 request latency in milliseconds; lower is better and this is the ranking key. Present only after atomic epoch finalization (after honesty review in production, automatic in staging).
          type: number
          exclusiveMinimum: 0
        normalized_score:
          description: Display-only ratio derived from the epoch's shared control; it is never a ranking input. Present only after atomic epoch finalization (after honesty review in production, automatic in staging).
          type: number
          minimum: 1
          maximum: 200
        placeable:
          type: boolean
        takeover_eligible:
          type: boolean
          description: True only when correctness gates, the epoch margin, and the per-candidate shared-control significance test all pass; production additionally requires honesty review. Staging records this diagnostic but does not require it to name its best placeable winner.
        gates:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CompetitionGate"
        significance:
          $ref: "#/components/schemas/CompetitionScoreSignificance"
        diagnostics:
          type: object
          additionalProperties: true

    CompetitionScoreSignificance:
      type: object
      additionalProperties: false
      required:
        - method
        - alpha
        - replicate_count
        - baseline_mean_raw_score
        - candidate_mean_raw_score
        - baseline_sample_variance
        - candidate_sample_variance
        - observed_improvement_percent
        - takeover_margin_percent
        - minimum_significant_improvement_percent
        - required_improvement_percent
        - one_sided_p_value
        - statistically_significant
        - next_epoch_minimum_improvement_percent
        - recommended_next_epoch_takeover_margin_percent
        - recommended_next_epoch_takeover_margin_supported
      properties:
        method:
          type: string
          const: one-sided-welch-t
        alpha:
          type: number
          const: 0.05
        replicate_count:
          type: integer
          minimum: 1
          maximum: 9
        baseline_mean_raw_score:
          description: Mean of the one immutable epoch control sample reused by every candidate in this epoch.
          type: number
          exclusiveMinimum: 0
        candidate_mean_raw_score:
          type: number
          exclusiveMinimum: 0
        baseline_sample_variance:
          description: Sample variance (n-1) of the immutable epoch control's replicate raw scores; null only for R=1.
          oneOf:
            - type: number
              minimum: 0
            - type: "null"
        candidate_sample_variance:
          description: Sample variance (n-1) of candidate replicate raw scores; null only for R=1.
          oneOf:
            - type: number
              minimum: 0
            - type: "null"
        observed_improvement_percent:
          type: number
        takeover_margin_percent:
          description: Empirically calibrated aggregate-score floor frozen for this epoch.
          type: number
          exclusiveMinimum: 0
          maximum: 50
        minimum_significant_improvement_percent:
          description: One-sided Welch critical difference divided by the baseline mean; null only for R=1.
          oneOf:
            - type: number
              minimum: 0
            - type: "null"
        required_improvement_percent:
          description: Greater of the epoch takeover floor and measured Welch threshold; null only for R=1.
          oneOf:
            - type: number
              minimum: 0
            - type: "null"
        one_sided_p_value:
          description: Candidate-lower-than-baseline Welch p-value computed from this candidate's independent runs and the shared epoch control; null only for R=1.
          oneOf:
            - type: number
              minimum: 0
              maximum: 1
            - type: "null"
        welch_t:
          type: number
        welch_degrees_of_freedom:
          type: number
          exclusiveMinimum: 0
        statistically_significant:
          type: boolean
        next_epoch_minimum_improvement_percent:
          description: Minimum detectable improvement derived from candidate variance as the next incumbent; null only for R=1.
          oneOf:
            - type: number
              minimum: 0
            - type: "null"
        recommended_next_epoch_takeover_margin_percent:
          description: Conservative next-epoch margin, never below this epoch's calibrated takeover floor; null only for R=1.
          oneOf:
            - type: number
              exclusiveMinimum: 0
            - type: "null"
        recommended_next_epoch_takeover_margin_supported:
          description: True only when the recommendation is within the scorer's supported (0%, 50%] range.
          type: boolean

    CompetitionGate:
      type: object
      additionalProperties: false
      required: [passed, details]
      properties:
        passed:
          type: boolean
        details:
          type: object
          additionalProperties: true

    CompetitionError:
      type: object
      additionalProperties: false
      required: [kind, code, message, retriable]
      properties:
        kind:
          type: string
          enum: [auth, submission, infrastructure]
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]{1,63}$"
        message:
          type: string
          minLength: 1
          maxLength: 1024
        retriable:
          type: boolean
        readiness:
          description: Authenticated per-dependency detail for operator readiness failures.
          $ref: "#/components/schemas/CompetitionReadinessResult"

    Sha256:
      type: string
      pattern: "^[0-9a-f]{64}$"

    GitSha:
      type: string
      pattern: "^[0-9a-f]{40}$"

    ImageDigest:
      type: string
      pattern: "^sha256:[0-9a-f]{64}$"

security:
  - CompetitionBearerAuth: []
